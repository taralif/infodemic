// Ad hoc fallback only now — the primary path is doEnterCode() below. Kept
// under its own function/button ("No code? Just start a room") rather than
// removed, matching the standalone lobby's same choice.
function doCreateRoom(){
  var name = document.getElementById("lobbyName").value.trim();
  if(!name){ lobbyStatus = {msg:"Enter your name first.", error:true}; render(); return; }
  lobbyStatus = {msg:"Creating room…", error:false}; render();
  InfodemicSync.createRoom(name).then(function(result){
    onJoinedRoom(result.code, result.player.id);
  }).catch(function(err){
    lobbyStatus = {msg:err.message, error:true}; render();
  });
}
// The one real path: a bare drop word mints a fresh table, a full code joins
// an existing one. Replaces the old separate doCreateRoom/doJoinRoom split
// for the primary "I have a code" flow. See enterCode() in supabase-sync.js.
function doEnterCode(){
  var name = document.getElementById("lobbyName").value.trim();
  var code = document.getElementById("lobbyCode").value.trim();
  if(!name){ lobbyStatus = {msg:"Enter your name first.", error:true}; render(); return; }
  if(!code){ lobbyStatus = {msg:"Enter a code.", error:true}; render(); return; }
  lobbyStatus = {msg: /^[A-Za-z]+-\d+$/.test(code) ? "Joining…" : "Looking up that drop…", error:false}; render();
  InfodemicSync.enterCode(code, name).then(function(result){
    onJoinedRoom(result.code, result.player.id);
  }).catch(function(err){
    lobbyStatus = {msg:err.message, error:true}; render();
  });
}
function onJoinedRoom(code, playerId){
  roomCode = code;
  myPlayerId = playerId;
  MY_ID = playerId;
  lobbyStatus = {msg:"", error:false};
  InfodemicSync.getPlayers(code).then(applyPlayers);
  InfodemicSync.getRoomState(code).then(applyRemoteState);
  InfodemicSync.subscribeRoom(code, {
    onPlayersChange: applyPlayers,
    onStateChange: applyRemoteState
  });
  loadDropForRoom(code);
  render();
}

// ---- Loading a published drop's real cards into the actual Feed ----
// This is the piece that was missing: everything up to here proved the room/
// drop plumbing works, but Round 1 still read the hardcoded CLAIMS array
// regardless of which drop a room was attached to. Swap CLAIMS wholesale
// (safe: it's a top-level `var`, and every render path reads it live, not a
// snapshot taken at load) if — and only if — this room has a real drop.
// Ad hoc rooms (no drop_id) keep the original hand-authored deck untouched.
var currentDropTitle = null;
function hueForSubject(subject, idx){
  var h = 0;
  for(var i=0;i<subject.length;i++) h += subject.charCodeAt(i);
  return HUE_PALETTE[(h+idx) % HUE_PALETTE.length];
}
// Pipeline cards -> the game's CLAIMS shape. subject, hue, sourceUrl, and
// variants come from the drop as before. As of 8/14/2026 the pipeline also
// generates Round 2 content (hook, poster background, evidence clips) per
// card, so `wired` now reflects whether THIS card actually has that content —
// most will; a card published with no hook/clips (the curator console's own
// "not every story needs a flag lens" counterweight) stays wired:false and
// falls through to the game's existing empty-state handling, same as before.
function mapDropCardsToClaims(cards){
  return cards.map(function(c, idx){
    var claimId = 9000 + idx;
    var mappedClips = (c.clips||[]).map(function(cl){
      return {
        id: claimId + "-" + cl.id, source: cl.source, text: cl.text, who: cl.who,
        detail: cl.detail, tell: cl.tell, image: cl.image, reverseSearch: cl.reverseSearch
      };
    });
    // Always set CLIPS[claimId], even to [] — renderClaimSearch does an
    // unguarded CLIPS[claim.id].filter(...) for any wired claim, so this has
    // to exist before wired can safely be true.
    CLIPS[claimId] = mappedClips;
    return {
      id: claimId,
      subject: c.subject,
      hue: hueForSubject(c.subject || "", idx),
      sourceUrl: c.sourceUrl || c.url || "",
      wired: !!(c.hook && mappedClips.length),
      hook: c.hook || "",
      background: c.background || null,
      // Playtest note (8/18/2026): the front card's source pill used to always show
      // c.source (the underlying outlet, e.g. "TechCrunch") regardless of variant,
      // while Background Check always examines c.background (a specific account,
      // e.g. "@AIHypeDaily") — two different names for what's supposed to read as
      // the same post. Background's handle now wins whenever one exists, since
      // that's the account Background Check actually opens on.
      // Per-variant background (Tara, 8/24/2026): every variant used to inherit the
      // card's single account, so the poster and the Background-check profile were
      // identical no matter which framing you were reading - a wire-style version
      // and a hype version came from the same handle. hub-spoke already fixed this
      // by putting `background` on the variant; the drop pipeline had regressed it.
      // Variant background wins; the card-level one is the fallback (and is what the
      // red/hype variant still uses, since only the green variant carries its own).
      variants: (c.variants||[]).map(function(v){
        var bg = v.background || c.background || null;
        return { headline: v.claim, background: bg,
                 source: (bg && bg.handle) || c.source || "Source", tell: v.tell || null };
      })
    };
  });
}
function loadDropForRoom(code){
  InfodemicSync.getDropForRoom(code).then(function(drop){
    if(drop && drop.cards && drop.cards.length){
      CLAIMS = mapDropCardsToClaims(drop.cards);
      // CLIPS[claim.id] for each card is already populated by the map above —
      // this call only needs to inject each claim's background as a CLIPS
      // entry and seed clipState, same as the hardcoded deck gets at page load.
      wireInvestigationData(CLAIMS);
      currentDropTitle = drop.title;
    } else {
      currentDropTitle = null;
      // CLAIMS stays whatever it already was (the original hardcoded deck) —
      // no drop means no override.
    }
    render();
  }).catch(function(err){
    console.error("loadDropForRoom failed", err);
  });
}
function applyPlayers(rows){
  PLAYERS = rows.map(function(r){
    return {id:r.id, name:r.name, initial:r.initial, color:r.color, isYou:r.id===myPlayerId};
  });
  render();
}
// Merges the canonical Supabase room state into local globals. Fires on the
// initial fetch after joining AND on every subsequent realtime update (from
// any player, including this client's own writes echoing back). Only three
// fields are shared at all — claimVotes, board, and the round's startedAt —
// everything else (which screen you're on, which card is flipped, Search/AI
// exploration) is local-only per player, on purpose.
function applyRemoteState(state){
  state = state || {};
  if(state.claimVotes) claimVotes = state.claimVotes;
  if(state.board){
    Object.keys(state.board).forEach(function(cid){
      BOARD[cid] = state.board[cid];
      // Someone else filing a case counts the same as filing it yourself — snapshot
      // this client's view of how far that story got, so the report populates for
      // every player, not just whoever tapped File.
      if(BOARD[cid] && BOARD[cid].filed) recordFiling(cid);
    });
    // ...and if theirs was the last one, the session ends for the whole table at
    // once. Deliberately derived from the board state that already syncs rather than
    // added as a 5th synced field — there's nothing to agree on beyond "is every
    // case filed", which every client can already see for itself.
    if(allCasesFiled()) endSession();
  }
  if(state.roundState && state.roundState.startedAt) adoptSharedStart(state.roundState.startedAt);
  // Onboarding ready-state (see onboardMarkReady) — a 4th synced field, beyond the
  // three documented above, so another player's "I'm ready" tap can close out a
  // teamGated tour on THIS client too, not just theirs.
  if(state.onboardReady){
    onboardReady = state.onboardReady;
    if(pendingOnboard && ONBOARD_CONTENT[pendingOnboard].teamGated && isTeamReady(pendingOnboard) && !seenOnboard[pendingOnboard]){
      finalizeOnboard(pendingOnboard);
    }
  }
  if(currentApp!=="lobby") render();
}
function enterGame(){
  currentApp = "round1";
  render();
}
// ---- write helpers: local mutation already happened by the time these are
// called (see castVote/addToBoard/etc.) — these just persist + broadcast it.
// Fire-and-forget, last-write-wins, per the "whatever's easiest for MVP" call —
// see multiplayer/MULTIPLAYER_SETUP.md for what that trades away.
function syncVote(claimId){
  if(!roomCode) return;
  InfodemicSync.updateRoomState(roomCode, function(state){
    state.claimVotes = state.claimVotes || {};
    state.claimVotes[claimId] = claimVotes[claimId];
    return state;
  }).catch(function(e){ console.error("vote sync failed", e); });
}
function syncBoard(claimId){
  if(!roomCode) return;
  InfodemicSync.updateRoomState(roomCode, function(state){
    state.board = state.board || {};
    state.board[claimId] = BOARD[claimId];
    return state;
  }).catch(function(e){ console.error("board sync failed", e); });
}
function syncRoundStart(startedAtMs){
  if(!roomCode) return;
  InfodemicSync.updateRoomState(roomCode, function(state){
    state.roundState = state.roundState || {};
    state.roundState.startedAt = startedAtMs;
    return state;
  }).catch(function(e){ console.error("round-start sync failed", e); });
}

// ---------------- ROUND 1 TIMER ----------------
// Timer no longer auto-starts on render — the table decides when it's ready
// (see renderRound1Start / beginRound1 below).
//
// Multiplayer note: the ONLY thing that needs to sync for the timer is the
// shared startedAt timestamp — whoever taps "Start Round 1" writes it to the
// room, and every other client's local tick just computes secondsLeft off
// that same shared timestamp (see adoptSharedStart). Nothing about the tick
// itself is server-authoritative; each client independently notices when its
// own clock reaches 0. Good enough for a small cooperative table, per the
// "whatever's easiest for MVP" call.
var roundTimerHandle = null;
function startTicking(){
  roundTimerHandle = setInterval(function(){
    var elapsed = Math.floor((Date.now()-roundState.startedAt)/1000);
    roundState.secondsLeft = Math.max(0, 60-elapsed);
    if(roundState.secondsLeft<=0 && !roundState.ended && !roundState.showingTimesUp){
      // Time's up: hold on the interstitial until the table explicitly continues
      // (see dismissTimesUp) — it no longer auto-advances on its own.
      roundState.showingTimesUp = true;
      clearInterval(roundTimerHandle);
      if(currentApp==="round1") render();
    } else if(currentApp==="round1" && !roundState.showingTimesUp){
      // Only touch the countdown badge directly instead of calling the full render() —
      // rebuilding the whole feed's innerHTML every 250ms was destroying and recreating
      // the vote buttons out from under a tap in progress, which is why picking a color
      // sometimes took several clicks to register (and why auto-advance-to-next-card
      // sometimes looked broken — the smooth scroll got cut off mid-animation by the
      // next rebuild). The countdown is the only thing that actually changes each tick,
      // so that's the only thing that needs to update.
      var badge = document.getElementById("roundbadge");
      if(badge){
        badge.textContent = "⏱ " + roundState.secondsLeft + "s";
        badge.className = "roundbadge" + (roundState.secondsLeft<=10 ? " urgent" : "");
      } else {
        render();
      }
    }
  }, 250);
}
function beginRound1(){
  if(roundState.started) return;
  roundState.started = true;
  roundState.startedAt = Date.now();
  startTicking();
  render();
  syncRoundStart(roundState.startedAt);
}
// Fires when another player's "Start Round 1" tap arrives over sync, or when
// this client fetches room state on join and a round is already underway —
// both cases just mean "adopt the shared start time and begin ticking locally."
function adoptSharedStart(startedAtMs){
  if(roundState.started) return;
  roundState.started = true;
  roundState.startedAt = startedAtMs;
  startTicking();
  if(currentApp==="round1") render();
}
// Demo/testing shortcut — tap the countdown badge to skip straight to Time's Up,
// instead of waiting out the full 60s. Mirrors exactly what the interval above does
// when it naturally hits 0.
function forceTimesUp(){
  if(!roundState.started || roundState.ended || roundState.showingTimesUp) return;
  if(roundTimerHandle) clearInterval(roundTimerHandle);
  roundState.secondsLeft = 0;
  roundState.showingTimesUp = true;
  if(currentApp==="round1") render();
}
function endRound1(){
  roundState.ended = true;
  roundState.justEnded = true;
  // Clock the moment claims became contested-and-loose — every "loose 3:20" in the
  // end-of-session report is measured from here.
  roundState.endedAt = Date.now();
}

// ---------------- VOTES / SORTING ----------------
function castVote(claimId, call){
  if(roundState.ended) return;
  claimVotes[claimId] = claimVotes[claimId] || {};
  var cur = claimVotes[claimId][MY_ID];
  claimVotes[claimId][MY_ID] = (cur===call) ? null : call;
  render();
  syncVote(claimId);
  // Picking a color (not un-picking one) bounces you straight to the next card —
  // keeps the gut-check moving instead of making players manually scroll each time.
  if(claimVotes[claimId][MY_ID] !== null) scrollToNextCard(claimId);
}
// scrollAnimUntil guards the engagement-gravity tick above from rebuilding the
// feed mid-scroll (see that tick's comment) — 700ms comfortably covers a
// smooth scrollIntoView over a typical one-card gap.
var scrollAnimUntil = 0;
function scrollToNextCard(claimId){
  var current = document.getElementById("slide-"+claimId);
  if(!current || !current.nextElementSibling) return;
  var next = current.nextElementSibling;
  if(typeof next.scrollIntoView === "function"){
    scrollAnimUntil = Date.now() + 700;
    next.scrollIntoView({behavior:"smooth", block:"start"});
  }
}
function claimVotesFor(claim){
  // Reads real per-player votes from the synced claimVotes map (claimVotes[id][playerId]).
  // claim.npcVotes is unused now — left in CLAIMS as harmless leftover data from the
  // solo-simulated prototype rather than stripped out of all 7 claim objects.
  var v = {};
  PLAYERS.forEach(function(p){
    v[p.id] = (claimVotes[claim.id] && claimVotes[claim.id][p.id]) || null;
  });
  return v;
}
function claimStatus(claim){
  if(!roundState.ended) return "voting";
  var v = claimVotesFor(claim);
  var vals = Object.keys(v).map(function(k){ return v[k]; }).filter(function(x){ return x!=null; });
  var uniq = vals.filter(function(x,i){ return vals.indexOf(x)===i; });
  // Nobody called it at all. This used to fall through to "agreed" below, because
  // zero distinct answers also satisfies uniq.length<=1 - so an untouched story got
  // reported as a table decision. Silence isn't consensus (Tara, 8/24/2026).
  if(vals.length===0) return "skipped";
  return uniq.length<=1 ? "agreed" : "contested";
}

// ---------------- NAV ----------------
function goHome(){ currentApp = "round1"; render(); }
// There's no separate full-screen claim view anymore — everything about a story
// (investigate, case board) lives on that story's own card. Jumping to a claim from
// elsewhere (e.g. the Spread's "top contested claim" tile) means: go back to the
// feed, flip that card open straight to its Board tab, and scroll it into view.
function openClaim(id){
  var claim = claimById(id);
  if(claimStatus(claim)!=="contested") return;
  currentApp = "round1";
  openSpoke(id, "board");
  setTimeout(function(){
    var el = document.getElementById("slide-"+id);
    if(el && typeof el.scrollIntoView === "function") el.scrollIntoView({behavior:"smooth", block:"start"});
  }, 50);
}
function openApp(name){ currentApp = name; render(); }

// ---------------- CARD FLIP (inline Round 2 investigation) ----------------
// Pure front<->back toggle — only used by the back face's own ↩ close control now.
// Filed claims can still flip (to review the read-only board/receipt), they just
// can't reach Search/Ask AI anymore — renderCardBack enforces that, not this.
function flipCard(claimId){
  var claim = claimById(claimId);
  if(claimStatus(claim)!=="contested") return;
  if(!seenOnboard.investigate) return; // whole table clears the Investigate tour before anyone can flip a card open
  claimFlipped[claimId] = !claimFlipped[claimId];
  render();
}
// Front-face buttons use this instead — always flips IN (never toggles back out,
// since these buttons are only reachable while the front face is showing) and can
// jump straight to a specific spoke. Passing no mode leaves cardMode as-is, which
// means "investigate" reopens wherever you last left off, or the move-menu the very
// first time — see renderCardBack/renderMoveMenu.
function openSpoke(claimId, mode){
  var claim = claimById(claimId);
  if(claimStatus(claim)!=="contested") return;
  if(!seenOnboard.investigate) return; // same gate as flipCard — finalizeOnboard() flips this true before its own hand-off call
  claimFlipped[claimId] = true;
  if(mode) cardMode[claimId] = mode;
  render();
}
function setCardMode(claimId, mode){ cardMode[claimId] = mode; render(); }

// ---------------- ROUND 1 RENDER ("For You" immersive feed) ----------------
// The onboarding tour (see maybeShowOnboard/ONBOARD_CONTENT) covers this screen
// immediately on entry and now owns starting the round — its last screen's
// "I'm ready" IS the start action once the whole table's tapped it (see
// finalizeOnboard). No separate start button here anymore: that button was "whoever
// taps first, starts for everyone" with no visibility into who was actually ready,
// which is exactly the "feels like you can play without your team" gap from the
// 8/16 playtest. This screen is only what's faintly visible behind the tour scrim.
function renderRound1Start(){
  var html = '<div class="r1start">';
  html += '<div class="r1startbadge">ROUND 1</div>';
  html += '<div class="r1starttitle">Gut Check</div>';
  html += '<div class="r1startsub">'+CLAIMS.length+' stories, one shared 60-second clock. Red, yellow, or green — go with your gut on each one before time runs out.</div>';
  html += '<div class="r1starthint">Getting your table ready…</div>';
  html += '</div>';
  document.getElementById("screenArea").innerHTML = html;
}
function renderRound1TimesUp(){
  var html = '<div class="r1timesup">';
  html += '<span class="r1timesupclose" onclick="dismissTimesUp()">✕</span>';
  html += '<div class="r1timesupbig">⏰ TIME\'S UP</div>';
  html += '<div class="r1timesuptitle">Let\'s see where you landed</div>';
  html += '<div class="r1timesupsub">Tap continue to go through each story, one at a time — how it was called, and where your table agreed or split.</div>';
  html += '<div class="r1timesupbtn" onclick="dismissTimesUp()">Continue</div>';
  html += '</div>';
  document.getElementById("screenArea").innerHTML = html;
}
// Stays on screen until the table explicitly continues (or X's out) — no auto-timeout.
function dismissTimesUp(){
  roundState.showingTimesUp = false;
  startRoundReveal();
}

// ---------------- ROUND REVEAL (Jackbox-style, one story at a time) ----------------
function startRoundReveal(){
  endRound1(); // locks in final vote tallies so claimStatus/claimVotesFor are stable through the reveal
  revealState.active = true;
  revealState.index = 0;
  revealState.order = CLAIMS.slice();
  if(currentApp==="round1") render();
}
function revealNext(){
  if(revealState.index < revealState.order.length - 1){
    revealState.index++;
    if(currentApp==="round1") render();
  } else {
    finishRoundReveal();
  }
}
function skipRoundReveal(){ finishRoundReveal(); }
function finishRoundReveal(){
  revealState.active = false;
  roundState.justEnded = true; // still shows the feed's shuffle-into-place animation
  if(currentApp==="round1") render();
  setTimeout(function(){
    // Let the shuffle actually settle before the Round 2 sheet slides up —
    // otherwise the popup covers the animation you're trying to show off.
    roundState.readyForR2Popup = true;
    if(currentApp==="round1") maybeShowOnboard();
  }, 900);
}
function renderRoundReveal(){
  var claim = revealState.order[revealState.index];
  var variant = variantForPlayer(claim, MY_ID);
  var v = claimVotesFor(claim);
  var status = claimStatus(claim);
  var isLast = revealState.index === revealState.order.length - 1;

  var html = '<div class="reveal">';
  html += '<span class="revealskip" onclick="skipRoundReveal()">Skip ✕</span>';
  html += '<div class="revealprogress">Story '+(revealState.index+1)+' of '+revealState.order.length+'</div>';
  html += '<div class="revealsubject">'+claim.subject+'</div>';
  html += '<div class="revealheadline">'+variant.headline+'</div>';

  html += '<div class="revealvotes">';
  PLAYERS.forEach(function(p, i){
    var vote = v[p.id];
    var cls = vote || "none";
    html += '<div class="revealvoteitem" style="animation-delay:'+(i*160)+'ms;">';
    html += '<div class="revealavatar '+cls+'">'+(vote ? CALL_META[vote].emoji : "—")+'</div>';
    html += '<div class="revealvotename">'+(p.isYou?"You":p.name)+'</div>';
    html += '</div>';
  });
  html += '</div>';

  var verdictDelay = PLAYERS.length*160 + 250;
  if(status==="skipped"){
    html += '<div class="revealverdict skipped" style="animation-delay:'+verdictDelay+'ms;">⏭️ Nobody called this one</div>';
  } else if(status==="agreed"){
    html += '<div class="revealverdict agreed" style="animation-delay:'+verdictDelay+'ms;">✅ Table agreed</div>';
  } else {
    html += '<div class="revealverdict contested" style="animation-delay:'+verdictDelay+'ms;">⚡ Contested — worth a closer look</div>';
  }

  html += '<div class="revealnextbtn" onclick="revealNext()">'+(isLast ? "See Round 2 →" : "Next →")+'</div>';
  html += '</div>';
  document.getElementById("screenArea").innerHTML = html;
}

function renderRound1(){
  if(!roundState.started){ renderRound1Start(); return; }
  if(roundState.showingTimesUp){ renderRound1TimesUp(); return; }
  if(revealState.active){ renderRoundReveal(); return; }
  var justSorted = roundState.justEnded;
  roundState.justEnded = false;

  var contested = CLAIMS.filter(function(c){ return claimStatus(c)==="contested"; });
  var agreed = CLAIMS.filter(function(c){ return claimStatus(c)==="agreed"; });
  var voting = CLAIMS.filter(function(c){ return claimStatus(c)==="voting"; });
  // Skipped sits last: not contested (nothing to investigate), but not a decision
  // either, so it shouldn't be mixed in among the cards the table actually settled.
  var skipped = CLAIMS.filter(function(c){ return claimStatus(c)==="skipped"; });
  var order = roundState.ended ? contested.concat(agreed).concat(skipped) : voting;

  // Preserve scroll position across re-renders (timer ticks, vote taps) so scrolling
  // through the feed isn't reset every 250ms. The one exception is right after the
  // round sorts — that's the intentional "pull contested claims to the front" moment.
  var prevEl = document.getElementById("feedscroll");
  var prevScroll = prevEl ? prevEl.scrollTop : 0;
  // Same idea for any flipped card's own inline scroll region (evidence marking, mode
  // switches, and the AI typing reveal all trigger a full re-render too) — otherwise
  // reading through Search results would keep getting yanked back to the top.
  var prevCardScrolls = {};
  Object.keys(claimFlipped).forEach(function(id){
    if(!claimFlipped[id]) return;
    var el = document.getElementById("cardback-scroll-"+id);
    if(el) prevCardScrolls[id] = el.scrollTop;
  });

  // Round/timer/spread info now lives once in a persistent top bar instead of being
  // repeated on every card — keeps each card focused on just its own story.
  var s = spreadStats();
  var pr = s.total>0 ? Math.round(100*s.redHeat/s.total) : 0;
  var html = '<div class="r1topbar"><div><div class="r1toptitle">For You</div>';
  var topsub = roundState.ended
    ? (sessionState.ended ? 'Session complete · '+contested.length+' cases filed' : contested.length+' contested · '+agreed.length+' agreed')
    : 'Round 1 · Gut check';
  html += '<div class="r1topsub">'+topsub+'</div></div>';
  html += '<div class="r1toptools">';
  // Once the session's over the report is reachable again from here — dismissing it
  // shouldn't mean losing it.
  if(sessionState.ended) html += '<div class="sessionbadge" onclick="openEndReport()">📋 Report</div>';
  html += '<div class="spreadbadge" onclick="openApp(\'spread\')">🔥 '+pr+'%</div>';
  // Pro Tips lives here now instead of on every card's rail — it's not tied to any
  // one story, so it belongs in the persistent header, not repeated per-card.
  html += '<div class="tipsbadge" onclick="openApp(\'tells\')">🧠</div>';
  if(!roundState.ended) html += '<div class="roundbadge'+(roundState.secondsLeft<=10?' urgent':'')+'" id="roundbadge" onclick="forceTimesUp()">⏱ '+roundState.secondsLeft+'s</div>';
  html += '</div></div>';

  html += '<div class="feedscroll" id="feedscroll">';
  order.forEach(function(c, idx){ html += renderFeedCard(c, justSorted, idx); });
  html += '</div>';
  document.getElementById("screenArea").innerHTML = html;

  var newEl = document.getElementById("feedscroll");
  if(newEl && !justSorted) newEl.scrollTop = prevScroll;
  Object.keys(prevCardScrolls).forEach(function(id){
    var el = document.getElementById("cardback-scroll-"+id);
    if(el) el.scrollTop = prevCardScrolls[id];
  });
}
function renderFeedCard(claim, justSorted, idx){
  var status = claimStatus(claim);
  var variant = variantForPlayer(claim, MY_ID);
  var myVote = (claimVotes[claim.id] && claimVotes[claim.id][MY_ID]) || null;
  var bg = 'linear-gradient(200deg, hsl('+claim.hue+',55%,22%), #05060a 70%)';
  var eng = BASE_ENGAGEMENT[claim.id] || 10;
  var likes = formatCount(Math.round(eng*1000 + claim.id*173));
  var comments = formatCount(Math.round(eng*180 + claim.id*37));
  var board = getBoard(claim.id);
  var flipped = !!claimFlipped[claim.id];

  // Right after the round ends, cards visibly shuffle into their new order —
  // staggered by position so contested claims appear to settle into the front
  // of the deck one after another, not just pop in all at once.
  var justSorting = justSorted && roundState.ended;
  var cardCls = "feedcard" + (justSorting ? " justsorted" : "");
  var styleAttr = justSorting ? ('animation-delay:'+(Math.min(idx,8)*70)+'ms;') : '';
  var html = '<div class="'+cardCls+'" style="'+styleAttr+'" id="slide-'+claim.id+'">';
  html += '<div class="cardflip-inner'+(flipped?' flipped':'')+'">';

  // ---- FRONT FACE: the feed card itself, unchanged from before ----
  html += '<div class="cardface cardface-front" style="background:'+bg+';">';
  html += '<div class="feedtopscrim"></div><div class="feedbottomscrim"></div>';

  // Rail is decorative/ambient furniture now (poster avatar + the spinning disc) —
  // everything actionable and story-specific (investigate, case board, agreed/filed
  // status) moved down into the corner cluster and the vote area below, and Pro Tips
  // moved up into the persistent header since it isn't tied to any one story.
  html += '<div class="feedrail">';
  html += '<div class="railavatar">'+posterInitial(variant)+'</div>';
  if(roundState.ended && status==="skipped"){
    html += '<div class="railitem"><span class="railicon">⏭️</span><span class="raillabel skipped">skipped</span></div>';
  }
  if(roundState.ended && status==="agreed"){
    html += '<div class="railitem"><span class="railicon">✅</span><span class="raillabel agreed">agreed</span></div>';
  }
  html += '<div class="raildisc">🎵</div>';
  html += '</div>';

  // Corner action cluster — the story's two spokes, always visible together once
  // it's contested (per Tara: investigate + case board should both be clearly present
  // on the card, not hidden behind one generic flip icon). Still deliberately quiet —
  // small glassy circles with a soft pulse, not a loud full-width red CTA — modeled on
  // flashcard-app / card-game corners, just now two of them side by side.
  if(roundState.ended && status==="contested" && !board.filed){
    var invLocked = !seenOnboard.investigate;
    html += '<div class="flipcluster'+(invLocked?' locked':'')+'">';
    html += '<div class="flipnub-wrap" onclick="openSpoke('+claim.id+')"><div class="flipnub">'+(invLocked?'🔒':'🔍')+'</div><div class="flipnub-label">'+(invLocked?'wait':'dig in')+'</div></div>';
    html += '<div class="flipnub-wrap" onclick="openSpoke('+claim.id+',\'board\')"><div class="flipnub">'+(invLocked?'🔒':('🗂️'+(board.board.length>0?('<span class="flipnub-badge">'+board.board.length+'</span>'):'')))+'</div><div class="flipnub-label">'+(invLocked?'wait':'case')+'</div></div>';
    html += '</div>';
  }

  // Everything about the STORY — source, subject, headline, vote — lives in this one
  // block on the card. Source is tappable: expands to show which platform it's from.
  html += '<div class="feedbottom">';
  var srcExpanded = !!sourceExpanded[claim.id];
  html += '<div class="cardsource" onclick="handleSourceTap('+claim.id+')">🔗 '+variant.source+' <span class="chev">'+(srcExpanded?'▲':'▼')+'</span></div>';
  if(srcExpanded) html += '<div class="cardsourceextra">via '+domainFor(claim.sourceUrl)+'</div>';
  html += '<div class="subjecttag">'+claim.subject+'</div>';
  // Once a case is filed, the verdict is the single most important thing about this
  // card — promoted above the headline, not buried after the vote reveal, so it's the
  // first real information you hit. The gut-check votes still render below (readonly
  // stoplight + "see who voted"), so seeing both together on the same card IS the
  // then/now comparison — no separate delta table needed elsewhere.
  if(roundState.ended && status==="contested" && board.filed){
    html += '<div class="hubfiled" onclick="openSpoke('+claim.id+',\'board\')"><span class="hubstamp">FILED ✓</span><span class="hubverdict">'+CALL_META[board.teamCall].emoji+' '+CALL_META[board.teamCall].label+'</span></div>';
  }
  html += '<div class="headline">'+variant.headline+'</div>';
  html += '<div class="cardstats"><span>❤️ '+likes+'</span><span>💬 '+comments+'</span></div>';

  if(!roundState.ended){
    html += '<div class="stoplight">';
    [["misinfo","red"],["biased","yellow"],["true","green"]].forEach(function(pair){
      var k = pair[0], colorCls = pair[1];
      html += '<span class="stoplightopt '+colorCls+(myVote===k?' selected':'')+'" onclick="castVote('+claim.id+',\''+k+'\')">'+CALL_META[k].emoji+'</span>';
    });
    html += '</div>';
  } else {
    // Round's over — votes reveal, grouped by who called what (Jared's idea:
    // expand under the buttons rather than a row of avatars). This stays on the
    // FRONT face — Tara: you don't need to know how others voted while investigating.
    var v = claimVotesFor(claim);
    var groups = {misinfo:[], biased:[], "true":[]};
    PLAYERS.forEach(function(p){
      var vote = v[p.id];
      if(vote && groups[vote]) groups[vote].push(p.isYou ? "You" : p.name);
    });
    html += '<div class="stoplight readonly">';
    [["misinfo","red"],["biased","yellow"],["true","green"]].forEach(function(pair){
      var k = pair[0], colorCls = pair[1];
      html += '<span class="stoplightopt '+colorCls+(myVote===k?' selected':'')+'"><span class="stoplightcount">'+groups[k].length+'</span></span>';
    });
    html += '</div>';
    var expanded = !!voteExpanded[claim.id];
    html += '<div class="voteexpand" onclick="toggleVoteExpand('+claim.id+')">'+(expanded?'▴ Hide who voted':'▾ See who voted')+'</div>';
    if(expanded){
      html += '<div class="votegroups">';
      [["misinfo","🚩 Misinfo"],["biased","🤔 Biased"],["true","✅ True"]].forEach(function(pair){
        var k = pair[0], label = pair[1];
        html += '<div class="votegrouprow"><span class="vglabel">'+label+'</span><span class="vgnames">'+(groups[k].length ? groups[k].join(", ") : "—")+'</span></div>';
      });
      html += '</div>';
    }
    if(status==="contested"){
      // Filed verdict now shows up top (see hubfiled, above the headline) instead of
      // here — this spot stays reserved for unfiled contested claims, which show
      // nothing extra: the corner cluster is their investigate/case board trigger.
    } else {
      html += '<div class="agreedcta">✅ Table agreed — set aside</div>';
    }
  }
  html += '</div>'; // end feedbottom
  html += '</div>'; // end cardface-front

  // ---- BACK FACE: inline investigation, only meaningful for contested claims ----
  html += '<div class="cardface cardface-back">';
  if(status==="contested") html += renderCardBack(claim, variant);
  html += '</div>';

  html += '</div>'; // end cardflip-inner
  html += '</div>'; // end feedcard
  return html;
}
function renderCardBack(claim, variant){
  // Left unset the first time (no default) so the move-menu shows before any mode
  // is chosen — see renderMoveMenu below.
  var mode = cardMode[claim.id];
  var board = getBoard(claim.id);
  var html = '<div class="cardback-head">';
  html += '<span class="cardback-flipclose" onclick="flipCard('+claim.id+')">↩</span>';
  html += '<div class="cardback-titlewrap"><div class="cardback-subject">'+claim.subject+' · investigating</div><div class="cardback-headline">'+variant.headline+'</div></div>';
  html += '</div>';
  html += '<div class="cardback-scroll" id="cardback-scroll-'+claim.id+'">';
  if(board.filed){
    // Case closed — always land straight on the (read-only) board/receipt, no menu
    // or tabs to get lost in. Search/Ask AI aren't reachable post-filing.
    html += renderClaimBoard(claim);
  } else if(!mode){
    // First entry into this story's workspace: an explicit choice of how to dig in,
    // rather than silently defaulting into Search — this is the "more agency" moment.
    html += renderMoveMenu(claim);
  } else {
    html += '<div class="cardmodetabs">';
    [["search","🔍"],["ai","🤖"],["background","🕵️"],["board","🗂️"]].forEach(function(pair){
      var badge = (pair[0]==="board" && board.board.length>0) ? ' ('+board.board.length+')' : '';
      html += '<div class="cardmodetab'+(mode===pair[0]?' active':'')+'" onclick="setCardMode('+claim.id+',\''+pair[0]+'\')">'+pair[1]+badge+'</div>';
    });
    html += '</div>';
    if(mode==="search") html += renderClaimSearch(claim);
    else if(mode==="ai") html += renderClaimAI(claim);
    else if(mode==="background") html += renderClaimBackground(claim);
    else html += renderClaimBoard(claim);
  }
  html += '</div>';
  return html;
}
// The "how do you wanna dig in" move picker — shown once per story, the first time
// its card is opened. After a move is picked, cardMode is sticky and the small tab
// bar (above) takes over for switching between Search / Ask AI / Board without
// having to flip back out and back in — this is what makes one flip cover every
// spoke, instead of the flip itself trying to double as the mode switcher.
function renderMoveMenu(claim){
  // No generic "worth a closer look" kicker — it's a static label that doesn't always
  // match the actual hook (not every claim's hook is about a number/stat worth
  // scrutinizing), so it's just the hook text itself now.
  var html = '<div class="cardhook">'+(claim.hook||"")+'</div>';
  html += '<div class="moveintro">How do you wanna dig in?</div>';
  html += '<div class="movegrid">';
  [
    ["search","move-search","🔍","Search the web","Pull up what's out there."],
    ["ai","move-ai","🤖","Ask AI","Get a take, then question it."],
    ["background","move-bg","🕵️","Background check","Who's really behind this post?"],
    ["board","move-board","🤝","Compare notes","See what your table's found — and file when ready."]
  ].forEach(function(m){
    html += '<div class="movecard '+m[1]+'" onclick="setCardMode('+claim.id+',\''+m[0]+'\')">';
    html += '<div class="moveicon">'+m[2]+'</div>';
    html += '<div class="movetitlewrap"><div class="movetitle">'+m[3]+'</div><div class="movedesc">'+m[4]+'</div></div>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}
function navbarBack(title, backFn){
  window.__navback = backFn;
  return '<div class="navbar"><span class="navback" onclick="window.__navback()">‹</span><span class="navtitle">'+title+'</span><span style="width:30px;"></span></div>';
}
function renderClaimSearch(claim){
  var html = "";
  if(!claim.wired){ return html + '<div class="emptystate">No results yet for this claim.</div>'; }
  var clips = CLIPS[claim.id].filter(function(c){ return c.source!=="ai" && c.source!=="background"; });
  var addedCount = clips.filter(function(c){ return clipState[c.id].shared; }).length;
  html += '<div class="sectionhead">Results · '+addedCount+' added to your case</div>';
  html += '<div class="groupcard">';
  clips.forEach(function(c){
    var s = clipState[c.id];
    html += '<div class="resultrow">' + renderClipImage(c) + '<div class="resulttext">'+c.text+'</div>' + renderReverseBlock(c);
    if(!s.revealed){
      html += '<div class="pillrow">';
      ["Friend","Influencer","News / institution","Can't tell — bot or AI?"].forEach(function(opt){
        html += '<span class="pillbtn" onclick="revealClip(\''+c.id+'\',\''+opt.replace(/'/g,"\\'")+'\')">'+opt+'</span>';
      });
      html += '</div>';
    } else if(!s.shared){
      // No "skip"/reject action anymore — 2026-08-12, Tara's call: players just add
      // what they want to their case, nothing to explicitly dismiss. Leaving a clip
      // alone IS the "doesn't hold up" signal now, no button needed for it.
      html += '<div class="revealtext">'+c.detail+'</div>';
      html += '<div class="rowctrl"><button class="btnfilled evidence" onclick="addToBoard('+claim.id+',\''+c.id+'\')">+ Add to case</button></div>';
    } else {
      html += '<div class="resolvedtext"><span>✓ Added to case</span></div>';
    }
    html += '</div>';
  });
  html += '</div>';
  return html;
}
function revealClip(id, guess){ clipState[id].who = guess; clipState[id].revealed = true; render(); }
function addToBoard(claimId, clipId){
  // clipState (revealed/shared/skipped) stays local/per-player on purpose —
  // Search/Ask AI/Background investigation is meant to be individual (each
  // player digs into their own copy of the evidence). Only the outcome —
  // what actually lands on BOARD[claimId].board — is the pooled, synced part.
  clipState[clipId].shared = true;
  maybeUnlock(clipId);
  var b = getBoard(claimId);
  if(b.board.indexOf(clipId)===-1) b.board.push(clipId);
  render();
  syncBoard(claimId);
}
// skipClip removed 2026-08-12 — no more explicit reject action, see renderClaimSearch.

function renderClaimAI(claim){
  var html = '<div class="chatbubble user">Is this true?<br>"'+variantForPlayer(claim,MY_ID).headline+'"</div>';
  if(!aiRevealed[claim.id]){
    html += '<div class="chatbubble ai typing"><span class="typingdots">● ● ●</span></div>';
    setTimeout(function(){
      aiRevealed[claim.id] = true;
      if(currentApp==="round1" && claimFlipped[claim.id] && (cardMode[claim.id]||"search")==="ai") render();
    }, 1100);
    return html;
  }
  var aiClips = (CLIPS[claim.id]||[]).filter(function(c){ return c.source==="ai"; });
  if(aiClips.length===0) return html + '<div class="chatbubble ai">I don\'t have anything specific on this one yet.</div>';
  var addedCount = aiClips.filter(function(c){ return clipState[c.id].shared; }).length;
  html += '<div class="sectionhead">AI response · '+addedCount+' added to your case</div>';
  aiClips.forEach(function(c){
    var s = clipState[c.id];
    html += '<div class="chatbubble ai">'+c.text+'</div>';
    if(!s.shared){
      html += '<div class="rowctrl"><button class="btnfilled evidence" onclick="addToBoard('+claim.id+',\''+c.id+'\')">+ Add to case</button></div>';
    } else {
      html += '<div class="resolvedtext"><span>✓ Added to case</span></div>';
    }
  });
  return html;
}

// "Who's really behind this post" — a short account snapshot per claim (flags +
// a one-line note), injected into CLIPS as a source:"background" item so it can be
// marked as evidence and shows up on the shared board exactly like any other exhibit.
// The money panel under a profile. Answers "who pays for this, and what do they get
// out of it" using only what a platform would actually publish about an account —
// ownership, revenue, and whether paid posts are disclosed. No verdict: an account
// funded by the company it's posting about isn't lying, it just isn't neutral, and
// that's the reader's call to make. Renders nothing when a profile has no funding
// data rather than printing an empty shell.
function renderFundingPanel(b){
  if(!b || !b.funding || !b.funding.length) return "";
  var html = '<div class="profileabout"><div class="pahead">\u2139\ufe0f About this account</div>';
  b.funding.forEach(function(row){
    html += '<div class="parow"><div class="pak">'+row.k+'</div><div class="pav">'+row.v+'</div></div>';
  });
  return html + '</div>';
}
function renderClaimBackground(claim){
  // The profile you open has to be the account that posted YOUR version of the card.
  var myV = variantForPlayer(claim, MY_ID);
  var b = (myV && myV.background) || claim.background;
  var clipId = "bg-"+claim.id;
  if(!b || !clipState[clipId]) return '<div class="emptystate">No background info for this one yet.</div>';
  var s = clipState[clipId];
  // A real profile page, not a list of labeled red flags — no "here's what's wrong
  // with this account" callouts. Whatever's worth noticing (a suspiciously young
  // account, a bio that undercuts its own authority, a link-in-bio incentive) has to
  // be read off the profile itself, same as it would on the real platform.
  var html = '<div class="profilecard">';

function renderClaimBoard(claim){
  var b = getBoard(claim.id);

  if(justFiled) justFiledClaimId = null;

  if(b.filed) html += '<div class="stamp'+(justFiled?' justfiled':'')+'">FILED ✓</div>';
  html += '<div class="sectionhead">Evidence ('+b.board.length+')</div>';
  html += '<div class="groupcard">';
  // The post itself is always the first exhibit — everything else in this list is
  // context gathered about it. This also retires the separate "compare everyone's
  // version" section further down: the post is already right here, no need to repeat
  // it in a second grid.
  var postVariant = variantForPlayer(claim, MY_ID);
  var postEng = BASE_ENGAGEMENT[claim.id] || 10;
  var postLikes = formatCount(Math.round(postEng*1000 + claim.id*173));
  var postComments = formatCount(Math.round(postEng*180 + claim.id*37));
  html += '<div class="resultrow"><span class="exhibitlabel">THE POST</span>';
  html += '<div class="resulttext" style="margin-top:4px;">'+postVariant.headline+'</div>';
  html += '<div style="font-size:11.5px; color:var(--ios-label2);">'+postVariant.source+' · ❤️ '+postLikes+' · 💬 '+postComments+'</div></div>';
  if(b.board.length===0){
    html += '<div class="resultrow"><span style="color:var(--ios-label2); font-size:13px;">Nothing else pooled yet — go find something in Search or Ask AI and file it here.</span></div>';
  } else {
    var allClips = CLIPS[claim.id];
    b.board.forEach(function(clipId, idx){
      var clip = allClips.find(function(x){ return x.id===clipId; });
      var kind = clip.tell ? tellKind(clip.tell) : "none";
      var origin = clip.source==="ai" ? "🤖 " : "";
      // Tactic-name labels ("· Misleading chart") pulled off exhibit rows on 2026-08-12 —
      // Tara wants Pro Tips content out of the game loop until its best use is figured
      // out, but kept the top-bar nav link to the standalone library itself.
      html += '<div class="resultrow"><span class="exhibitlabel">EXHIBIT '+letterFor(idx)+'</span><div class="resulttext" style="margin-top:4px;">'+origin+clip.text+'</div></div>';
    });

  html += '</div>';

  html += '<div class="sectionhead">Table determination</div>';
  html += '<div class="groupcard">';
  ["misinfo","biased","true"].forEach(function(v){
    html += '<div class="radiorow" onclick="setTeamCall('+claim.id+',\''+v+'\')"><span class="radiocircle'+(b.teamCall===v?' selected':'')+'"></span><span>'+CALL_META[v].emoji+' '+CALL_META[v].label.toUpperCase()+'</span></div>';
  });
  html += '</div>';

  // Community note (2026-08-12): the table justifying its own call in a sentence or
  // two, not an authored "correct answer" — same spirit as the confirm checkbox, just
  // an actual written exercise instead of a click. Required to file, same as teamCall
  // and confirmed. Uses oninput (direct DOM writes, no render()) rather than re-rendering
  // on every keystroke — this file has a documented history of full re-renders stealing
  // focus/cursor position out from under an in-progress interaction (see the Round 1
  // timer tick comments above), so this follows the same targeted-update pattern. In
  // this multiplayer build specifically, syncing only fires on blur (onNoteBlur calls
  // syncBoard), not per keystroke, to avoid hammering Supabase on every character.
  // Playtest note (8/16/2026): players didn't realize this was required to file —
  // asterisk matches the filebtn's existing disabled-until-note gating below, just
  // finally surfaced as a visible signal instead of a silent disabled button.
  html += '<div class="sectionhead">Community note <span class="requiredmark">*</span></div>';
  if(!b.filed){
    html += '<textarea class="communitynote" id="notebox-'+claim.id+'" placeholder="Explain why your table called this the way you did — this gets filed alongside your determination." oninput="onNoteInput('+claim.id+', this.value)" onblur="onNoteBlur('+claim.id+')">'+escapeHtml(b.note||"")+'</textarea>';
  } else {
    html += '<div class="groupcard" style="padding:12px 14px; font-size:13.5px; line-height:1.5; color:var(--ios-label);">'+(b.note ? escapeHtml(b.note) : '<span style="color:var(--ios-label3); font-style:italic;">No note was written.</span>')+'</div>';
  }

  if(!b.filed){
    html += '<div class="confirmrow" onclick="toggleConfirm('+claim.id+')"><span class="checkbox'+(b.confirmed?' checked':'')+'">'+(b.confirmed?'✓':'')+'</span><span class="confirmtext">I confirm this reflects the table\'s review of the attached evidence.</span></div>';
    html += '<button class="filebtn" id="filebtn-'+claim.id+'" onclick="fileBoard('+claim.id+')" '+(!b.teamCall||!b.confirmed||!(b.note&&b.note.trim())?'disabled':'')+'>File Case — Stop the Spread</button>';
  } else {
    html += '<div class="receiptcard">';
    html += '<div class="receiptrow"><span>Case number</span><span>'+claimNumber(claim.id)+'</span></div>';
    html += '<div class="receiptrow"><span>Determination</span><span>'+CALL_META[b.teamCall].label+'</span></div>';
    html += '<div class="receiptrow"><span>Evidence attached</span><span>'+b.board.length+'</span></div>';
    html += '<div class="receiptrow"><span>Filed</span><span>'+b.filedAt+'</span></div>';
    html += '</div>';
  }

  // "Compare everyone's version" is back (8/24/2026) — but only after filing, which
  // is the whole point of the reveal rule. Before the case is filed this board stays
  // focused on evidence + the team's single determination; the then/now vote
  // comparison still lives on the hub card once you flip back.
  if(b.filed) html += renderTellReveal(claim);
  return html;
}
// Drawn only once a case is filed — see the reveal rules in tells-taxonomy.md.
// Every player saw this same story told a different way; this is the first and only
// place the game names the tell behind each version. Motive, not falsity: the copy
// says how the story reached you, never who was right.
function renderTellReveal(claim){
  // In the multiplayer build PLAYERS is empty until a room is joined \u2014 an empty
  // reveal header with no rows under it is worse than no reveal at all.
  if(!PLAYERS.length) return "";
  // Group by variant, not by player. With 4 players and 3 variants somebody always
  // doubles up, and printing the same headline + same tell twice quietly undercuts
  // the whole point of the screen. One row per version actually in play, with the
  // players who got it listed on it.
  var groups = [];
  PLAYERS.forEach(function(p){
    var v = variantForPlayer(claim, p.id);
    var g = groups.find(function(x){ return x.v === v; });
    if(!g){ g = {v:v, players:[]}; groups.push(g); }
    g.players.push(p);
  });
  var allDistinct = groups.length === PLAYERS.length;
  var html = '<div class="tellreveal">';
  html += '<div class="trhead">\ud83d\udd13 What framed each version</div>';
  html += '<div class="trnote">Your table just filed on one story \u2014 but '+
          (allDistinct ? 'nobody read the same version of it'
                       : 'you weren\u2019t all reading the same version of it')+
          '. Here\u2019s the tell behind each one. A tell is about how a story reached you, not proof of what\u2019s true: your call still stands.</div>';
  groups.forEach(function(g){
    var t = g.v.tell ? TELL[g.v.tell] : null;
    html += '<div class="trrow '+(t ? t.kind : "none")+'">';
    html += '<div class="trwho">';
    g.players.forEach(function(p){
      html += '<span class="trdot" style="background:'+(p.color||"var(--ios-bg3)")+';">'+(p.initial||(p.name||"?").charAt(0))+'</span>';
    });
    html += '<span>'+g.players.map(function(p){ return p.isYou ? "You" : (p.name||"Player"); }).join(" \u00b7 ")+
            (g.players.length>1 ? " \u2014 same version" : "")+'</span>';
    html += '</div>';
    html += '<div class="trheadline">\u201c'+g.v.headline+'\u201d</div>';
    if(t){
      html += '<span class="trchip '+t.kind+'">'+t.emoji+' '+t.name+'</span>';
      html += '<div class="trdesc">'+t.desc+'</div>';
    } else {
      html += '<span class="trchip none">No tell on this one \u2014 told straight</span>';
    }
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function setTeamCall(claimId, v){
  var b = getBoard(claimId);

function toggleConfirm(claimId){

// Direct DOM update on every keystroke (no render()) so the textarea never loses
// focus/cursor position mid-sentence — see the comment in renderClaimBoard.
function onNoteInput(claimId, value){
  var b = getBoard(claimId);
  if(b.filed) return;

// Sync (via the real Supabase-backed syncBoard, present in this build) only once the
// player's done typing, not on every keystroke.
function onNoteBlur(claimId){

}
function fileBoard(claimId){
  var b = getBoard(claimId);
  if(!b.teamCall || !b.confirmed || !(b.note && b.note.trim())) return;
  // Where the live spread meter stands the instant BEFORE this case lands — the end
  // report's balance bar animates down from here, which it can't do once the last
  // contested claim has already flipped to filed and the meter reads zero.
  var live = spreadStats();
  sessionState.lastLiveRedPct = live.total>0 ? Math.round(100*live.redHeat/live.total) : 0;
  b.filed = true;
  justFiledClaimId = claimId;
  var d = new Date();
  var h = d.getHours() % 12 || 12;
  var m = d.getMinutes();
  b.filedAt = (d.getMonth()+1)+"/"+d.getDate()+"/"+d.getFullYear()+" · "+h+":"+(m<10?"0":"")+m;
  // Snapshot how far this story got before the table shut it down — the
  // end-of-session report is built out of these.
  recordFiling(claimId);
  // The reveal unlocks here and nowhere earlier.
  commitTells(claimId);
  render();
  syncBoard(claimId);
  // Filing the last contested case is the end of the game.
  if(allCasesFiled()) endSession();
}

// ---------------- SPREAD ----------------
function spreadStats(){
  var redHeat = 0, greenHeat = 0, contestedN = 0, agreedN = 0, filedN = 0, skippedN = 0;
  CLAIMS.forEach(function(c){
    var status = claimStatus(c);
    var b = getBoard(c.id);
    var h = heat[c.id] || 0;
    if(status==="contested" && !b.filed){ redHeat += h; contestedN++; }
    else if(b.filed){ greenHeat += h; filedN++; }
    else if(status==="agreed"){ greenHeat += h*0.3; agreedN++; }
    else if(status==="skipped"){ greenHeat += h*0.3; skippedN++; }
  });
  return {redHeat:redHeat, greenHeat:greenHeat, total:Math.max(1, redHeat+greenHeat), contestedN:contestedN, agreedN:agreedN, filedN:filedN, skippedN:skippedN};
}
function renderSpread(){
  var s = spreadStats();
  var pr = Math.round(100*s.redHeat/s.total);
  var top = CLAIMS.filter(function(c){ return claimStatus(c)==="contested" && !getBoard(c.id).filed; })
    .sort(function(a,b){ return (heat[b.id]||0)-(heat[a.id]||0); })[0];
  var html = navbarBack("The Spread", goHome);
  html += '<div class="appbody">';
  if(sessionState.ended){
    html += '<div class="wtile" style="cursor:pointer; border-color:rgba(48,209,88,.35);" onclick="openEndReport()">';
    html += '<div class="wtag"><span class="dot"></span>SESSION COMPLETE</div>';
    html += '<div class="topclaim">Every case is filed — nothing is spreading anymore.</div>';
    html += '<div class="wsub">Tap to reopen the final report</div></div>';
  }
  html += '<div class="wrow3">';
  html += '<div class="wtile"><div class="wtag"><span class="dot"></span>CONTESTED</div><div class="wnum" style="color:var(--ios-red);">'+s.contestedN+'</div><div class="wsub">still spreading</div></div>';
  html += '<div class="wtile"><div class="wtag"><span class="dot"></span>AGREED</div><div class="wnum" style="color:var(--ios-label2);">'+s.agreedN+'</div><div class="wsub">set aside'+(s.skippedN?' \u00b7 '+s.skippedN+' skipped':'')+'</div></div>';
  html += '<div class="wtile"><div class="wtag"><span class="dot"></span>FILED</div><div class="wnum" style="color:var(--ios-green);">'+s.filedN+'</div><div class="wsub">contained</div></div>';
  html += '</div>';
  html += '<div class="wtile"><div class="wtag"><span class="dot"></span>BALANCE</div><div class="wsub">spreading vs. contained attention</div>';
  html += '<div class="balancebar"><div class="r" style="width:'+pr+'%"></div><div class="g" style="width:'+(100-pr)+'%"></div></div></div>';
  if(top){
    html += '<div class="wtile" style="cursor:pointer;" onclick="openClaim('+top.id+')">';
    html += '<div class="wtag"><span class="dot"></span>TOP SPREADING RIGHT NOW</div>';
    html += '<div class="topclaim">'+variantForPlayer(top,MY_ID).headline+'</div>';
    html += '<div class="wsub">🔥 '+Math.round(heat[top.id]||0)+' heat · tap to investigate</div></div>';
  }
  html += '<div style="color:var(--ios-label3); font-size:12px; line-height:1.6; margin-top:6px;">Heat climbs on its own the longer a contested claim sits un-filed — that\'s attention, not accuracy. Filing a case is the only thing that brings it back down. Agreed claims stay quiet in the background.</div>';
  html += '</div>';
  document.getElementById("screenArea").innerHTML = html;
}

      mock:'<div class="onboardmock"><div class="onboardmock-flow"><div style="position:relative;"><div class="onboardmock-source">🔗 @AIHypeDaily <span class="onboardmock-chev">▼</span></div><div class="onboardmock-tap" style="right:-6px; bottom:-16px;">👆</div></div><div class="onboardmock-arrow">↓</div><div class="onboardmock-tabs"><div class="onboardmock-tab active">🕵️ Background</div></div></div></div>'},
    {big:"🗂️", title:"File your evidence", sub:"Tap + Add to case on what holds up",
      mock:'<div class="onboardmock"><div class="onboardmock-evidbtn">+ Add to case</div></div>'}
  ]},
  // "Where to look" (8/24/2026, expanded same day per Tara: more of an intro about
  // how manipulation actually works, and an actual look at the library).
  // Rule 4 of the reveal rules still holds — onboarding teaches the PLACES and the
  // vocabulary, the post-file reveal names which tell framed which card. Showing the
  // library grid is fine: the library is open all game. Not teamGated \u2014 it's a
  // reading habit, not a step anyone else is waiting on.
  tells: {teamGated:false, screens:[
    // Opens on the question, answers it with the library \u2014 Tara, 8/24/2026. Two
    // conceptual lead-in screens were cut the same day; the question carries the
    // setup on its own now. "tell" the verb here sets up "tells" the noun on the
    // next screen, which is the reason the system got that name \u2014 left plain, no
    // italic: the noun form is odd enough to register on its own, and marking it up
    // makes the game look like it's explaining its own joke.
    {kicker:"SPOTTING", big:"\ud83e\udd14", title:"How can you tell you\u2019re being manipulated?", sub:"There\u2019s almost always a sign"},
    {title:TELLS.length+" tells to look out for", sub:"Red means slow down. Green means it holds up.", mock:tellGridMock()},
    {title:"Read the profile, not just the post", sub:"Bio, join date, what they link to",
      mock:'<div class="onboardmock"><div class="onboardmock-mini"><div class="onboardmock-miniavatar">D</div><div class="onboardmock-minibio">your fav products, dupes + drama \ud83d\udecd\ufe0f | shop my finds below \ud83d\udd17</div><div class="onboardmock-minimeta">2.2M followers \u00b7 <b>Joined Jun 2020</b></div></div></div>'},
    {title:"Check the date and the caption", sub:"Same picture can carry a different story",
      mock:'<div class="onboardmock"><div class="onboardmock-row"><div class="onboardmock-rowtext">The same photo, posted before</div><div class="onboardmock-rowmeta"><b>3 years ago</b> \u00b7 different caption</div></div><div class="onboardmock-row"><div class="onboardmock-rowtext">Wire coverage of the same event</div><div class="onboardmock-rowmeta">named outlet \u00b7 dated</div></div></div>'},
    {title:"Ask what it\u2019s citing", sub:"A confident answer isn\u2019t a source",
      mock:'<div class="onboardmock"><div class="onboardmock-bubble">Studies suggest this is well established \u2014 <b>but no study is named.</b></div></div>'},
    {big:"\ud83d\udd12", title:"Which one was it? File and find out.", sub:"The list stays open the whole game"}
  ]},
  // Not teamGated (8/18/2026, per Tara — reversed from the first pass): shouldn't
  // block anything or make anyone wait on teammates. Dismisses per-player with
  // "Got it," same as spread, while everyone keeps clipping evidence freely.
  board: {teamGated:false, screens:[
    {kicker:"STOP THE SPREAD", big:"🗂️", title:"One shared board", sub:"Talk it through, agree, file it"},
    {big:"🤝", title:"Pool it", sub:"Everyone's evidence, one place"},
    {big:"🎭", title:"Compare versions", sub:"Unlocks the moment you file"},
    {big:"📝", title:"Write the note", sub:"Explain your call — required to file"},
    {big:"📮", title:"File to win", sub:"Agreeing files the case"}
  ]},
  spread: {teamGated:false, screens:[
    {kicker:"THE SPREAD", big:"📊", title:"Attention ≠ accuracy", sub:"It grows the longer it sits contested"},
    {big:"🔥", title:"Heat climbs", sub:"On its own, while it's unfiled"},
    {big:"🧯", title:"Filing cools it", sub:"Contained, not just correct"},
    {big:"👀", title:"Check anytime", sub:"It reflects — it never drives"}
  ]}
};
// Board's tour used to auto-chain right after investigate's, both up front before
// anyone had gathered anything (8/18/2026, first pass). Revised same day, per Tara:
// "one shared board" only means something once there's an actual case sitting in
// front of you — so it now waits until some claim's board has real evidence on it.
var BOARD_TOUR_EVIDENCE_THRESHOLD = 4;
function onboardKeyFor(){
  if(currentApp==="round1"){
    if(!roundState.started) return seenOnboard.round1 ? null : "round1";
    if(!roundState.ended) return null;
    if(!roundState.readyForR2Popup) return null; // wait for the shuffle to settle first
    var hasContested = CLAIMS.some(function(c){ return claimStatus(c)==="contested"; });
    if(!hasContested) return null;
    if(!seenOnboard.investigate) return "investigate";
    if(!seenOnboard.board){
      var caseReady = CLAIMS.some(function(c){ return getBoard(c.id).board.length >= BOARD_TOUR_EVIDENCE_THRESHOLD; });
      return caseReady ? "board" : null;
    }
    return null;
  }
  // The Tells tour is NOT auto-chained into Round 2 (8/24/2026, Tara) \u2014 it fires
  // only when a player actually taps the \ud83e\udde0 badge and opens the library. Round 2
  // already hands you two tours back to back; this one is for the moment someone
  // chooses to go look, which is also when they're most likely to read it.
  if(currentApp==="tells") return seenOnboard.tells ? null : "tells";
  if(currentApp==="spread") return seenOnboard.spread ? null : "spread";
  return null;
}
function maybeShowOnboard(){
  var key = onboardKeyFor();
  if(key !== pendingOnboard) onboardScreenIdx = 0;
  pendingOnboard = key;
  renderOnboard();
}
// Whether every current player has hit "I'm ready" on this tour's last screen.
function isTeamReady(key){
  var ready = onboardReady[key] || [];
  if(!PLAYERS.length) return ready.indexOf(MY_ID) !== -1;
  return PLAYERS.every(function(p){ return ready.indexOf(p.id) !== -1; });
}
// Marks this player ready on a teamGated tour and syncs it (same read-modify-write
// pattern as syncVote/syncBoard). Once the whole table's in, finalizeOnboard() runs
// for whoever's client notices it happen — either the local player closing the loop
// on their own tap, or a realtime update from the last other player (see
// applyRemoteState below).
function onboardMarkReady(key){
  if((onboardReady[key]||[]).indexOf(MY_ID) !== -1) return;
  if(!roomCode){
    onboardReady[key] = (onboardReady[key]||[]).concat([MY_ID]);
    if(isTeamReady(key)) finalizeOnboard(key); else render();
    return;
  }
  InfodemicSync.updateRoomState(roomCode, function(state){
    state.onboardReady = state.onboardReady || {};
    state.onboardReady[key] = state.onboardReady[key] || [];
    if(state.onboardReady[key].indexOf(MY_ID)===-1) state.onboardReady[key].push(MY_ID);
    return state;
  }).then(function(state){
    onboardReady = state.onboardReady || onboardReady;
    if(isTeamReady(key)) finalizeOnboard(key); else render();
  }).catch(function(e){ console.error("onboard ready sync failed", e); });
}
// Closes out a tour once it's actually allowed to close — immediately for an
// ungated tour (spread's "Got it"), or once the whole team's ready for a gated one.
// This is also literally what unlocks the thing the tour was gating: starting
// round1, flipping contested cards, and filing a board all check seenOnboard
// directly (see beginRound1/flipCard/openSpoke/fileBoard) rather than duplicating
// the ready-check in three places.
function finalizeOnboard(key){
  seenOnboard[key] = true;
  pendingOnboard = null;
  onboardScreenIdx = 0;
  if(key==="round1" && !roundState.started) beginRound1();
  // A clearer hand-off into Round 2: rather than just dropping back into the feed and
  // hoping players notice a corner nub on their own, open the first contested story
  // straight to its "how do you wanna dig in" move menu — same agency, guided start.
  if(key==="investigate" && currentApp==="round1"){
    var firstContested = CLAIMS.find(function(c){ return claimStatus(c)==="contested" && !getBoard(c.id).filed; });
    if(firstContested){
      openSpoke(firstContested.id);
      setTimeout(function(){
        var el = document.getElementById("slide-"+firstContested.id);
        if(el && typeof el.scrollIntoView === "function") el.scrollIntoView({behavior:"smooth", block:"start"});
      }, 50);
    }
  }
  // Full render(), not just maybeShowOnboard() — closing board's tour, for instance,
  // has to redraw the feed itself (unlock the flipcluster lock icons / filebtn label)
  // not just the onboard scrim, and this is the only render call in that path when
  // this client is the one whose own "ready" tap completed the team (as opposed to
  // hearing about it via applyRemoteState, which already renders separately).
  // render() calls maybeShowOnboard() itself at its end, which is what notices once
  // the board tour's own trigger condition (enough evidence gathered) is met.
  render();
}
function onboardNext(){
  if(!pendingOnboard) return;
  var gate = ONBOARD_CONTENT[pendingOnboard];
  var isLast = onboardScreenIdx === gate.screens.length - 1;
  if(!isLast){ onboardScreenIdx++; renderOnboard(); return; }
  if(gate.teamGated) onboardMarkReady(pendingOnboard);
  else finalizeOnboard(pendingOnboard);
}
function onboardPrev(){
  if(!pendingOnboard) return;
  if(onboardScreenIdx > 0){ onboardScreenIdx--; renderOnboard(); }
}
function onboardTapZone(e){
  var rect = e.currentTarget.getBoundingClientRect();
  var x = e.clientX - rect.left;
  if(x < rect.width/2) onboardPrev(); else onboardNext();
}
function renderOnboard(){
  var el = document.getElementById("onboardScrim");
  if(!pendingOnboard){ el.className = "onboard-scrim"; el.innerHTML = ""; return; }
  var gate = ONBOARD_CONTENT[pendingOnboard];
  var s = gate.screens[onboardScreenIdx];
  var isLast = onboardScreenIdx === gate.screens.length - 1;
  var html = '<div class="onboard-full" onclick="onboardTapZone(event)">';
  if(s.kicker) html += '<div class="onboard-kicker">'+s.kicker+'</div>';
  html += s.mock ? s.mock : ('<div class="onboard-big">'+s.big+'</div>');
  html += '<div class="onboard-title">'+s.title+'</div>';
  // `sub` may be a function so a screen can read state that isn't known when
  // ONBOARD_CONTENT is built — CLAIMS is REASSIGNED later (live-deck upgrade,
  // and again per room in loadDropForRoom), so a story count baked in at parse
  // time would show the default deck's number for every pipeline drop.
  html += '<div class="onboard-sub">'+(typeof s.sub === "function" ? s.sub() : s.sub)+'</div>';
  if(isLast){
    html += '<div class="onboard-cta" onclick="event.stopPropagation();">';
    if(gate.teamGated){
      var already = (onboardReady[pendingOnboard]||[]).indexOf(MY_ID) !== -1;
      if(!already){
        html += '<div class="onboard-btn" onclick="onboardMarkReady(\''+pendingOnboard+'\')">I\'m ready</div>';
      } else {
        var waitingNames = PLAYERS.filter(function(p){ return (onboardReady[pendingOnboard]||[]).indexOf(p.id)===-1; }).map(function(p){ return p.name; });
        html += '<div class="onboard-waiting">'+(waitingNames.length ? 'Waiting on '+waitingNames.join(", ") : 'Everyone\'s ready — starting…')+'</div>';
      }
    } else {
      html += '<div class="onboard-btn" onclick="onboardNext()">Got it</div>';
    }
    html += '</div>';
  }
  html += '<div class="onboard-dots">';
  gate.screens.forEach(function(_, i){
    html += '<div class="onboard-dot'+(i===onboardScreenIdx?' active':'')+'"></div>';
  });
  html += '</div></div>';
  el.innerHTML = html;
  el.className = "onboard-scrim active";
}

// ---------------- MASTER RENDER ----------------
function render(){
  if(currentApp==="lobby"){ renderLobby(); return; }
  // The end-of-session report is the last thing the game does — nothing underneath
  // it draws, onboarding included.
  if(sessionState.showingEnd){ renderEndScreen(); return; }
  if(currentApp==="round1") renderRound1();
  else if(currentApp==="spread") renderSpread();
  else if(currentApp==="tells") renderTells();
  maybeShowOnboard();
}

// engagement gravity tick
setInterval(function(){
  // Once the session's over, attention stops moving — nothing is left un-filed to
  // gather it, and the report underneath must not keep re-rendering.
  if(sessionState.ended) return;
  CLAIMS.forEach(function(c){
    var status = claimStatus(c);
    var b = getBoard(c.id);
    var cur = heat[c.id] || 0;
    if(status==="contested" && !b.filed){ heat[c.id] = Math.min(HEAT_CAP, cur + Math.random()*1.6 + 0.4); }
    else if(b.filed){ heat[c.id] = Math.max(2, cur - 1.2); }
    else if(status==="agreed" || status==="skipped"){ heat[c.id] = cur<3 ? 3 : cur; }
    // Heat decays after filing, so the high-water mark has to be kept separately,
    // and shares keep totting up for as long as the claim is loose. Both feed the
    // end-of-session report; neither is shown during play.
    var reach = getReach(c.id);
    if(heat[c.id] > reach.peak) reach.peak = heat[c.id];
    if(status==="contested" && !b.filed) reach.shares += heat[c.id] * SHARE_RATE;
  });
  // Skip re-rendering while a full-screen sub-moment (Time's Up interstitial, the
  // per-story reveal) is up — heat isn't shown on either screen, and re-rendering
  // them just recreates the DOM nodes underneath, which replays their one-shot
  // entrance animations on a loop instead of letting them settle.
  var onSubScreen = roundState.showingTimesUp || revealState.active;
  // Playtest bug (8/16/2026): the community note textarea only took a couple
  // characters before input stopped registering. Root cause was this same tick —
  // rebuilding the whole feed's innerHTML every 2.2s destroys and recreates the
  // textarea DOM node, which drops focus entirely (unlike the countdown badge,
  // there was no targeted-update path for it). Same failure class as the vote
  // buttons in startTicking() above, just on a longer interval so it read as
  // "loses input" instead of "takes several taps." Skip the tick while either
  // the note box has focus or a scrollToNextCard() animation is still in flight
  // (see scrollAnimUntil below — same rebuild-mid-animation issue was also
  // cutting off the gut-check's card-to-card scroll).
  var typingInNote = document.activeElement && document.activeElement.classList &&
    document.activeElement.classList.contains("communitynote");
  var scrollingCards = Date.now() < scrollAnimUntil;
  if((currentApp==="spread" || (currentApp==="round1" && !onSubScreen)) && !typingInNote && !scrollingCards) render();
}, 2200);

function tickClock(){
  var d = new Date();
  var h = d.getHours() % 12 || 12;
  var m = d.getMinutes();
  document.getElementById("clock").textContent = h + ":" + (m<10?"0":"") + m;
}
setInterval(tickClock, 15000);
tickClock();

// Auto-join from a ?code=&name= URL, so the standalone lobby's "Play the
// real game" link can hand off straight into a joined room instead of
// making people retype the code here.
(function autoJoinFromURL(){
  var params = new URLSearchParams(window.location.search);
  var code = (params.get("code")||"").trim();
  var name = (params.get("name")||"").trim();
  if(!code || !name) return;
  lobbyStatus = {msg:"Joining…", error:false};
  InfodemicSync.enterCode(code, name).then(function(result){
    onJoinedRoom(result.code, result.player.id);
  }).catch(function(err){
    lobbyStatus = {msg:err.message, error:true}; render();
  });
})();

render();
</script>
