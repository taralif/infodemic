<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INFODEMIC — Hub &amp; Spoke Prototype</title>
<style>
  :root{
    --ios-bg:#000000; --ios-bg2:#1c1c1e; --ios-bg3:#2c2c2e; --ios-sep:#38383a;
    --ios-blue:#0a84ff; --ios-green:#30d158; --ios-red:#ff453a; --ios-orange:#ff9f0a;
    --ios-label:#ffffff; --ios-label2:rgba(235,235,245,.6); --ios-label3:rgba(235,235,245,.3);
    /* Contrast fix (Jared, 8/11 demo): the flipped investigation face was
       --ios-bg2, barely lighter than the near-black feed it flips out of —
       read as "black card on black background." Lighter than both --ios-bg2
       and --ios-bg3 so the nested groupcard/receiptcard (bg2) and mode tabs
       (bg3) still read as insets on top of it, not swallowed into it. */
    --ios-cardback:#34343a;
  }
  *{box-sizing:border-box; -webkit-font-smoothing:antialiased;}
  body{
    margin:0; min-height:100vh; background:#0d0d0f; color:var(--ios-label);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
    display:flex; justify-content:center; align-items:flex-start; padding:40px 16px 60px;
  }
  .wrap{display:flex; flex-direction:column; align-items:center;}

  .iphone{
    width:390px; height:844px; background:#000; border-radius:56px; position:relative;
    box-shadow:0 0 0 3px #2a2a2c, 0 0 0 6px #000, 0 30px 70px rgba(0,0,0,.6);
    overflow:hidden;
  }
  .notch{
    position:absolute; top:11px; left:50%; transform:translateX(-50%); width:126px; height:37px;
    background:#000; border-radius:20px; z-index:60;
  }
  .statusbar{
    position:absolute; top:0; left:0; right:0; height:47px; z-index:55;
    display:flex; align-items:flex-end; justify-content:space-between; padding:0 26px 8px;
    font-size:15px; font-weight:600; pointer-events:none; letter-spacing:.2px;
  }
  .statusicons{display:flex; align-items:center; gap:5px;}
  .home-indicator{
    position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:134px; height:5px;
    border-radius:3px; background:rgba(255,255,255,.85); z-index:60; cursor:pointer;
  }
  .screen-area{position:absolute; inset:0; overflow:hidden; background:var(--ios-bg);}

  /* ---------- ONBOARDING: full-screen jackbox-style tour ----------
     Redesigned 8/18/2026, mirrored from infodemic-multiplayer-prototype.html — was
     a bottom sheet with three text rows per gate, which playtested as easy to skim
     past without registering. Now a full-screen, near-opaque takeover, one idea per
     screen, tap either half to step back/forward. See renderOnboard()/
     onboardTapZone() in JS. */
  .onboard-scrim{
    position:absolute; inset:0; z-index:57; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,0); opacity:0; pointer-events:none; transition:opacity .25s ease, background .25s ease;
  }
  .onboard-scrim.active{ opacity:1; pointer-events:auto; background:rgba(0,0,0,.94); }
  .onboard-full{ width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 30px; text-align:center; cursor:pointer; }
  .onboard-kicker{ font-size:12.5px; font-weight:700; color:var(--ios-blue); text-transform:uppercase; letter-spacing:1px; margin-bottom:16px; }
  .onboard-big{ font-size:64px; margin-bottom:22px; }
  .onboard-title{ font-size:26px; font-weight:800; margin-bottom:10px; line-height:1.2; }
  .onboard-sub{ font-size:15px; color:var(--ios-label2); line-height:1.4; }
  .onboard-cta{ margin-top:32px; cursor:default; }
  .onboard-btn{ background:var(--ios-blue); color:#fff; text-align:center; font-size:16px; font-weight:600; padding:13px 28px; border-radius:14px; cursor:pointer; }
  /* The "not yet" half of a two-way gate — present and pressable, but never the one
     the eye lands on first. */
  .onboard-btn.ghost{ background:transparent; color:var(--ios-label2); border:1px solid rgba(255,255,255,.18);
    font-size:14.5px; font-weight:600; padding:11px 24px; margin-top:9px; }
  .onboard-waiting{ font-size:13.5px; color:var(--ios-label2); }

  .onboard-dots{ position:absolute; bottom:44px; left:0; right:0; display:flex; justify-content:center; gap:6px; }
  .onboard-dot{ width:6px; height:6px; border-radius:3px; background:rgba(255,255,255,.3); }
  .onboard-dot.active{ background:#fff; }
  /* Onboarding "mock" screens (8/18/2026, Investigate only, per Tara, mirrored from
     infodemic-multiplayer-prototype.html): a small recreation of the actual UI
     element being taught, instead of a generic emoji — literally what you'll see
     and tap, not an abstraction of it. Reuses real colors so it reads as "this
     app," not clip art. */
  /* ---------- COLD OPEN ART (2026-08-26) ----------
     Art for the rebuilt round1 tour. Delivered through the existing `mock` field
     (see OB_*_ART in JS), so these sit alongside .onboardmock rather than replacing it. */
  .obfeed{
    width:170px; height:172px; overflow:hidden; position:relative; margin-bottom:22px;
    -webkit-mask-image:linear-gradient(to bottom, transparent 0%, #000 20%, #000 80%, transparent 100%);
    mask-image:linear-gradient(to bottom, transparent 0%, #000 20%, #000 80%, transparent 100%);
  }
  .obfeedtrack{display:flex; flex-direction:column; animation:obfeedroll 11s linear infinite;}
  .obfcard{
    height:46px; margin-bottom:10px; flex:none; border-radius:10px; background:var(--ios-cardback);
    border:1px solid rgba(255,255,255,.12); padding:9px 10px; display:flex; flex-direction:column; gap:5px;
  }
  .obfline{height:5px; border-radius:3px; background:rgba(255,255,255,.24);}
  .obfline.short{width:56%;}
  .obfcard.off{border-color:rgba(255,159,10,.6); animation:obfglow 2.3s ease-in-out infinite;}
  .obfcard.off .obfline{background:rgba(255,159,10,.7);}
  @keyframes obfeedroll{from{transform:translateY(0);} to{transform:translateY(-336px);}}
  @keyframes obfglow{0%,100%{box-shadow:0 0 0 rgba(255,159,10,0);} 50%{box-shadow:0 0 18px rgba(255,159,10,.4);}}

  .obstack{position:relative; width:186px; height:112px; margin-bottom:34px;}
  .obstackcard{
    position:absolute; left:0; right:0; height:52px; border-radius:14px; background:var(--ios-cardback);
    border:1px solid rgba(255,255,255,.13); box-shadow:0 10px 24px rgba(0,0,0,.5);
    padding:11px 13px; display:flex; flex-direction:column; gap:6px;
  }
  .obstackcard:nth-child(1){top:0; transform:scale(.9); opacity:.4;}
  .obstackcard:nth-child(2){top:24px; transform:scale(.95); opacity:.68;}
  .obstackcard:nth-child(3){top:50px;}
  .obstackheat{
    position:absolute; left:0; right:0; bottom:-22px; height:5px; border-radius:3px;
    background:linear-gradient(90deg, var(--ios-orange), var(--ios-red));
    animation:obheat 2.6s ease-in-out infinite alternate; transform-origin:left center;
  }
  @keyframes obheat{from{transform:scaleX(.28);} to{transform:scaleX(1);}}

  .obflags{display:flex; justify-content:center; gap:18px; margin:24px 0 6px;}
  .obflagitem{display:flex; flex-direction:column; align-items:center; gap:10px; width:92px;}
  /* Same disc as the real vote button in the feed (.stoplightopt), so the tour shows
     the thing they will actually tap. */
  .obflagbtn{
    width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:20px; border:2px solid rgba(255,255,255,.22); box-shadow:0 4px 12px rgba(0,0,0,.45);
  }
  .obflagbtn.red{background:var(--ios-red);}
  .obflagbtn.yellow{background:var(--ios-orange);}
  .obflagbtn.green{background:var(--ios-green);}
  .obflaglabel{font-size:12.5px; font-weight:800; line-height:1.25;}
  .obflaglabel.g{color:var(--ios-green);}
  .obflaglabel.y{color:var(--ios-orange);}
  .obflaglabel.r{color:var(--ios-red);}

  .obclock{
    width:104px; height:104px; border-radius:50%; border:3px solid rgba(255,255,255,.14);
    display:flex; align-items:center; justify-content:center; position:relative; margin-bottom:26px;
  }
  .obclockface{font-size:27px; font-weight:900; letter-spacing:-.5px;}
  .obclockhand{
    position:absolute; inset:-3px; border-radius:50%;
    border:3px solid transparent; border-top-color:var(--ios-blue);
    animation:obspin 3.6s linear infinite;
  }
  @keyframes obspin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){
    .obfeedtrack,.obfcard.off,.obstackheat,.obclockhand{animation:none;}
  }
  .lobbymeta{font-size:12.5px; font-weight:700; color:var(--ios-label2); margin:-8px 0 6px;}

  .onboardmock{ margin-bottom:22px; position:relative; }
  /* .onboardmock-card / -flipcluster / -nub deleted 9/3/2026 (cluster A) with the
     "Tap a card to flip it open" tour screen they drew. */
  .onboardmock-tap{ position:absolute; font-size:22px; right:44px; bottom:-6px; animation:onboardtapbounce 1.4s ease-in-out infinite; }
  @keyframes onboardtapbounce{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
  .onboardmock-tabs{ display:flex; gap:10px; }
  .onboardmock-tab{ font-size:14px; font-weight:700; padding:11px 18px; border-radius:13px; background:var(--ios-bg3); color:var(--ios-label2); }
  .onboardmock-tab.active{ background:var(--ios-blue); color:#fff; }
  .onboardmock-source{
    display:inline-flex; align-items:center; gap:7px; font-size:16px; font-weight:700; color:#fff;
    background:rgba(255,255,255,.14); border-radius:999px; padding:11px 18px;
  }
  .onboardmock-meta{ opacity:.7; font-size:12.5px; font-weight:600; }
  .onboardmock-evidbtn{ background:var(--ios-green); color:#04140a; font-size:15px; font-weight:800; padding:13px 22px; border-radius:12px; }
  .onboardmock-flow{ display:flex; flex-direction:column; align-items:center; gap:8px; }
  .onboardmock-arrow{ font-size:16px; color:var(--ios-label3); }

  /* Mocks for the "where to look" tour (8/24/2026) — a squashed profile card, a
     search row with its date, and an AI bubble. Same job as the other onboardmock
     pieces: show the actual surface being described, not a generic emoji. */
  .onboardmock-mini{ background:var(--ios-bg2); border-radius:13px; padding:13px 15px; text-align:left; min-width:210px; }
  .onboardmock-miniavatar{ width:30px; height:30px; border-radius:50%; background:linear-gradient(160deg,#3a6ea8,#1d3552); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; margin-bottom:8px; }
  .onboardmock-minibio{ font-size:11.5px; color:var(--ios-label2); line-height:1.4; margin-bottom:7px; }
  .onboardmock-minimeta{ font-size:10.5px; color:var(--ios-label3); }
  .onboardmock-minimeta b{ color:var(--ios-orange); font-weight:700; }
  .onboardmock-row{ background:var(--ios-bg2); border-radius:11px; padding:10px 12px; text-align:left; min-width:210px; margin-bottom:7px; }
  .onboardmock-rowtext{ font-size:11.5px; font-weight:600; line-height:1.35; margin-bottom:4px; }
  .onboardmock-rowmeta{ font-size:10px; color:var(--ios-label3); }
  .onboardmock-rowmeta b{ color:var(--ios-orange); font-weight:700; }
  .onboardmock-bubble{ background:var(--ios-bg3); border-radius:15px 15px 15px 4px; padding:11px 14px; font-size:12px; line-height:1.45; text-align:left; max-width:230px; color:var(--ios-label); }

  /* The tour's peek at the library (8/24/2026) — real tell cards, built from TELLS
     so the sample and the count can't drift from the actual list. Showing the
     library is fine under the reveal rule: the library is vocabulary and stays open
     all game. What stays hidden is which tell is on which card. */
  .onboardmock-grid{ display:grid; grid-template-columns:1fr 1fr; gap:7px; min-width:250px; }
  .onboardmock-tell{ background:var(--ios-bg2); border-radius:10px; padding:9px 10px; text-align:left; border-top:2.5px solid var(--ios-label3); }
  .onboardmock-tell.red{ border-top-color:var(--ios-orange); }
  .onboardmock-tell.green{ border-top-color:var(--ios-blue); }
  .onboardmock-tellemoji{ font-size:15px; margin-bottom:3px; }
  .onboardmock-tellname{ font-size:10.5px; font-weight:700; line-height:1.25; color:var(--ios-label); }
  .onboardmock-more{ grid-column:1 / -1; text-align:center; font-size:10.5px; font-weight:700; color:var(--ios-label3); padding-top:3px; letter-spacing:.4px; }

  /* ---------- APP NAV / BODY ---------- */
  .navbar{
    position:absolute; top:0; left:0; right:0; height:98px; z-index:30; padding-top:47px;
    display:flex; align-items:center; padding-left:16px; padding-right:16px;
    background:rgba(20,20,22,.82); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
    border-bottom:0.5px solid var(--ios-sep);
  }
  .navback{color:var(--ios-blue); font-size:28px; font-weight:400; cursor:pointer; width:30px;}
  .navtitle{flex:1; text-align:center; font-size:17px; font-weight:600; margin-right:30px;}
  .appbody{position:absolute; top:98px; left:0; right:0; bottom:0; overflow-y:auto; padding:14px 16px 34px;}
  .appbody::-webkit-scrollbar{width:0;}

  /* ---------- ROUND 1: CARD STACK ---------- */
  .r1wrap{position:absolute; inset:0; overflow-y:auto; padding:58px 16px 30px;}
  .r1wrap::-webkit-scrollbar{width:0;}
  .spreadmini{
    background:rgba(30,32,30,.6); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border-radius:20px; padding:13px 16px; margin-bottom:16px; cursor:pointer; border:1px solid rgba(255,255,255,.08);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .spreadmini .smtag{font-size:10.5px; font-weight:700; color:var(--ios-label2); display:flex; align-items:center; gap:6px;}
  .spreadmini .smtag .dot{width:11px; height:11px; border-radius:3px; background:linear-gradient(160deg,#ff6a3d,#c22b06);}
  .spreadmini .smbar{flex:1; height:8px; border-radius:4px; overflow:hidden; display:flex; background:var(--ios-bg3); margin:0 10px;}
  .spreadmini .smbar .r{background:var(--ios-red);} .spreadmini .smbar .g{background:var(--ios-green);}
  .spreadmini .smarrow{color:var(--ios-label3); font-size:14px;}

  .r1header{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .r1title{font-size:22px; font-weight:800;}
  .r1timer{font-family:'Space Mono',monospace; font-size:19px; font-weight:700; color:var(--ios-green); background:var(--ios-bg2); padding:5px 12px; border-radius:10px;}
  .r1timer.urgent{color:var(--ios-red); animation:blink 0.8s infinite;}
  .r1sub{font-size:13px; color:var(--ios-label2); line-height:1.5; margin-bottom:18px;}

  .claimlist{display:flex; flex-direction:column; gap:12px;}
  .claimcard{background:var(--ios-bg2); border-radius:18px; padding:15px 16px; border:1px solid rgba(255,255,255,.05); transition:transform .2s ease;}
  .claimcard.contested{cursor:pointer; border-color:rgba(255,69,58,.35); background:linear-gradient(160deg, rgba(255,69,58,.08), var(--ios-bg2) 55%);}
  .claimcard.contested:active{transform:scale(.98);}
  .claimcard.agreed{opacity:.5;}
  .claimcard.justsorted{animation:cardpop .5s cubic-bezier(.2,1.4,.4,1);}
  @keyframes cardpop{ 0%{transform:scale(.85); opacity:0;} 60%{transform:scale(1.03); opacity:1;} 100%{transform:scale(1);} }
  .claimtop{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .claimsource{font-size:11px; font-weight:600; color:var(--ios-label3);}
  .statustag{font-size:9.5px; font-weight:800; letter-spacing:.4px; text-transform:uppercase; padding:3px 8px; border-radius:999px;}
  .statustag.contested{background:rgba(255,69,58,.18); color:var(--ios-red);}
  .statustag.agreed{background:rgba(255,255,255,.08); color:var(--ios-label3);}
  .claimheadline{font-size:15px; font-weight:600; line-height:1.38; margin-bottom:12px;}

  .votebtns{display:flex; gap:7px; margin-bottom:11px;}
  .voteopt{flex:1; text-align:center; font-size:11.5px; font-weight:700; padding:9px 4px; border-radius:10px; background:var(--ios-bg3); color:var(--ios-label2); cursor:pointer;}
  .voteopt.sel-misinfo{background:var(--ios-red); color:#fff;}
  .voteopt.sel-biased{background:var(--ios-orange); color:#1a1205;}
  .voteopt.sel-true{background:var(--ios-green); color:#04140a;}

  .voterow{display:flex; gap:6px; flex-wrap:wrap;}
  .avatardot{width:26px; height:26px; border-radius:50%; border:1.6px solid var(--ios-sep); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--ios-label3);}
  .avatardot.pending{background:var(--ios-bg3);}
  .avatardot.you{border-color:var(--ios-green);}
  .avatardot.sel-misinfo{background:rgba(255,69,58,.25); border-color:var(--ios-red);}
  .avatardot.sel-biased{background:rgba(255,159,10,.25); border-color:var(--ios-orange);}
  .avatardot.sel-true{background:rgba(48,209,88,.25); border-color:var(--ios-green);}
  .voterow.revealed{gap:7px;}
  .voterow.revealed.justrevealed{animation:cardpop .5s cubic-bezier(.2,1.4,.4,1);}
  .avatarpill{font-size:10.5px; font-weight:700; padding:5px 9px; border-radius:999px; background:var(--ios-bg3); color:var(--ios-label2);}
  .avatarpill.misinfo{background:rgba(255,69,58,.18); color:var(--ios-red);}
  .avatarpill.biased{background:rgba(255,159,10,.18); color:var(--ios-orange);}
  .avatarpill.true{background:rgba(48,209,88,.18); color:var(--ios-green);}
  .claimcta{margin-top:10px; font-size:12px; font-weight:700; color:var(--ios-red);}

  .protipslink{display:block; text-align:center; font-size:12.5px; font-weight:600; color:var(--ios-blue); margin-top:20px; padding-bottom:10px; cursor:pointer;}

  /* ---------- ROUND 1: card-stack feed (everything for a story lives on its own card) ---------- */
  .r1topbar{
    position:absolute; top:0; left:0; right:0; height:98px; z-index:40; padding-top:47px;
    display:flex; align-items:center; justify-content:space-between; padding-left:18px; padding-right:14px;
    background:rgba(15,16,15,.74); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border-bottom:0.5px solid var(--ios-sep);
  }
  .r1toptitle{font-size:17px; font-weight:800;}
  .r1topsub{font-size:11px; color:var(--ios-label2); margin-top:1px;}
  .r1toptools{display:flex; align-items:center; gap:8px;}
  .spreadbadge{
    background:rgba(255,255,255,.1); border-radius:999px; padding:6px 11px; font-size:11px; font-weight:700; color:#ffb199; cursor:pointer;
  }
  .tipsbadge{
    background:rgba(255,255,255,.1); border-radius:999px; width:30px; height:30px; display:flex; align-items:center; justify-content:center;
    font-size:14px; cursor:pointer;
  }
  .roundbadge{
    font-family:'Space Mono',monospace; font-size:14px; font-weight:700; background:rgba(255,255,255,.1); color:var(--ios-green);
    padding:6px 11px; border-radius:999px; cursor:pointer;
  }
  .roundbadge.urgent{color:var(--ios-red); animation:blink 0.8s infinite;}

  .feedscroll{position:absolute; top:98px; left:0; right:0; bottom:0; overflow-y:scroll; scroll-snap-type:y proximity; padding:14px 14px 26px;}
  .feedscroll::-webkit-scrollbar{width:0;}
  /* scroll-snap-stop:normal (not "always") lets a fast scroll/fling glide past several
     cards instead of forcing a stop at every single one — this is what makes the feed
     feel light to scroll through instead of sticky. scroll-snap-type is "proximity" not
     "mandatory" so snapping never fights a scroll gesture that started inside a flipped
     card's own scrollable back face (see .cardback-scroll below). */
  .feedcard{
    scroll-snap-align:start; scroll-snap-stop:normal; height:74vh; min-height:500px; max-height:620px;
    position:relative; margin-bottom:18px; box-shadow:0 14px 34px rgba(0,0,0,.45); perspective:1600px;
  }
  /* ---------- CARD FLIP (front = feed card, back = inline investigation) ---------- */
  .cardflip-inner{
    position:relative; width:100%; height:100%; transition:transform .55s cubic-bezier(.4,.15,.2,1);
    transform-style:preserve-3d; -webkit-transform-style:preserve-3d;
    /* iPad playtest bug (8/16/2026, mirrored from infodemic-multiplayer-prototype.html):
       back face still showed the front's content on iPad Safari. Forcing this onto its
       own GPU layer is the standard fix for iPadOS Safari failing to isolate a 3D
       transform context inside a scroll-snap container. Not verified on a real iPad
       from here — needs a device recheck. */
    transform:rotateY(0deg); -webkit-transform:rotateY(0deg);
    will-change:transform;
  }
  .cardflip-inner.flipped{ transform:rotateY(180deg); -webkit-transform:rotateY(180deg); }
  .cardface{
    position:absolute; inset:0; border-radius:26px; overflow:hidden; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border:1px solid rgba(255,255,255,.07);
    /* iPhone/iPad flip bug — the fix that actually holds (8/24/2026). Two earlier
       attempts failed: -webkit- prefixes on perspective/transform-style (8/14), then
       translateZ(0)+will-change to force a GPU layer (8/16).
       Root cause is not CSS 3D at all: render() rebuilds screenArea's innerHTML
       wholesale ~4x/second, so a flipped card is never *transitioned* into
       rotateY(180deg) — it is CREATED already rotated. Mobile WebKit routinely fails
       to cull the back face of a layer born in its final rotated state, the two
       coplanar faces z-fight, and the front wins.
       So correctness no longer depends on backface culling: the away-facing side is
       explicitly hidden below. The 0s/.28s transition means the swap would still land
       mid-flip (card edge-on, switch invisible) if the flip is ever made to genuinely
       animate. */
    transition:opacity 0s linear .28s, visibility 0s linear .28s;
    /* Both faces occupy the exact same box at all times (only the rotation makes one
       of them face away) — without this, the hidden face can still sit "on top" for
       hit-testing purposes and swallow taps meant for the visible face underneath it.
       Only the currently front-facing side should ever receive pointer events. */
    pointer-events:none;
  }
  .cardflip-inner:not(.flipped) .cardface-front{ pointer-events:auto; }
  .cardflip-inner.flipped .cardface-back{ pointer-events:auto; }
  .cardflip-inner:not(.flipped) .cardface-back,
  .cardflip-inner.flipped .cardface-front{ opacity:0; visibility:hidden; }
  .cardface-back{
    /* -webkit-transform was missing here while every other 3D rule in this block
       carried both spellings — older iOS Safari needs the prefixed form. */
    transform:rotateY(180deg); -webkit-transform:rotateY(180deg);
    background:var(--ios-cardback); display:flex; flex-direction:column;
    border-color:rgba(255,255,255,.18); box-shadow:0 24px 60px rgba(0,0,0,.55);
  }
  .cardback-head{
    display:flex; align-items:flex-start; gap:10px; padding:14px 16px 12px; border-bottom:0.5px solid var(--ios-sep); flex:0 0 auto;
  }
  .cardback-flipclose{ font-size:21px; color:var(--ios-blue); cursor:pointer; flex:0 0 auto; width:24px; line-height:1; margin-top:1px; display:inline-block; animation:flipclosepulse 2.4s ease-in-out infinite; }
  @keyframes flipclosepulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.22);} }
  .cardback-titlewrap{ min-width:0; flex:1; }
  .cardback-subject{ font-size:10px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--ios-label3); margin-bottom:3px; }
  .cardback-headline{ font-size:15px; font-weight:700; line-height:1.35; }
  .cardback-goal{ margin-top:6px; font-size:11.5px; font-weight:600; line-height:1.35; color:#7cc0ff; }
  /* This is the ONLY scroll region that grows with content — the card itself stays a
     fixed 74vh so it never breaks the outer feed's scroll-snap sizing. overscroll-behavior
     keeps a scroll gesture that hits the top/bottom of this list from bleeding into the
     outer feed scroll underneath it. */
  .cardback-scroll{ flex:1 1 auto; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; padding:14px 16px 22px; }
  .cardback-caselink{
    display:block; text-align:center; margin-top:16px; font-size:13px; font-weight:700; color:var(--ios-green);
    background:rgba(48,209,88,.12); border:1px solid rgba(48,209,88,.35); border-radius:12px; padding:11px; cursor:pointer;
  }
  .feedtopscrim{position:absolute; top:0; left:0; right:0; height:100px; background:linear-gradient(180deg, rgba(0,0,0,.5), transparent); z-index:5;}
  .feedbottomscrim{position:absolute; bottom:0; left:0; right:0; height:250px; background:linear-gradient(0deg, rgba(0,0,0,.8), transparent); z-index:5;}

  .feedrail{position:absolute; right:12px; bottom:120px; z-index:20; display:flex; flex-direction:column; align-items:center; gap:12px;}
  .railavatar{width:40px; height:40px; border-radius:50%; border:2px solid #fff; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; background:var(--ios-bg3);}
  .railitem{display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer;}
  .railicon{font-size:24px; filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));}
  .raillabel{font-size:10px; font-weight:700; text-shadow:0 1px 2px rgba(0,0,0,.6); color:#fff;}
  .raillabel.contested{color:rgba(255,255,255,.85);}
  .raillabel.agreed{color:var(--ios-label2);}
  .raillabel.skipped{color:var(--ios-label3);}
  .raildisc{width:28px; height:28px; border-radius:50%; background:#111; border:2px solid #444; margin-top:2px; display:flex; align-items:center; justify-content:center; font-size:11px; animation:spin 5s linear infinite;}
  @keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

  /* Subtle card-flip affordance, modeled on flashcard-app corners (Quizlet) and the
     small "tap to inspect" corner icons common in digital card games — quiet by
     default, a soft pulsing ring is the only thing inviting the tap, no loud color. */
  .flipnub-wrap{
    display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;
  }
  .flipnub{
    position:relative; width:40px; height:40px; border-radius:50%;
    /* backdrop-filter removed 8/24/2026 — it flattens an ancestor preserve-3d
       context in mobile WebKit, and this sits inside the flip subtree. Solid,
       more opaque background compensates. */
    background:rgba(20,20,22,.78);
    border:1px solid rgba(255,255,255,.22); display:flex; align-items:center; justify-content:center;
    font-size:17px; box-shadow:0 4px 14px rgba(0,0,0,.35);
  }
  .flipnub::after{
    content:""; position:absolute; inset:-5px; border-radius:50%; border:1.5px solid rgba(255,255,255,.35);
    animation:flippulse 2.4s ease-out infinite;
  }
  @keyframes flippulse{ 0%{transform:scale(.86); opacity:.55;} 70%{transform:scale(1.22); opacity:0;} 100%{opacity:0;} }
  .flipnub-label{
    font-size:9px; font-weight:700; letter-spacing:.3px; color:rgba(255,255,255,.65); text-shadow:0 1px 2px rgba(0,0,0,.6);
  }
  /* Two nubs side by side — investigate + case board are both story-specific spokes
     that should be visible together on the card, not just one generic flip icon. */
  .flipcluster{ position:absolute; right:14px; bottom:16px; z-index:22; display:flex; gap:12px; }
  .flipnub-badge{
    position:absolute; top:-3px; right:-3px; background:var(--ios-green); color:#04140a; font-size:9px; font-weight:800;
    border-radius:999px; padding:1px 5px; border:1.5px solid #141416;
  }

  /* ---------- ROUND 2, CENTERED ON THE EVIDENCE (Rebecca Hao, 9/4/2026) ----------
     The card back is ONE screen: headline → "Now gather the evidence" → a small pill row
     of tools → the case file as the body, growing as you add → a Ready button. The four
     half-screen tiles ("How do you wanna dig in?") and the Compare notes tab are gone;
     Search / Ask AI / Background open as whole sub-views with one way back. Shipped from
     the approved infodemic-round2-mock.html. */
  .cardback-frame{ font-size:16px; font-weight:800; letter-spacing:-.2px; line-height:1.25; margin:0 0 2px; }
  .cardback-frame .goal{ display:block; margin-top:4px; font-size:12px; font-weight:600; line-height:1.4; color:#7cc0ff; letter-spacing:0; }
  .cardback-frame .goal.done{ color:#9bebb4; }
  .pillrow{ display:flex; gap:6px; margin:12px 0 4px; }
  .pill{
    flex:1 1 0; min-width:0; display:flex; align-items:center; justify-content:center; gap:4px; padding:9px 4px; border-radius:999px;
    background:var(--ios-bg3); border:1px solid rgba(255,255,255,.08); font-size:12.5px; font-weight:700; cursor:pointer;
    white-space:nowrap; line-height:1; color:var(--ios-label); user-select:none; -webkit-user-select:none;
  }
  .pill:active{ background:#3a3a3e; }
  .pill .ic{ font-size:14px; }
  .pill .n{ font-size:10px; font-weight:800; color:#04140a; background:var(--ios-green); border-radius:999px; padding:2px 5px; margin-left:2px; }
  .pill.bg{ border-bottom:2px solid #ff6b6b; } .pill.search{ border-bottom:2px solid var(--ios-blue); } .pill.ai{ border-bottom:2px solid #8a5cff; }
  .resultrow.thepost{ background:linear-gradient(160deg, rgba(255,159,10,.16), rgba(255,159,10,.04)); border-left:3px solid var(--ios-orange); padding:12px 14px 12px 12px; }
  .resultrow.thepost .exhibitlabel{ color:#ffc978; }
  .postacct{ display:flex; align-items:center; gap:7px; margin:8px 0 6px; cursor:pointer; flex-wrap:wrap; }
  .postav{ width:22px; height:22px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; flex:none; }
  .postname{ font-size:12.5px; font-weight:800; }
  .postname .vfd{ color:var(--ios-blue); font-size:11px; }
  .postmeta{ font-size:11px; font-weight:600; color:var(--ios-label2); }
  .posttext{ font-size:15px; font-weight:700; line-height:1.38; }
  .postengage{ margin-top:6px; font-size:11.5px; font-weight:600; color:var(--ios-label2); }
  .casehead{ display:flex; align-items:center; }
  .casehead .cnt{ margin-left:auto; font-size:11px; font-weight:800; color:var(--ios-label3); letter-spacing:.6px; }
  .caseghost{ padding:12px 14px; border-bottom:0.5px solid var(--ios-sep); display:flex; align-items:center; gap:10px; color:var(--ios-label3); font-size:12.5px; font-weight:600; }
  .caseghost:last-child{ border-bottom:none; }
  .caseghost .slot{ width:22px; height:22px; border-radius:6px; border:1.5px dashed rgba(255,255,255,.22); display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:800; flex:none; }
  .resultrow.justadded{ animation:rowin .45s cubic-bezier(.2,.9,.3,1) both; }
  @keyframes rowin{ from{opacity:0; transform:translateY(8px); background:rgba(48,209,88,.18);} to{opacity:1; transform:none; background:transparent;} }
  .caseteam{ margin:10px 4px 0; font-size:11px; color:var(--ios-label3); font-weight:600; display:flex; align-items:center; gap:6px; }
  .caseteam .r3av{ width:16px; height:16px; font-size:7.5px; } .caseteam .r3av + .r3av{ margin-left:-6px; }
  /* Pinned under the scroll region, so the button never scrolls away and the list can grow. */
  .cardback-foot{ flex:0 0 auto; padding:10px 16px 14px; border-top:0.5px solid var(--ios-sep); display:flex; flex-direction:column; gap:5px; background:var(--ios-cardback); }
  .readybtn{ width:100%; padding:13px; border-radius:14px; border:none; font-family:inherit; font-size:15px; font-weight:800; background:var(--ios-green); color:#04140a; cursor:pointer; box-shadow:0 8px 22px rgba(48,209,88,.25); }
  .readybtn:disabled{ background:var(--ios-bg3); color:var(--ios-label3); cursor:default; box-shadow:none; }
  .readybtn.pulse{ animation:readypulse 1.6s ease-in-out infinite; }
  @keyframes readypulse{ 0%,100%{box-shadow:0 8px 22px rgba(48,209,88,.25);} 50%{box-shadow:0 8px 30px rgba(48,209,88,.6);} }
  .readynote{ font-size:11px; color:var(--ios-label3); font-weight:600; text-align:center; }
  .cardback-navback{ display:flex; align-items:center; gap:2px; font-size:14px; font-weight:700; color:var(--ios-blue); cursor:pointer; margin:-4px 0 10px; }
  .cardback-navback .chev{ font-size:22px; line-height:1; margin-top:-2px; }
  .cardback-navback .cnt{ margin-left:auto; font-size:11px; font-weight:800; color:#9bebb4; background:rgba(48,209,88,.14); border-radius:999px; padding:4px 9px; }

  .feedbottom{position:absolute; left:16px; right:78px; bottom:18px; z-index:20;}
  /* The account line (cluster C, 9/3/2026): real-platform shape — name, ✓, handle,
     follower count — all from the story's `background`. In Round 1 it is furniture:
     seen, not tappable, nothing to expand (Tara: "round 1 should stay gut"). It becomes
     a tap into the profile on the live story and, read-only, after filing. */
  .cardsource{
    display:inline-flex; align-items:center; flex-wrap:wrap; gap:0 4px; max-width:100%;
    font-size:11.5px; font-weight:700; color:#fff; line-height:1.35;
    background:rgba(255,255,255,.14); border-radius:999px; padding:5px 11px; margin-bottom:9px;
  }
  .cardsource.tappable{ cursor:pointer; }
  .cardback-backlink{ font-size:12.5px; font-weight:700; color:var(--ios-blue); margin:0 0 12px; cursor:pointer; }
  .cardsource .cs-meta{ display:block; width:100%; font-weight:600; color:rgba(255,255,255,.72); }
  .cardsource .vfd{
    display:inline-flex; align-items:center; justify-content:center; width:13px; height:13px; border-radius:50%;
    background:#1d9bf0; color:#fff; font-size:8.5px; font-weight:900; line-height:1;
  }
  .subjecttag{font-size:10.5px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:rgba(255,255,255,.55); margin-bottom:6px;}
  .headline{font-size:18px; font-weight:800; line-height:1.32; text-shadow:0 1px 4px rgba(0,0,0,.5); margin-bottom:10px;}
  .cardstats{display:flex; gap:16px; font-size:12px; font-weight:600; color:rgba(255,255,255,.65); margin-bottom:12px;}
  .polysticker{
    /* backdrop-filter removed 8/24/2026 — inside the flip subtree, see .flipnub. */
    display:inline-flex; background:rgba(0,0,0,.62); border-radius:14px; padding:4px; margin-bottom:12px;
    border:1px solid rgba(255,255,255,.25);
  }
  .pollopt{font-size:11.5px; font-weight:700; padding:7px 10px; border-radius:10px; cursor:pointer; color:#fff; white-space:nowrap;}
  .pollopt.sel-misinfo{background:var(--ios-red);}
  .pollopt.sel-biased{background:var(--ios-orange); color:#1a1205;}
  .pollopt.sel-true{background:var(--ios-green); color:#04140a;}
  .investigatecta{
    display:inline-block; margin-top:2px; background:var(--ios-red); color:#fff; font-size:13px; font-weight:700;
    padding:9px 14px; border-radius:12px;
  }
  .agreedcta{
    display:block; width:fit-content; margin:8px 86px 0 0; background:rgba(255,255,255,.12);
    color:rgba(255,255,255,.7); font-size:12.5px; font-weight:600;
    padding:8px 13px; border-radius:12px;
  }
  /* Filed verdict, promoted to the top of the hub card (above the headline) — this is
     now the highest-hierarchy thing on a filed card, not a low pill buried near the
     vote reveal. The gut-check votes still render further down on this same face, so
     the two together are the then/now comparison. */
  .hubfiled{
    display:inline-flex; align-items:center; gap:10px; margin-bottom:9px; cursor:pointer;
  }
  .hubstamp{
    font-family:'Space Mono',monospace; font-weight:800; font-size:13.5px; letter-spacing:1.5px; color:var(--ios-green);
    border:2px solid var(--ios-green); border-radius:8px; padding:4px 10px; transform:rotate(-5deg);
    background:rgba(48,209,88,.14); text-shadow:0 1px 2px rgba(0,0,0,.4);
  }
  .hubverdict{font-size:14.5px; font-weight:800; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.5);}

  .stoplight{display:flex; gap:14px;}
  .stoplightopt{
    width:54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:23px; border:3px solid rgba(255,255,255,.28); cursor:pointer; transition:transform .15s ease, border-color .15s ease;
    box-shadow:0 4px 12px rgba(0,0,0,.35);
  }
  .stoplightopt.red{background:var(--ios-red);}
  .stoplightopt.yellow{background:var(--ios-orange);}
  .stoplightopt.green{background:var(--ios-green);}
  .stoplightopt.selected{border-color:#fff; transform:scale(1.14);}
  .stoplight.readonly .stoplightopt{cursor:default;}
  .stoplightcount{font-size:15px; font-weight:800; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.4);}
  .voteexpand{display:inline-block; margin-top:10px; font-size:12px; font-weight:700; color:#fff; opacity:.8; cursor:pointer;}
  /* backdrop-filter removed 8/24/2026 — inside the flip subtree, see .flipnub. */
  .votegroups{margin-top:8px; background:rgba(0,0,0,.62); border-radius:12px; padding:10px 12px;}
  .votegrouprow{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; padding:5px 0; border-bottom:0.5px solid rgba(255,255,255,.1);}
  .votegrouprow:last-child{border-bottom:none;}
  .vglabel{font-weight:700; color:rgba(255,255,255,.85); flex:0 0 auto;}
  .vgnames{color:rgba(255,255,255,.7); text-align:right;}

  @keyframes feedsort{
    0%{transform:translateY(70px) scale(.93); opacity:0;}
    65%{transform:translateY(-8px) scale(1.015); opacity:1;}
    100%{transform:translateY(0) scale(1); opacity:1;}
  }
  .feedcard.justsorted{animation:feedsort .55s cubic-bezier(.2,1,.3,1) both;}

  /* ---------- ROUND REVEAL: Jackbox-style, one story at a time ---------- */
  .reveal{ overflow-y:auto; 
    position:absolute; inset:0; z-index:46; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:0 30px;
    background:
      radial-gradient(ellipse at 30% 15%, #1a1030, transparent 55%),
      radial-gradient(ellipse at 80% 90%, #0a2233, transparent 55%),
      linear-gradient(160deg, #0a0a12, #050508 70%);
  }


  /* ---------- TRIAGE: five loose, chase two (8/31/2026) ---------- */
  .triage{position:absolute; inset:0; z-index:46; display:flex; flex-direction:column;
    background:radial-gradient(ellipse at 30% 12%, #1a1030, transparent 55%),
               radial-gradient(ellipse at 75% 88%, #0d1f2e, transparent 55%), #000;}
  .triagescroll{flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:56px 20px 10px; display:flex; flex-direction:column; align-items:center;}
  .triagetitle{font-size:24px; font-weight:800; letter-spacing:-.4px; text-align:center; margin-bottom:8px;}
  .triagesub{font-size:13.5px; line-height:1.5; color:var(--ios-label2); text-align:center; margin-bottom:20px; max-width:300px;}
  .triagecard{width:100%; display:block; text-align:left;
    background:var(--ios-bg2); border:1.5px solid rgba(255,255,255,.1); border-radius:15px;
    padding:12px 13px; margin-bottom:9px; cursor:pointer;}
  .triagecard.picked{border-color:var(--ios-blue); background:rgba(10,132,255,.13);}
  .triagetick{width:22px; height:22px; border-radius:7px; flex:none; margin-top:2px;
    border:1.5px solid rgba(255,255,255,.28); display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:800; color:#fff;}
  .triagecard.picked .triagetick{background:var(--ios-blue); border-color:var(--ios-blue);}
  .triagebody{min-width:0; flex:1 1 auto;}
  .triagetopic{font-size:10px; font-weight:800; letter-spacing:1px; text-transform:uppercase;
    color:var(--ios-label3); margin-bottom:4px;}
  .triagehead{font-size:14px; font-weight:700; line-height:1.35;}
  .triageflags{display:flex; align-items:center; gap:5px; margin-top:8px;}
  .triagedot{width:10px; height:10px; border-radius:50%; background:var(--ios-bg3);}
  .triagedot.green{background:var(--ios-green);} .triagedot.yellow{background:var(--ios-orange);}
  .triagedot.red{background:var(--ios-red);}
  .triagemeta{margin-left:6px; font-size:10.5px; font-weight:700; color:var(--ios-label3);}

  .triagerow{display:flex; gap:11px; align-items:flex-start; cursor:pointer;}
  .triagefoot{flex:0 0 auto; padding:10px 20px 28px; display:flex; flex-direction:column; gap:9px;
    background:linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.9) 35%);}
  .triagecount{font-size:11.5px; font-weight:800; letter-spacing:.4px; color:var(--ios-label3); text-align:center;}
  .triagebtn{background:var(--ios-blue); color:#fff; font-size:15.5px; font-weight:800; padding:15px 26px;
    border-radius:16px; box-shadow:0 8px 22px rgba(10,132,255,.3); text-align:center; cursor:pointer;}
  .triagebtn.off{opacity:.35; box-shadow:none;}

  /* ---------- THE REVEAL (8/31/2026 mock chrome; 9/3/2026 back to the vote flash) ---------- */
  .rvprogress{font-size:11.5px; font-weight:800; letter-spacing:1.4px; text-transform:uppercase;
    color:var(--ios-label3); margin-bottom:18px;}
  .rvfact{font-size:13.5px; color:var(--ios-label2); text-align:center; line-height:1.45; margin-bottom:8px;}
  .rvfactsubject{font-size:19px; font-weight:800; color:var(--ios-label); letter-spacing:-.2px;
    text-align:center; text-wrap:balance; margin-bottom:26px;}
  .rvrule{width:44px; height:2px; border-radius:2px; background:rgba(255,255,255,.14); margin-bottom:26px;}
  .rvbtn{background:var(--ios-blue); color:#fff; font-size:15.5px; font-weight:800; padding:15px 26px;
    border-radius:16px; box-shadow:0 8px 22px rgba(10,132,255,.3); text-align:center; cursor:pointer;
    border:none; font-family:inherit;}
  .rvbtn.ghost{background:rgba(255,255,255,.08); color:var(--ios-label2); box-shadow:none; font-size:13.5px;
    padding:12px 22px; margin-top:10px;}
  .anim{opacity:0; animation:rvin .5s cubic-bezier(.2,.9,.3,1) both;}
  @keyframes rvin{from{opacity:0; transform:translateY(9px);} to{opacity:1; transform:none;}}

  .revealskip{
    position:absolute; top:22px; right:22px; font-size:12px; font-weight:700; color:var(--ios-label2); cursor:pointer;
    background:rgba(255,255,255,.08); border-radius:999px; padding:7px 13px;
  }
  .revealprogress{ font-size:11.5px; font-weight:800; letter-spacing:1.4px; text-transform:uppercase; color:var(--ios-label3); margin-bottom:16px; }
  .revealsubject{ font-size:11px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:var(--ios-blue); margin-bottom:8px; }
  .revealheadline{ font-size:21px; font-weight:800; line-height:1.32; margin-bottom:32px; max-width:300px; }
  .revealvotes{ display:flex; gap:14px; margin-bottom:28px; flex-wrap:wrap; justify-content:center; }
  .revealvoteitem{ display:flex; flex-direction:column; align-items:center; gap:7px; opacity:0; animation:revealpop .5s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes revealpop{ 0%{transform:scale(.3) translateY(10px); opacity:0;} 60%{transform:scale(1.12); opacity:1;} 100%{transform:scale(1); opacity:1;} }
  .revealavatar{
    width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:19px;
    border:2.5px solid rgba(255,255,255,.25); box-shadow:0 4px 12px rgba(0,0,0,.4);
  }
  .revealavatar.misinfo{ background:var(--ios-red); }
  .revealavatar.biased{ background:var(--ios-orange); }
  .revealavatar.true{ background:var(--ios-green); }
  .revealavatar.none{ background:var(--ios-bg3); color:var(--ios-label3); }
  .revealvotename{ font-size:11px; font-weight:700; color:var(--ios-label2); }
  .revealvotecall{ font-size:10px; font-weight:800; letter-spacing:.4px; text-transform:uppercase; color:var(--ios-label3); margin-top:-3px; }
  .revealverdict{
    font-size:15px; font-weight:800; padding:11px 20px; border-radius:14px; margin-bottom:32px; opacity:0;
    animation:revealpop .5s cubic-bezier(.2,1.6,.4,1) both;
  }

  /* ---------- CLAIM DETAIL (Round 2 / Board) ---------- */

  /* Build stamp on the lobby. Added 8/25/2026 after three separately-verified fixes
     all appeared "not to work" on device: the code on disk was correct every time,
     so the open question was whether the phone was even running that code. A LAN

  .buildstamp{

  /* ---------- ROUND 3: the community note as five beats (cluster B, 9/4/2026) ----------
     Ported from the approved infodemic-round3-mock.html. Every beat is its own full
     screen in #r3Scrim (same scrim pattern as the tour and the story summary); the
     card underneath keeps its read-only case board. Class names are the mock's where

  .r3hint{font-size:11.5px; line-height:1.45; color:var(--ios-label3); font-weight:600; margin-top:7px;}
  .onboard-count{margin-top:18px; font-size:12.5px; font-weight:700; color:#7cc0ff; background:rgba(10,132,255,.12);
    border:1px solid rgba(10,132,255,.3); border-radius:999px; padding:7px 13px;}

  /* a scrolling column with a pinned footer, used by every beat */
  .r3col{position:absolute; inset:0; display:flex; flex-direction:column; background:var(--ios-bg); text-align:left;}
  .r3scroll{flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:58px 18px 12px;

    background:linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.9) 35%);}
  .r3kick{font-size:10.5px; font-weight:800; letter-spacing:1.3px; text-transform:uppercase; color:var(--ios-orange); display:flex; align-items:center; gap:8px;}
  .r3kick .mode{margin-left:auto; font-size:9.5px; padding:3px 8px; border-radius:999px; background:rgba(255,255,255,.08); color:var(--ios-label3); letter-spacing:.8px;}
  .r3kick .mode.talk{background:rgba(48,209,88,.16); color:#8fe0a6;}
  .r3title{font-size:20px; font-weight:800; letter-spacing:-.3px; line-height:1.22; text-wrap:balance;}
  .r3sub{font-size:13px; color:var(--ios-label2); line-height:1.45;}
  .r3lbl{font-size:10px; font-weight:800; letter-spacing:1.1px; text-transform:uppercase; color:var(--ios-label3);}
  .r3btn{width:100%; padding:14px; border-radius:14px; border:none; font-family:inherit; font-size:15.5px; font-weight:800;
    background:var(--ios-blue); color:#fff; cursor:pointer; box-shadow:0 8px 22px rgba(10,132,255,.3);}
  .r3btn:disabled{background:var(--ios-bg3); color:var(--ios-label3); cursor:default; box-shadow:none;}
  .r3btn.green{background:var(--ios-green); color:#04140a; box-shadow:0 8px 22px rgba(48,209,88,.25);}
  /* full-screen card (the transition and the notes-are-in beats) — same shape as a tour screen */
  .r3full{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 30px; text-align:center;
    background:radial-gradient(ellipse at 30% 15%, #1a1030, transparent 55%), radial-gradient(ellipse at 75% 85%, #0d1f2e, transparent 55%), #000;}
  .r3full .onboard-sub{max-width:300px;}
  .r3full .onboard-cta{width:100%; display:flex; flex-direction:column; gap:9px;}
  .r3full .r3btn{width:100%;}

  /* avatars (colored initials) */
  .r3av{width:22px; height:22px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; color:#0b0b12; flex:0 0 auto;}
  .r3av.big{width:34px; height:34px; font-size:14px;}

  /* the post, whole and in context — the Spotter's row is the real feed post. A slash only
     reads while the sentence around it survives: never lift marked words into a chip list. */
  .r3post{border:1px solid rgba(255,255,255,.1); border-radius:18px; padding:14px 14px 12px; flex:none; position:relative;}
  .r3post.live{border-color:rgba(255,159,10,.55); box-shadow:0 0 0 1px rgba(255,159,10,.2);}
  .r3post.done{border-color:rgba(48,209,88,.35);}
  .r3post.dim{opacity:.55;}
  .spothead{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .spotav{width:26px; height:26px; border-radius:50%; background:rgba(255,255,255,.16); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; flex:0 0 auto;}
  .spotwho{display:flex; flex-direction:column; line-height:1.15;}
  .spotname{font-size:12px; font-weight:800;}
  .spothandle{font-size:10.5px; font-weight:600; color:rgba(255,255,255,.55);}
  .spotgot{margin-left:auto; display:flex;}
  .spotgot .r3av{width:20px; height:20px; font-size:9px; border:1.5px solid #000;}
  .spotgot .r3av + .r3av{margin-left:-6px;}
  .spotbody{font-size:16px; line-height:2; font-weight:700; letter-spacing:-.1px;}
  .tok{position:relative; border-radius:5px; padding:1px 3px; cursor:pointer; display:inline-block;}
  .tok.tap:active{background:rgba(255,159,10,.25);}
  .tok.live{background:rgba(255,159,10,.32);}
  .tok.slashed{text-decoration:line-through; text-decoration-thickness:2.5px; color:rgba(255,255,255,.5);}
  .tokavs{position:absolute; top:-8px; right:-5px; display:flex; pointer-events:none;}
  .tokavs .r3av{width:15px; height:15px; font-size:8px; border:1.5px solid #000; margin-left:-5px; position:relative;}
  .r3av.hit::after{content:"✓"; position:absolute; right:-6px; top:-6px; width:11px; height:11px; border-radius:50%; background:var(--ios-green); color:#04140a; font-size:7.5px; font-weight:900; display:flex; align-items:center; justify-content:center; border:1px solid #000;}
  .spotstats{margin-top:8px; font-size:10.5px; font-weight:600; color:var(--ios-label3); display:flex; gap:12px;}
  .spotstraight{margin-top:10px; font-size:12px; font-weight:700; color:var(--ios-label2); background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:9px 10px; cursor:pointer; text-align:center;}
  .spotstraight.on{background:rgba(48,209,88,.16); border-color:rgba(48,209,88,.45); color:#9bebb4;}
  .spotname-panel{margin-top:11px; border-top:1px solid rgba(255,255,255,.14); padding-top:10px;}
  .spotq{font-size:13px; font-weight:800; margin-bottom:9px;}
  .spotchips{display:flex; flex-wrap:wrap; gap:6px;}
  .spotchip{font-size:11.5px; font-weight:700; padding:7px 10px; border-radius:9px; cursor:pointer; font-family:inherit;
    background:rgba(255,69,58,.15); border:1px solid rgba(255,69,58,.32); color:#ff9f96;}
  .spotchip.g{background:rgba(48,209,88,.12); border-color:rgba(48,209,88,.35); color:#9bebb4;}
  .spotchip.on{background:var(--ios-red); color:#fff; border-color:var(--ios-red);}
  .spotchip.g.on{background:var(--ios-green); color:#04140a; border-color:var(--ios-green);}
  .spotcalled{margin-top:10px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; font-size:12.5px; font-weight:700; color:var(--ios-orange);}
  .spotcalled.straight{color:var(--ios-green);}
  .spotcalledlbl{font-size:9.5px; font-weight:800; letter-spacing:.9px; text-transform:uppercase; color:var(--ios-label3);}
  .spotundo{font-size:10.5px; font-weight:700; color:var(--ios-blue); cursor:pointer; margin-left:auto;}
  .r3waiting{display:flex; flex-direction:column; align-items:center; gap:10px; padding:14px; font-size:13.5px; font-weight:700; color:var(--ios-label2);}
  .r3spin{width:22px; height:22px; border-radius:50%; border:3px solid rgba(255,255,255,.12); border-top-color:var(--ios-blue); animation:spin .9s linear infinite; margin:0 auto;}

  /* the flash: everyone's slash on the post, the real tell named underneath */
  .tellbox{border-radius:16px; margin-top:4px; padding:14px 14px; background:linear-gradient(160deg, rgba(255,159,10,.18), rgba(255,159,10,.04)); border:1px solid rgba(255,159,10,.4);
    opacity:0; animation:revealpop .55s cubic-bezier(.2,1.6,.4,1) both;}
  .tellbox.g{background:linear-gradient(160deg, rgba(48,209,88,.18), rgba(48,209,88,.04)); border-color:rgba(48,209,88,.4);}
  .tellname{font-size:17px; font-weight:800; line-height:1.25; margin-top:5px;}
  .tellwords{font-size:12.5px; color:var(--ios-label2); margin-top:4px; line-height:1.4;}
  .tellwords b{color:#ffc978; font-weight:800;}
  .tellcalled{display:flex; align-items:center; gap:6px; margin-top:10px; font-size:11.5px; font-weight:700; color:var(--ios-label2);}
  .tellcalled .r3av{width:20px; height:20px; font-size:9px;}
  .tellcalled .r3av + .r3av{margin-left:-6px;}
  .tellunder{margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,.12); font-size:12.5px; line-height:1.4; color:var(--ios-label2);}
  .tellunder b{color:#fff;}

  .exhtop{display:flex; align-items:center; gap:6px;}
  .exhlet{font-size:10.5px; font-weight:800; letter-spacing:.6px; color:var(--ios-label3);}
  .exhlet b{color:#fff; font-size:12px;}
  .exhwho{font-size:9.5px; font-weight:700; color:var(--ios-label3); display:flex; align-items:center; gap:5px;}
  .exhwho .r3av{width:15px; height:15px; font-size:7.5px;}
  /* write — one field, cite by tapping exhibit rows, the auto-composed tell line, a 90s ceiling */
  .r3clock{height:3px; border-radius:2px; background:rgba(255,255,255,.1); overflow:hidden; flex:none;}
  .r3clock i{display:block; height:100%; background:var(--ios-green); width:100%; animation:clockdown 90s linear forwards; transform-origin:left;}
  @keyframes clockdown{from{transform:scaleX(1);} to{transform:scaleX(0);}}
  .clocklbl{font-size:10px; font-weight:700; color:var(--ios-label3); display:flex; justify-content:space-between; margin-top:-8px;}
  .r3ta{min-height:96px; font-size:14px; resize:none;}
  .citerows{display:flex; flex-direction:column; gap:6px;}
  .citerow{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:12px; border:1px solid rgba(255,255,255,.1); background:var(--ios-bg2); cursor:pointer;}
  .citerow.on{background:rgba(10,132,255,.16); border-color:var(--ios-blue);}
  .citelet{width:26px; height:26px; border-radius:8px; background:rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; flex:none; position:relative;}
  .citelet .mark{position:absolute; right:-7px; top:-7px; font-style:normal; font-size:9px; width:14px; height:14px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:1.5px solid #000;}
  .citelet .mark.h{background:var(--ios-green); color:#04140a; font-weight:900;}
  .citelet .mark.f{background:#000;}
  .citerow.on .citelet{background:var(--ios-blue); color:#fff;}
  .citebody{display:flex; flex-direction:column; gap:2px; min-width:0; flex:1;}
  .citetext{font-size:12px; line-height:1.35; font-weight:700; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .citewho{font-size:10px; font-weight:700; color:var(--ios-label3);}
  .citetick{width:18px; text-align:center; font-size:14px; font-weight:900; color:#7cc0ff; flex:none;}
  /* 🚩 on the write rows (9/4 eve, Tara): Defend's screens are gone; the ruling survives as a
     flag you set while writing, and the talking survives as a rule — flag it, say why. */
  .citeflag{width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:14px; flex:none;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); opacity:.55;}
  .citeflag.on{background:rgba(255,69,58,.2); border-color:rgba(255,69,58,.55); opacity:1;}
  .citerow.flagged{border-color:rgba(255,69,58,.45);}
  .speakup{margin-top:8px; font-size:12.5px; font-weight:700; color:#ff9f96; background:rgba(255,69,58,.1); border:1px solid rgba(255,69,58,.3); border-radius:12px; padding:9px 11px; line-height:1.4;}
  .speakup.quiet{color:var(--ios-label2); background:rgba(255,255,255,.04); border-color:rgba(255,255,255,.1); font-weight:600;}
  .doorrule{margin-top:18px; font-size:13.5px; font-weight:700; line-height:1.45; color:#ffc978; background:rgba(255,159,10,.1); border:1px solid rgba(255,159,10,.35); border-radius:14px; padding:11px 14px; max-width:320px;}
  .citehint{font-size:12px; font-weight:700; color:var(--ios-label2); min-height:16px;}
  .citehint.good{color:#9bebb4;}
  .autoline{background:rgba(255,255,255,.04); border:1px dashed rgba(255,255,255,.2); border-radius:12px; padding:10px 12px;}
  .autoline .r3lbl{margin-bottom:5px; display:flex; gap:6px; align-items:center;}
  .autoline .r3lbl span{background:rgba(255,255,255,.08); padding:2px 6px; border-radius:5px; letter-spacing:.5px;}
  .autotext{font-size:12.5px; line-height:1.45; color:var(--ios-label2); font-weight:600;}
  .autotext.g{color:#9bebb4;}
  .autotext b{color:#fff;}

  /* rate + file — the note cards. Also the filed note on the case board. */
  .r3notecard{background:var(--ios-bg2); border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:12px 13px; display:flex; flex-direction:column; gap:8px; flex:none; text-align:left;}
  .r3notecard.mine{opacity:.5;}
  .r3notecard.win{border-color:var(--ios-green); box-shadow:0 0 0 1px rgba(48,209,88,.35);}
  .ntop{display:flex; align-items:center; gap:8px; font-size:10.5px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; color:var(--ios-label3);}
  .ntop .cnt{margin-left:auto; font-size:10px; letter-spacing:.3px; text-transform:none; color:var(--ios-label2); background:rgba(255,255,255,.07); padding:3px 8px; border-radius:999px;}
  .ntop .cnt b{color:#fff;}
  .nbody{font-size:13.5px; line-height:1.45; font-weight:700;}
  .nauto{font-size:11.5px; line-height:1.4; color:var(--ios-label2); padding-left:9px; border-left:2px solid rgba(255,159,10,.5);}
  .nauto.g{border-left-color:rgba(48,209,88,.5);}
  .ncites{font-size:10.5px; font-weight:700; color:var(--ios-label3);}
  .nsrc{font-size:11.5px; line-height:1.4; font-weight:600; color:var(--ios-label2); display:flex; gap:6px; align-items:baseline;}
  .nsrc .nexh{font-size:9.5px; font-weight:800; letter-spacing:.6px; color:var(--ios-blue); flex:none;}
  .rate{display:flex; gap:7px;}
  .ratebtn{flex:1; padding:10px 6px; border-radius:11px; border:1px solid rgba(255,255,255,.12); background:transparent; color:var(--ios-label2); font-family:inherit; font-size:12.5px; font-weight:800; cursor:pointer;}
  .ratebtn.on.h{background:rgba(48,209,88,.2); border-color:var(--ios-green); color:#9bebb4;}
  .ratebtn.on.n{background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.35); color:#fff;}
  .yours{font-size:11px; font-weight:700; color:var(--ios-label2); text-align:center; padding:4px;}
  .byline{display:flex; align-items:center; gap:10px;}
  .byline .name{font-size:13px; font-weight:800;}
  .byline .sub{font-size:11px; color:var(--ios-label2); font-weight:600;}
  .readout{font-size:15px; font-weight:800; color:#9bebb4; background:rgba(48,209,88,.12); border:1px solid rgba(48,209,88,.35); border-radius:14px; padding:12px 14px; text-align:center; line-height:1.3;}

  /* the filed note, riding on the post in the feed */
  .hubnote{background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.28); border-radius:14px;
    padding:10px 11px; margin-bottom:10px; cursor:pointer;}
  .hubnotehead{display:flex; align-items:center; gap:6px; font-size:10.5px; font-weight:800;
    letter-spacing:.4px; margin-bottom:5px;}
  .hubnotechk{margin-left:auto; color:var(--ios-green); letter-spacing:1px;}
  .hubnotebody{font-size:12.5px; line-height:1.45; font-weight:600;}
  .hubnotefoot{display:flex; margin-top:7px; font-size:10px; font-weight:700; color:rgba(255,255,255,.62);}
  .hubnotego{margin-left:auto; color:#7cc0ff; font-weight:800;}
  .hubnoteline{font-size:11px; line-height:1.4; color:rgba(255,255,255,.7); margin-top:5px; padding-left:8px; border-left:2px solid rgba(255,159,10,.55);}
  .hubnoteline.g{border-left-color:rgba(48,209,88,.6);}
  .hubnotefoot{align-items:center; gap:6px;}
  .hubnotefoot .r3av{width:16px; height:16px; font-size:7.5px; border:1.5px solid rgba(0,0,0,.6);}
  .hubnotefoot .r3av + .r3av{margin-left:-5px;}

  /* the per-story summary screen */
  /* The button used to sit at the end of a column taller than the phone, so on a real
     device it was simply out of reach (Tara: "back to feed button at end not working").
     The rows scroll; the button is pinned. */
  /* Opaque in its own right. The scrim behind it is rgba(0,0,0,.94), which was enough
     while this screen was a dense column of tell rows; the quieter version lets the lit
     card underneath bleed through the whitespace. */
  .storywrap{position:absolute; inset:0; display:flex; flex-direction:column; text-align:center;
    background:linear-gradient(180deg,#0b1210 0%, #05070a 55%, #000 100%);}
  .storyscroll{flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:46px 22px 12px; display:flex; flex-direction:column; align-items:center; gap:9px;}
  .storyfoot{flex:0 0 auto; padding:12px 22px 30px; background:linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.85) 40%);}
  .storykick{font-size:10.5px; font-weight:800; letter-spacing:1.4px; text-transform:uppercase; color:var(--ios-green);}
  .storytitle{font-size:22px; font-weight:800; letter-spacing:-.3px; line-height:1.2;}
  .storysub{font-size:13px; font-weight:600; color:var(--ios-label2); line-height:1.45; margin-bottom:6px;}
  .storynote{width:100%; text-align:left; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.13);
    border-radius:14px; padding:12px; margin-top:4px;}
  .storybtn{width:100%; background:var(--ios-blue); color:#fff; font-size:15px; font-weight:800;
    padding:13px 26px; border-radius:14px; cursor:pointer;}

  /* THE STOP (9/1/2026). The session spends its whole length saying heat climbs on its
     own while a story sits loose. This is the one moment a player gets to SEE it stop,
     so it's a drawn line rather than a number: red climbing, a marker where the note
     landed, green flat after. Timed so the climb finishes before the flat starts —
     the pause between them is the point. */
  .stopviz{position:relative; width:100%; max-width:300px; margin:10px 0 2px;}
  .stopviz svg{width:100%; height:116px; display:block; overflow:visible;}
  .stopfill{opacity:0; animation:stopfillin .5s ease .35s both;}
  .stopclimb{stroke-dasharray:260; stroke-dashoffset:260; animation:stopdraw .95s cubic-bezier(.5,0,.8,.35) both;}
  .stopflat{stroke-dasharray:120; stroke-dashoffset:120; animation:stopdraw .5s ease 1.25s both;}
  .stopdot{opacity:0; transform-origin:186px 18px; animation:stoppop .45s cubic-bezier(.2,1.7,.4,1) 1.05s both;}
  .stopmark{position:absolute; right:0; top:-4px; font-size:10.5px; font-weight:800; letter-spacing:.4px;
    color:var(--ios-green); opacity:0; animation:stopfillin .4s ease 1.35s both;}
  @keyframes stopdraw{ to{ stroke-dashoffset:0; } }
  @keyframes stopfillin{ from{opacity:0;} to{opacity:1;} }
  @keyframes stoppop{ from{opacity:0; transform:scale(.2);} to{opacity:1; transform:scale(1);} }
  .stopbig{font-size:40px; font-weight:900; letter-spacing:-1.4px; line-height:1;
    opacity:0; animation:stopfillin .45s ease 1.6s both;}
  .stopunit{font-size:14px; font-weight:800; color:var(--ios-label3); margin-left:7px; letter-spacing:0;}

  /* The transfer line. Not about the game — about their feed tonight. */
  .pausecard{width:100%; text-align:left; margin-top:18px; border-radius:16px; padding:15px 16px;
    background:linear-gradient(160deg, rgba(10,132,255,.14), rgba(255,255,255,.04));
    border:1px solid rgba(10,132,255,.28); opacity:0; animation:stopfillin .5s ease 1.9s both;}
  .pausekick{font-size:10.5px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase;
    color:var(--ios-blue); margin-bottom:9px;}
  .pauseline{font-size:17px; font-weight:800; line-height:1.3; margin-bottom:9px;}
  .pausesub{font-size:13px; font-weight:600; color:var(--ios-label2); line-height:1.5;}

  .chatbubble{display:table; max-width:86%; padding:11px 14px; border-radius:16px; font-size:14px; line-height:1.42; margin-bottom:10px;}
  .chatbubble.user{background:var(--ios-blue); color:#fff; margin-left:auto; margin-right:0; border-bottom-right-radius:4px;}
  .chatbubble.ai{background:var(--ios-bg2); color:var(--ios-label); margin-right:auto; margin-left:0; border-bottom-left-radius:4px;}
  .chatbubble.typing{padding:14px 18px;}
  .typingdots{letter-spacing:2px; animation:blink 1.1s infinite; font-weight:900;}
  @keyframes blink{ 0%,100%{opacity:.25;} 50%{opacity:1;} }



  /* ---------- BOARD: determination + reveal ---------- */
  .radiorow{display:flex; align-items:center; gap:12px; padding:13px 14px; border-bottom:0.5px solid var(--ios-sep); cursor:pointer; font-size:14px; font-weight:600;}
  .radiorow:last-child{border-bottom:none;}
  .radiocircle{width:20px; height:20px; border-radius:50%; border:1.6px solid var(--ios-label3); flex:0 0 auto; position:relative;}
  .radiocircle.selected{border-color:var(--ios-blue);}
  .radiocircle.selected::after{content:""; position:absolute; inset:3px; border-radius:50%; background:var(--ios-blue);}
  .confirmrow{display:flex; align-items:flex-start; gap:12px; padding:14px 4px; cursor:pointer;}
  .checkbox{width:20px; height:20px; border-radius:5px; border:1.6px solid var(--ios-label3); flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900; color:#04140a; margin-top:1px;}
  .checkbox.checked{background:var(--ios-blue); border-color:var(--ios-blue); color:#fff;}
  .confirmtext{font-size:13px; color:var(--ios-label2); line-height:1.5;}
  .filebtn{width:100%; text-align:center; font-size:16px; font-weight:600; padding:14px; border-radius:12px; background:var(--ios-blue); color:#fff; border:none; cursor:pointer;}
  .filebtn:disabled{opacity:.35;}
  .stamp{
    display:inline-block; border:3px solid var(--ios-green); color:var(--ios-green); font-family:'Space Mono',monospace; font-weight:700;
    font-size:13px; letter-spacing:1.5px; padding:6px 14px; border-radius:8px; transform:rotate(-6deg); opacity:.9; margin-bottom:10px;
  }
  /* Plays exactly once, right when a case is filed — see justFiledClaimId (consumed
     on the render that draws it, so later re-renders don't replay it). */
  .stamp.justfiled{ animation:stampslam .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes stampslam{
    0%{ transform:scale(2.4) rotate(-6deg); opacity:0; }
    55%{ transform:scale(.92) rotate(-6deg); opacity:1; }
    100%{ transform:scale(1) rotate(-6deg); opacity:.9; }
  }

          '<span style="color:var(--ios-green);">' + s.filedN + ' contained</span></div>';
  html += '</div>';

  // 2. ...but it wasn't free. What the stories collected on the way to being stopped.
  html += '<div class="endcard">';
  html += '<div class="endcardtag">Before you stopped it</div>';
  html += '<div class="endbignum">' + formatCount(s.totalShares) + '<span class="endbigunit">shares</span></div>';
  html += '<div class="endbigsub">collected while these stories sat un-filed. Average time from "we\'re taking this one" to "case filed": ' +
          fmtDuration(s.avgLooseMs) + '. Every second of that was reach.</div>';
  html += '</div>';

  html += '<div class="endcard"><div class="endcardtag">Story by story</div>';
  s.rows.forEach(function(r, i){
    var pct = Math.max(3, Math.round(100*r.shares/s.maxShares));
    html += '<div class="endrow' + (i===0?' first':'') + '"><div class="endrank">' + (i+1) + '</div><div class="endrowmain">';
    html += '<div class="endrowhead">' + r.headline + '</div>';
    html += '<div class="endrowbar"><span data-w="' + pct + '"></span></div>';
    html += '<div class="endrowmeta">' + formatCount(r.shares) + ' shares' +
            (r.looseMs!=null ? ' · loose ' + fmtDuration(r.looseMs) : '') + '</div>';
    // Was "Filed as 🚩 Misinfo" — a determination that no longer exists. The note's own
    // line is both truer and more legible: it says what the table concluded, in their words.
    if(r.note) html += '<div class="endrowverdict">📝 ' + r.note + '</div>';
    html += '</div></div>';
  });
  html += '</div>';

  if(worst){
    html += '<div class="endcard"><div class="endcardtag">Travelled furthest</div>';
    html += '<div class="endrowhead" style="margin-bottom:9px;">' + worst.headline + '</div>';
    html += '<div class="endnote">It was the loudest thing on your feed' +
            (worst.looseMs!=null ? ' for ' + fmtDuration(worst.looseMs) : '') +
            '. Nothing about it was truer than the rest — it just sat longer.</div></div>';
  }
  if(s.skippedN > 0){
    html += '<div class="endcard"><div class="endcardtag">Never called</div>';
    html += '<div class="endnote">' + s.skippedN + ' ' + (s.skippedN===1?'story':'stories') +
            ' ran out the clock with nobody calling ' + (s.skippedN===1?'it':'them') +
            ' either way. Nobody called them \u2014 which isn\'t the same as them being fine.</div></div>';
  }
  // Was "your table agreed on it straight away, so it never got looked at" — consensus
  // framing, retired 8/31/2026. Under triage the honest version is simpler: you chose,
  // and these are the ones you left.
  if(s.leftN > 0){
    html += '<div class="endcard"><div class="endcardtag">Still out there</div>';
    html += '<div class="endnote">' + s.leftN + ' ' + (s.leftN===1?'story':'stories') +
            ' never got looked at, so nothing happened to ' + (s.leftN===1?'it':'them') +
            ' \u2014 ' + (s.leftN===1?'it\'s':'they\'re') + ' still going. Worth saying out loud now that it\'s over: was leaving ' +
            (s.leftN===1?'it':'them') + ' the same thing as ' + (s.leftN===1?'it':'them') + ' being fine?</div></div>';
  }

  html += '</div><div class="endfoot">';
  html += '<div class="endbtn" onclick="dismissEndReport()">Back to the feed</div>';
  html += '<div class="endbtn ghost" onclick="dismissEndReport(); openApp(\'spread\')">Open The Spread</div>';
  html += '</div></div>';
  document.getElementById("screenArea").innerHTML = html;

  // Widths land on the next frame so the balance bar sweeps to green and each story's
  // bar grows in, instead of the whole report arriving pre-settled.
  setTimeout(function(){
    var r = document.getElementById("endbar-r"), g = document.getElementById("endbar-g");
    if(r) r.style.width = "0%";
    if(g) g.style.width = "100%";
    var bars = document.querySelectorAll(".endrowbar span");
    for(var i=0;i<bars.length;i++){ bars[i].style.width = (bars[i].getAttribute("data-w")||0) + "%"; }
  }, 90);
}

// Consumed-on-read, one-shot: set the instant a case is filed, cleared by whichever

var justFiledClaimId = null;
// The per-story summary (8/30/2026, Tara: "per story summary that fires after filing").
// Its own screen, one story, fired a beat after the FILED stamp lands — not a section of

var pendingStory = null;
// Background Check is a 4th investigation mode, authored as a short "account
// snapshot" per claim. Rather than build a parallel evidence system for it, each

// that way findClipById/addToBoard/skipClip/clipState/the board's exhibit list all
// just work on it for free, same as any Search or Ask AI result.
CLAIMS.forEach(function(claim){
  // Seeds the CLIPS entry from the one account behind this story.
  var b = claim.background;

    id: "bg-"+claim.id,

    detail: null,

  });
});

var clipState = {};
Object.keys(CLIPS).forEach(function(id){
  CLIPS[id].forEach(function(c){ clipState[c.id] = {revealed: (c.source==="ai"||c.source==="background"), who:null, shared:false, skipped:false}; });
});
var reverseOpen = {};
var aiRevealed = {};

var pendingOnboard = null;
// See the ONBOARDING section further down for what these do — onboardScreenIdx is

// The account line on the card front (cluster C, 9/3/2026). When is it a tap?

//   The LIVE story → Background check (as since 8/18).

function sourceTappable(claimId){

function findClipById(id){
  var found = null;

}
// Tells found during investigation are parked here rather than written straight
// into `unlockedTells` — the reveal rule (8/24/2026) is that nothing about which
// tell framed a card surfaces until the table files the case. Keyed by claim id
// so filing one case can't leak what's sitting on another.
var pendingTells = {};
function commitTells(claimId){
  var claim = claimById(claimId);
  if(claim){
    // The tell behind this story counts as found once the case is filed.
    if(claim.tell) unlockedTells[claim.tell] = true;
  }
  var pend = pendingTells[claimId] || {};
  Object.keys(pend).forEach(function(k){ unlockedTells[k] = true; });
  delete pendingTells[claimId];
}
function maybeUnlock(clipId){
  // The Tells library is never gated — but the ✓ badge is deferred now. Running into
  // a tell mid-investigation parks it in `pendingTells`; filing the case is what
  // actually marks it found. Otherwise the badge lights up the moment you open the
  // right clip, which is a hint about that clip — exactly what the reveal rule
  // withholds until the table has committed to a call.
  var clip = findClipById(clipId);
  if(!clip || !clip.tell) return;
  var owner = null;
  Object.keys(CLIPS).forEach(function(fid){
    if(CLIPS[fid].some(function(c){ return c.id===clipId; })) owner = Number(fid);
  });
  if(owner==null) return;
  if(!pendingTells[owner]) pendingTells[owner] = {};
  pendingTells[owner][clip.tell] = true;
}
function getBoard(id){ if(!BOARD[id]) BOARD[id] = {board:[], filed:false, filedAt:null, caseNo:null}; return BOARD[id]; }
// ---------------- ROUND 3: THE COMMUNITY NOTE (cluster B, rebuilt 9/4/2026) ----------------
// Jared, Round 2 playtest: the old role chain "went on forever". Tara's answer (B1–B21,
// 9/3/2026) was to rebuild the round as five beats, mocked first in
// infodemic-round3-mock.html and approved 9/4 ("ok this is good, can merge into hub and
// spoke"). The mock is the spec; this is its port onto the real state.
//
//   gate  → "Can your team say what actually happened yet?" (B18, one question, two taps)
//   1     → transition card: why you're looking at the post again (B2)
//   2     → SPOT (silent): slash the post, name it with a chip (B4) → FLASH with the real
//           tell on the same screen (B1)
//   3     → DEFEND YOUR EVIDENCE (talk): one or two Socratic prompts keyed to the kind of
//           source, quietest owner first then a weak type (B5, B9); the owner rules It
//           holds / 🚩 Flag it (B8); a flag stays on the board and stays citable (B6)

//   5     → RATE (silent): Helpful / Not helpful on every note but yours, anonymous (B14–B16)
//   6     → FILE (talk): the winning note, bylined, read aloud, then fileBoard() (B17)
//
// The whole cut list (B20) is gone: Editor blind pick, Translator swaps, Checker seat,
// role cards + handoff banners, scarce moves, the "not yet" send-back, the read-out vote,
// the ship button, the 60s shared draft clock, the word menus.
//
// Solo demo (B7, B19): you play every beat for real; Maya, Diego and Priya spot, defend,
// write (r3NpcDrafts) and rate on their own, deterministically. Their exhibit ownership is
// seeded (R3_OWNER_SEED) so the quietest-player rules have something to bite on.
function getR3(id){
  var b = getBoard(id);
  if(!b.r3) b.r3 = {
    started:false,        // the gate was answered "Yes — let's write it"
    beat:"transition",    // transition | spot | wait | flash | defend | write | ratein | rate | file | filed
    spot:null,            // your Spotter call: {i:wordIndex, key:tellKey} or {straight:true}
    naming:null,          // word index whose chip panel is open
    rulings:{},           // clipId -> "flag"  (set on the Write screen since 9/4 eve; visible on the board afterwards)
    text:"",              // your note, as typed
    cites:[],             // clip ids you cited (B11: one unlocks Done)
    ratings:{},           // pid -> "h" | "n"  (yours; NPCs rate under the hood)
    notes:null,           // the four notes once Rate opens: pid -> {text, cites}
    result:null,          // {helpful, ranked, winner}
    note:null,            // the FILED note: {text, cites, by} — what r3NoteText() reads
    sources:[],           // = note.cites, the receipt's "Sources cited"
    writeStartedAt:null, waitN:2, timers:[]

}
function r3Started(claimId){ var b = BOARD[claimId]; return !!(b && b.r3 && b.r3.started); }
// The gate that ends Round 2 and opens Round 3: enough pooled evidence to write from.
// Same constant the deleted board tour used — it was always the same idea.
function r3Open(claimId){ return getBoard(claimId).board.length >= BOARD_TOUR_EVIDENCE_THRESHOLD; }
// The team has passed the evidence gate on this story and is writing, not looking.
function r3Writing(claimId){ return r3Started(claimId) && !getBoard(claimId).filed; }
// The story the note gate is about: past the threshold, not filed, not yet answered "yes".
// Per story, not per session — the question is a decision about THIS case, not a tour.
function r3GateClaim(){ return CLAIMS.filter(function(c){ return r3Open(c.id) && !getBoard(c.id).filed && !r3Started(c.id); })[0]; }
function r3GateCount(){ var c = r3GateClaim(); return c ? getBoard(c.id).board.length : BOARD_TOUR_EVIDENCE_THRESHOLD; }
function r3ActiveClaim(){ return CLAIMS.filter(function(c){ return r3Writing(c.id); })[0] || null; }
function r3Start(claimId){
  var r = getR3(claimId);

}
function r3NoteText(b){ return (b.r3 && b.r3.note) ? b.r3.note.text : ""; }
// The other three write theirs from this claim's own evidence, so a draft is never
// generic filler: a named-institution clip, an AI answer, a plain summary.
function r3NpcDrafts(claim){
  var clips = CLIPS[claim.id] || [];
  var inst = clips.filter(function(c){ return c.who==="News / institution"; })[0];
  var ai = clips.filter(function(c){ return c.source==="ai"; })[0];
  return {
    maya: "The story is less dramatic than the post makes it sound.",
    diego: inst ? inst.text : "There's a named source that says something narrower than the post.",
    priya: ai ? ai.text : "The post overstates what anyone has actually shown."
  };
}
function claimNumber(id){ return "INF-" + String(4000 + id*137).slice(-5); }

// ---- the Spotter's vocabulary and the flash (B1, B4) ----
// Five reds plus a way to say the post was straight. NOT the 17-item library — that stays
// open separately, and a picker that long is a reading task (9/1/2026). The green option
// is load-bearing: some stories in the feed are straight, and without a "this one's
// straight" answer the green flag has no play.
var SPOT_STRAIGHT = "Nothing here is doing work";

function r3Words(claim){ return claim.headline.split(/\s+/); }
// Where the card tell's own words sit in the headline (token range), for the NPC slashes.
function r3CardRange(claim){
  if(!claim.cardWords) return null;
  var W = r3Words(claim), T = claim.cardWords.split(/\s+/);
  for(var s=0; s+T.length<=W.length; s++){
    var ok = true;
    for(var k=0;k<T.length;k++){ if(W[s+k].indexOf(T[k])!==0){ ok = false; break; } }
    if(ok) return [s, s+T.length];
  }
  return null;
}
// NPC spots: two right, one wrong (the mock's script). Maya and Priya slash inside the card
// tell's own words; Diego slashes the loudest word and names it wrong. On a straight story
// Maya and Priya say nothing here is doing work; Diego still falls for the loud word.
var R3_LOUD = /shocking|viral|breaking|dumb|drains|deserves|collapses|toxic|😤|😳|🚨/i;
function r3NpcSpots(claim){
  var W = r3Words(claim), range = r3CardRange(claim), loud = -1;
  W.forEach(function(w, i){ if(loud<0 && R3_LOUD.test(w)) loud = i; });
  if(loud < 0) loud = W.length-1;
  var wrongKey = claim.cardTell==="made-to-feel-it" ? "rushing-you" : "made-to-feel-it";
  var out = {diego:{i:loud, key:wrongKey}};
  if(!claim.cardTell){ out.maya = {straight:true}; out.priya = {straight:true}; }
  else {
    var s = range ? range[0] : 0, e = range ? range[1]-1 : 0;

}

}

function r3DigPlain(claim){ return R3_DIG_PLAIN[claim.tell] || (TELL[claim.tell] ? TELL[claim.tell].name.toLowerCase() : ""); }

function renderReverseBlock(c){
