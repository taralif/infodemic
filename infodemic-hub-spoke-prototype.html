// ---------------- ROUND 1 TIMER ----------------
// Timer no longer auto-starts on render — the table decides when it's ready
// (see renderRound1Start / beginRound1 below).
var roundTimerHandle = null;
function beginRound1(){
  if(roundState.started) return;
  roundState.started = true;
  roundState.startedAt = Date.now();
  roundTimerHandle = setInterval(function(){
    var elapsed = Math.floor((Date.now()-roundState.startedAt)/1000);
    roundState.secondsLeft = Math.max(0, 60-elapsed);
    if(roundState.secondsLeft<=0 && !roundState.ended && !roundState.showingTimesUp){
      // Time's up: hold on the interstitial until the table explicitly continues
      // (see dismissTimesUp) — it no longer auto-advances on its own.
      roundState.showingTimesUp = true;
      clearInterval(roundTimerHandle);
      if(currentApp==="round1") render();
    } else if(currentApp==="round1" && !roundState.showingTimesUp){
      // Only touch the countdown badge directly instead of calling the full render() —
      // rebuilding the whole feed's innerHTML every 250ms was destroying and recreating
      // the vote buttons out from under a tap in progress, which is why picking a color
      // sometimes took several clicks to register (and why auto-advance-to-next-card
      // sometimes looked broken — the smooth scroll got cut off mid-animation by the
      // next rebuild). The countdown is the only thing that actually changes each tick,
      // so that's the only thing that needs to update.
      var badge = document.getElementById("roundbadge");
      if(badge){
        badge.textContent = "⏱ " + roundState.secondsLeft + "s";
        badge.className = "roundbadge" + (roundState.secondsLeft<=10 ? " urgent" : "");
      } else {
        render();
      }
    }
  }, 250);
  render();
}
// Demo/testing shortcut — tap the countdown badge to skip straight to Time's Up,
// instead of waiting out the full 60s. Mirrors exactly what the interval above does
// when it naturally hits 0.
function forceTimesUp(){
  if(!roundState.started || roundState.ended || roundState.showingTimesUp) return;
  if(roundTimerHandle) clearInterval(roundTimerHandle);
  roundState.secondsLeft = 0;
  roundState.showingTimesUp = true;
  if(currentApp==="round1") render();
}
function endRound1(){
  roundState.ended = true;
  roundState.justEnded = true;
  // Clock the moment claims became contested-and-loose — every "loose 3:20" in the
  // end-of-session report is measured from here.
  roundState.endedAt = Date.now();
}

// ---------------- VOTES / SORTING ----------------
function castVote(claimId, call){
  if(roundState.ended) return;
  claimVotes[claimId] = (claimVotes[claimId]===call) ? null : call;
  render();
  // Picking a color (not un-picking one) bounces you straight to the next card —
  // keeps the gut-check moving instead of making players manually scroll each time.
  if(claimVotes[claimId] !== null) scrollToNextCard(claimId);
  maybeEndEarly();
}
// A timer is a ceiling, not a duration (Tara, 8/31/2026): the moment every call is
// in, the round ends — nobody should sit watching a clock run out on a decision the
// table has already made. The 60s cap still exists for the table that stalls.
// Single-player file, so "everyone" is you: every claim carries a call.
function maybeEndEarly(){
  if(!roundState.started || roundState.ended || roundState.showingTimesUp) return;
  var allIn = CLAIMS.every(function(c){ return !!claimVotes[c.id]; });
  if(allIn) setTimeout(forceTimesUp, 500);   // a beat, so the last tap is seen landing
}
// scrollAnimUntil guards the engagement-gravity tick below from rebuilding the
// feed mid-scroll — mirrors the same fix in infodemic-multiplayer-prototype.html
// (8/16/2026 playtest: card-to-card jump didn't always work seamlessly).
var scrollAnimUntil = 0;
function scrollToNextCard(claimId){
  var current = document.getElementById("slide-"+claimId);
  if(!current || !current.nextElementSibling) return;
  var next = current.nextElementSibling;
  if(typeof next.scrollIntoView === "function"){
    scrollAnimUntil = Date.now() + 700;
    next.scrollIntoView({behavior:"smooth", block:"start"});
  }
}
function claimVotesFor(claim){
  var v = {};
  PLAYERS.forEach(function(p){
    v[p.id] = p.isYou ? (claimVotes[claim.id] || null) : claim.npcVotes[p.id];
  });
  return v;
}
function claimStatus(claim){
  if(!roundState.ended) return "voting";
  var v = claimVotesFor(claim);
  var vals = Object.keys(v).map(function(k){ return v[k]; }).filter(function(x){ return x!=null; });
  var uniq = vals.filter(function(x,i){ return vals.indexOf(x)===i; });
  // Nobody called it at all. This used to fall through to "agreed" below, because
  // zero distinct answers also satisfies uniq.length<=1 - so an untouched story got
  // reported as a table decision. Silence isn't consensus (Tara, 8/24/2026).
  if(vals.length===0) return "skipped";
  return uniq.length<=1 ? "agreed" : "contested";
}

// ---------------- NAV ----------------
function goHome(){ currentApp = "round1"; render(); }
// There's no separate full-screen claim view anymore — everything about a story
// (investigate, case board) lives on that story's own card. Jumping to a claim from
// elsewhere (e.g. the Spread's "top contested claim" tile) means: go back to the
// feed, flip that card open straight to its Board tab, and scroll it into view.
function openClaim(id){
  // Was gated on claimStatus === "contested" — the last of the three consensus gates,
  // and the one that made the Spread's "top spreading right now" tile silently do
  // nothing for a story the table happened to agree about. Any unfiled story opens.
  if(!roundState.ended || !seenOnboard.investigate) return;
  currentApp = "round1";
  openSpoke(id, "board");
  setTimeout(function(){
    var el = document.getElementById("slide-"+id);
    if(el && typeof el.scrollIntoView === "function") el.scrollIntoView({behavior:"smooth", block:"start"});
  }, 50);
}
function openApp(name){ currentApp = name; render(); }

// ---------------- CARD FLIP (inline Round 2 investigation) ----------------
// Pure front<->back toggle — only used by the back face's own ↩ close control now.
// Filed claims can still flip (to review the read-only board/receipt), they just
// can't reach Search/Ask AI anymore — renderCardBack enforces that, not this.
function flipCard(claimId){
  // No status gate any more. Triage decides what the table AGREED to chase; it does not
  // decide what anyone is allowed to look at (Tara, 8/31/2026: "any of them should be
  // investigatable"). A story nobody picked is still one tap from its tools.
  if(!roundState.ended) return;
  if(!seenOnboard.investigate) return; // whole table clears the Investigate tour before anyone can flip a card open
  claimFlipped[claimId] = !claimFlipped[claimId];
  render();
}
// Front-face buttons use this instead — always flips IN (never toggles back out,
// since these buttons are only reachable while the front face is showing) and can
// jump straight to a specific spoke. Passing no mode leaves cardMode as-is, which
// means "investigate" reopens wherever you last left off, or the move-menu the very
// first time — see renderCardBack/renderMoveMenu.
function openSpoke(claimId, mode){
  if(!roundState.ended) return;   // same open-to-all rule as flipCard
  if(!seenOnboard.investigate) return; // same gate as flipCard — finalizeOnboard() flips this true before its own hand-off call
  claimFlipped[claimId] = true;
  if(mode) cardMode[claimId] = mode;
  render();
}
function setCardMode(claimId, mode){ cardMode[claimId] = mode; render(); }

// ---------------- ROUND 1 RENDER ("For You" immersive feed) ----------------
// The onboarding tour (see maybeShowOnboard/ONBOARD_CONTENT) covers this screen
// immediately on entry and now owns starting the round — its last screen's
// "I'm ready" IS the start action once the whole table's (simulated teammates
// included) tapped it (see finalizeOnboard). Mirrors the same change in
// infodemic-multiplayer-prototype.html.
function renderRound1Start(){
  var html = '<div class="r1start">';
  html += '<div class="r1startbadge">ROUND 1</div>';
  html += '<div class="r1starttitle">Gut Check</div>';
  html += '<div class="r1startsub">'+CLAIMS.length+' stories, one shared 60-second clock. Red, yellow, or green — go with your gut on each one before time runs out.</div>';
  html += '<div class="r1starthint">Getting your table ready…</div>';
  html += '</div>';
  document.getElementById("screenArea").innerHTML = html;
}
function renderRound1TimesUp(){
  var html = '<div class="r1timesup">';
  html += '<span class="r1timesupclose" onclick="dismissTimesUp()">✕</span>';
  html += '<div class="r1timesupbig">⏰ TIME\'S UP</div>';
  html += '<div class="r1timesuptitle">Let\'s see where you landed</div>';
  // Was: "go through each story, one at a time — how it was called, and where your table
  // agreed or split." Both halves went stale on 8/31/2026 — the reveal plays ONE story
  // now, and agreed/split stopped being a thing the game says anywhere. Deliberately
  // does not tip the discovery ("you didn't all see the same post") — that card is the
  // whole point of the next screen and shouldn't be spoiled by a loading caption.
  html += '<div class="r1timesupsub">Pens down. We\'ll start with one story, and how each of you called it.</div>';
  html += '<div class="r1timesupbtn" onclick="dismissTimesUp()">Continue</div>';
  html += '</div>';
  document.getElementById("screenArea").innerHTML = html;
}
// Stays on screen until the table explicitly continues (or X's out) — no auto-timeout.
function dismissTimesUp(){
  roundState.showingTimesUp = false;
  startRoundReveal();
}

// ---------------- ROUND REVEAL (Jackbox-style, one story at a time) ----------------
function startRoundReveal(){
  endRound1(); // locks in final vote tallies so claimStatus/claimVotesFor are stable through the reveal
  revealState.active = true;
  revealState.index = 0;
  revealState.discovered = false;   // story 1 opens on the discovery card, once per session
  // ONE story, not five (8/31/2026, Tara: "it sticks after one"). The reveal's job is
  // the discovery — we did not see the same post — and that lands exactly once. Running
  // it five times spends the format of a revelation on what is, by story three,
  // reference material: four repeats of a punchline the table already got, and about
  // 75 seconds of watching right after a 60-second silent round. The other four stories
  // still show their spread — inside the triage cards, where it is what it actually is:
  // information for a choice. Reinforcement comes later and better, at each story
  // summary after filing, where a tell gets named against a version they worked on.
  revealState.order = CLAIMS.slice(0, 1);
  if(currentApp==="round1") render();
}
function revealNext(){
  if(revealState.index < revealState.order.length - 1){
    revealState.index++;
    if(currentApp==="round1") render();
  } else {
    finishRoundReveal();
  }
}
function skipRoundReveal(){ finishRoundReveal(); }
// The reveal no longer hands off to the picker (8/31/2026, Tara: "you all got a story
// about x, different version rows, what really happened? then maybe triage happens
// after you've filed the first story"). The question the reveal asks gets answered on
// the story it just asked it about — same object, no screen in between — and the whole
// table does that one together, so the tour, the roles and the note all land on shared
// ground. Triage waits until they've felt what chasing a story actually costs; see
// dismissStory().
function finishRoundReveal(){
  revealState.active = false;
  var opening = revealState.order[0];
  triageState.picked = opening ? [opening.id] : [];
  triageState.open = {};
  triageState.stage = "pending";
  roundState.justEnded = true;   // feed shuffles, opening story to the front
  if(currentApp==="round1") render();
  setTimeout(function(){
    roundState.readyForR2Popup = true;
    if(currentApp==="round1") maybeShowOnboard();   // the Investigate tour
  }, 900);
}
function finishRoundRevealOld(){
  revealState.active = false;
  roundState.justEnded = true; // still shows the feed's shuffle-into-place animation
  if(currentApp==="round1") render();
  setTimeout(function(){
    // Let the shuffle actually settle before the Round 2 sheet slides up —
    // otherwise the popup covers the animation you're trying to show off.
    roundState.readyForR2Popup = true;
    if(currentApp==="round1") maybeShowOnboard();
  }, 900);
}
// ---------------- THE REVEAL, REBUILT AROUND VERSIONS (8/31/2026) ----------------
// Ported from infodemic-reveal-mock.html, which Tara reviewed at real size on device
// (8/26) and which had never been merged. The old version animated per-player vote
// avatars against an invisible shared story and ended on "Table agreed / Contested" —
// which asked players to care about consensus before they knew the thing worth caring
// about: they were not reading the same post.
//
// Rows are VERSIONS, not people. The shared fact is stated once at the top; everything
// under it is variation, so the layout itself is the lesson — constant on top, spin
// underneath. Avatars sit in the left gutter of the version their player was served,
// coloured by how that player flagged it.
//
// No tells here. Rule 4 of the reveal rules still holds: Round 1 shows versions and gut
// flags only; the post-file story summary is where a tell gets named.
function revealRows(claim){
  var rows = [];
  PLAYERS.forEach(function(pl){
    var variant = variantForPlayer(claim, pl.id);
    var row = rows.filter(function(r){ return r.headline === variant.headline; })[0];
    if(!row){ row = {headline:variant.headline, who:[]}; rows.push(row); }
    row.who.push({p:pl, flag:claimVotesFor(claim)[pl.id]});
  });
  return rows;
}
var FLAG_CLASS = {misinfo:"red", biased:"yellow", "true":"green"};
// Fires ONLY when two players got the identical version and flagged it differently —
// same evidence, different read, the one argument the table can't dodge. Deliberately
// silent when they agree.
function revealSplit(row){
  if(row.who.length < 2) return null;
  var flags = row.who.map(function(w){ return w.flag; });
  var distinct = flags.filter(function(f, i){ return f && flags.indexOf(f) === i; });
  if(distinct.length < 2) return null;
  return row.who.map(function(w){ return w.p.isYou ? "You" : w.p.name; });
}
function renderRoundReveal(){
  var claim = revealState.order[revealState.index];
  var isLast = revealState.index === revealState.order.length - 1;
  var isFirst = revealState.index === 0;
  var rows = revealRows(claim);
  var held = isFirst && !revealState.discovered;

  var html = '<div class="reveal'+(held?' held':'')+'">';
  html += '<span class="revealskip" onclick="skipRoundReveal()">Skip ✕</span>';

  var off = 0;
  html += '<div class="rvprogress anim" style="animation-delay:'+off+'ms;">The first story</div>';
  html += '<div class="rvfact anim" style="animation-delay:'+(off+60)+'ms;">You all got a story about</div>';
  html += '<div class="rvfactsubject anim" style="animation-delay:'+(off+60)+'ms;">'+(claim.topic || claim.subject)+'</div>';
  html += '<div class="rvrule anim" style="animation-delay:'+(off+120)+'ms;"></div>';

  html += '<div class="rvrows">';
  var delay = off + 260;
  rows.forEach(function(row){
    var split = revealSplit(row);
    html += '<div class="rvrow'+(split?' nb':'')+' anim" style="animation-delay:'+delay+'ms;">';
    html += '<div class="rvfaces"><div class="rvfacescol"><div class="rvfacesrow">';
    row.who.forEach(function(w){
      html += '<div class="rvavatar '+(FLAG_CLASS[w.flag]||"none")+'">'+(w.p.isYou?"Y":w.p.name.charAt(0))+'</div>';
    });
    html += '</div>';
    if(row.who.length === 1) html += '<div class="rvname">'+(row.who[0].p.isYou?"You":row.who[0].p.name)+'</div>';
    html += '</div></div>';
    html += '<div class="rvhead">'+row.headline+'</div>';
    html += '</div>';
    if(split){
      html += '<div class="rvsame anim" style="animation-delay:'+(delay+120)+'ms;">';
      html += '<span class="rvsamebolt">⚡</span><span>'+split[0]+' and '+split[1]+' saw the exact same post.</span></div>';
    }
    delay += 150;
  });
  html += '</div>';

  // "All of them held up" only when nobody flagged anything as spun or worse — on a
  // true/false axis the honest story was a dead card; on a spin axis it still says something.
  var anySpin = rows.some(function(r){ return r.who.some(function(w){ return w.flag && w.flag !== "true"; }); });
  var summary = rows.length + (rows.length===1 ? " version." : " versions.");
  summary = anySpin ? ("Same story. " + summary) : (summary + " All of them held up.");
  var tail = off + 260 + rows.length*150;
  html += '<div class="rvsummary anim" style="animation-delay:'+(tail+120)+'ms;">'+summary+'</div>';
  // The question that runs through the rest of the game: asked here, answered by the
  // note in Round 3.
  // Hands off to triage, where the same question gets asked of the whole feed.
  html += '<button class="rvbtn anim" style="animation-delay:'+(tail+240)+'ms;" onclick="revealNext()">So what actually happened? →</button>';

  // The discovery, first story only. It waits for a tap — it does NOT time out. Nothing
  // should let a table get scrolled past the one moment the game is built on, and
  // everything behind it is staged but frozen until the tap lands.
  if(held){
    html += '<button class="rvdiscover" id="rvdiscover" onclick="dismissDiscovery()">';
    html += '<div class="rvdisckicker">⚡ Hold on</div>';
    html += '<div class="rvdiscbig">You didn\'t all see the same post.</div>';
    html += '<div class="rvdisctap">Tap to see what everyone got</div>';
    html += '</button>';
  }
  html += '</div>';
  document.getElementById("screenArea").innerHTML = html;
}
function dismissDiscovery(){
  var card = document.getElementById("rvdiscover");
  if(card) card.className = "rvdiscover out";
  var reveal = document.querySelector(".reveal");
  if(reveal) reveal.className = "reveal";     // unfreezes the staged rows behind it
  revealState.discovered = true;
}

// One screen, fired off the first filed story's summary: here's what's still loose,
// and here's how many more you can take. Deliberately shows every remaining story —
// including the ones nobody flagged — because the choice is the lesson, and a table
// that only ever chases what it already doubted isn't triaging, it's confirming.
function renderTriage(){
  var left = CLAIMS.filter(function(c){ return !getBoard(c.id).filed; });
  var quota = triageQuota();
  var chosen = triageChosen();
  var stays = left.length - quota;
  var html = '<div class="triage"><div class="triagescroll">';
  html += '<div class="rvprogress">What\'s still out there</div>';
  html += '<div class="triagetitle">'+left.length+' stories left. You can chase '+quota+'.</div>';
  html += '<div class="triagesub">That one took your whole table. You\'ve got time for '+
          (quota===1 ? 'one more' : quota+' more')+' — the other '+stays+
          (stays===1 ? ' stays in the feed, and keeps' : ' stay in the feed, and keep')+' spreading.</div>';
  left.forEach(function(claim){
    var picked = triagePicked(claim.id);
    var open = !!triageState.open[claim.id];
    var rows = revealRows(claim);
    var flags = [];
    rows.forEach(function(r){ r.who.forEach(function(w){ flags.push(w.flag); }); });
    var spun = flags.filter(function(f){ return f && f !== "true"; }).length;
    var split = rows.map(revealSplit).filter(Boolean)[0];
    html += '<div class="triagecard'+(picked?' picked':'')+'">';
    html += '<div class="triagerow" onclick="toggleTriage('+claim.id+')">';
    html += '<div class="triagetick">'+(picked?'✓':'')+'</div>';
    html += '<div class="triagebody"><div class="triagetopic">'+(claim.topic||claim.subject)+'</div>';
    html += '<div class="triagehead">'+variantForPlayer(claim, "you").headline+'</div>';
    html += '<div class="triageflags">'+PLAYERS.map(function(pl){
      var f = claimVotesFor(claim)[pl.id];
      return '<span class="triagedot '+(FLAG_CLASS[f]||"none")+'"></span>';
    }).join("")+'<span class="triagemeta">'+(spun ? spun+" of "+flags.length+" called it spun or worse" : "nobody flagged this one")+'</span></div>';
    // The ⚡ split is the strongest single reason to chase a story, so it shows without
    // having to open anything: same post, two different reads.
    if(split) html += '<div class="triagesplit">⚡ '+split[0]+' and '+split[1]+' saw the exact same post.</div>';
    html += '</div></div>';
    // The versions live here — one tap, for a table that wants to argue before choosing.
    html += '<div class="triageopen" onclick="toggleTriageOpen('+claim.id+')">'+(open?'▾ hide the versions':'▸ what everyone else got')+'</div>';
    if(open){
      html += '<div class="triageversions">';
      rows.forEach(function(row){
        html += '<div class="tvrow"><div class="tvfaces">'+row.who.map(function(w){
          return '<span class="tvavatar '+(FLAG_CLASS[w.flag]||"none")+'">'+(w.p.isYou?"Y":w.p.name.charAt(0))+'</span>';
        }).join("")+'</div><div class="tvhead">'+row.headline+'</div></div>';
      });
      html += '</div>';
    }
    html += '</div>';
  });
  html += '</div><div class="triagefoot">';
  html += '<div class="triagecount">'+chosen+' of '+quota+' picked</div>';
  html += '<div class="triagebtn'+(chosen<quota?' off':'')+'" onclick="finishTriage()">'+
          (quota===1 ? 'Go after it →' : 'Take them on →')+'</div>';
  html += '</div></div>';
  document.getElementById("screenArea").innerHTML = html;
}

function renderRound1(){
  if(!roundState.started){ renderRound1Start(); return; }
  if(roundState.showingTimesUp){ renderRound1TimesUp(); return; }
  if(revealState.active){ renderRoundReveal(); return; }
  if(triageState.active){ renderTriage(); return; }
  var justSorted = roundState.justEnded;
  roundState.justEnded = false;

  // Sorted by what the table committed to, not by whether they disagreed (8/31/2026).
  var chasing = CLAIMS.filter(function(c){ return triagePicked(c.id); });
  var loose = CLAIMS.filter(function(c){ return !triagePicked(c.id); });
  var voting = CLAIMS.filter(function(c){ return claimStatus(c)==="voting"; });
  var order = roundState.ended ? chasing.concat(loose) : voting;

  // Preserve scroll position across re-renders (timer ticks, vote taps) so scrolling
  // through the feed isn't reset every 250ms. The one exception is right after the
  // round sorts — that's the intentional "pull contested claims to the front" moment.
  var prevEl = document.getElementById("feedscroll");
  var prevScroll = prevEl ? prevEl.scrollTop : 0;
  // Same idea for any flipped card's own inline scroll region (evidence marking, mode
  // switches, and the AI typing reveal all trigger a full re-render too) — otherwise
  // reading through Search results would keep getting yanked back to the top.
  var prevCardScrolls = {};
  Object.keys(claimFlipped).forEach(function(id){
    if(!claimFlipped[id]) return;
    var el = document.getElementById("cardback-scroll-"+id);
    if(el) prevCardScrolls[id] = el.scrollTop;
  });

  // Round/timer/spread info now lives once in a persistent top bar instead of being
  // repeated on every card — keeps each card focused on just its own story.
  var s = spreadStats();
  var pr = s.total>0 ? Math.round(100*s.redHeat/s.total) : 0;
  var html = '<div class="r1topbar"><div><div class="r1toptitle">For You</div>';
  var topsub = roundState.ended
    ? (sessionState.ended ? 'Session complete · '+CLAIMS.filter(function(c){ return getBoard(c.id).filed; }).length+' cases filed'
                          : chasing.length+' on your table · '+loose.length+' still out there')
    : 'Round 1 · Gut check';
  html += '<div class="r1topsub">'+topsub+'</div></div>';
  html += '<div class="r1toptools">';
  // Once the session's over the report is reachable again from here — dismissing it
  // shouldn't mean losing it.
  if(sessionState.ended) html += '<div class="sessionbadge" onclick="openEndReport()">📋 Report</div>';
  html += '<div class="spreadbadge" onclick="openApp(\'spread\')">🔥 '+pr+'%</div>';
  // Pro Tips lives here now instead of on every card's rail — it's not tied to any
  // one story, so it belongs in the persistent header, not repeated per-card.
  html += '<div class="tipsbadge" onclick="openApp(\'tells\')">🧠</div>';
  if(!roundState.ended) html += '<div class="roundbadge'+(roundState.secondsLeft<=10?' urgent':'')+'" id="roundbadge" onclick="forceTimesUp()">⏱ '+roundState.secondsLeft+'s</div>';
  html += '</div></div>';

  html += '<div class="feedscroll" id="feedscroll">';
  order.forEach(function(c, idx){ html += renderFeedCard(c, justSorted, idx); });
  html += '</div>';
  document.getElementById("screenArea").innerHTML = html;

  var newEl = document.getElementById("feedscroll");
  if(newEl && !justSorted) newEl.scrollTop = prevScroll;
  Object.keys(prevCardScrolls).forEach(function(id){
    var el = document.getElementById("cardback-scroll-"+id);
    if(el) el.scrollTop = prevCardScrolls[id];
  });
}
function renderFeedCard(claim, justSorted, idx){
  var status = claimStatus(claim);
  var variant = variantForPlayer(claim, "you");
  var myVote = claimVotes[claim.id] || null;
  var bg = 'linear-gradient(200deg, hsl('+claim.hue+',55%,22%), #05060a 70%)';
  var eng = BASE_ENGAGEMENT[claim.id] || 10;
  var likes = formatCount(Math.round(eng*1000 + claim.id*173));
  var comments = formatCount(Math.round(eng*180 + claim.id*37));
  var board = getBoard(claim.id);
  var flipped = !!claimFlipped[claim.id];

  // Right after the round ends, cards visibly shuffle into their new order —
  // staggered by position so contested claims appear to settle into the front
  // of the deck one after another, not just pop in all at once.
  var justSorting = justSorted && roundState.ended;
  var cardCls = "feedcard" + (justSorting ? " justsorted" : "");
  var styleAttr = justSorting ? ('animation-delay:'+(Math.min(idx,8)*70)+'ms;') : '';
  var html = '<div class="'+cardCls+'" style="'+styleAttr+'" id="slide-'+claim.id+'">';
  html += '<div class="cardflip-inner'+(flipped?' flipped':'')+'">';

  // ---- FRONT FACE: the feed card itself, unchanged from before ----
  html += '<div class="cardface cardface-front" style="background:'+bg+';">';
  html += '<div class="feedtopscrim"></div><div class="feedbottomscrim"></div>';

  // Rail is decorative/ambient furniture now (poster avatar + the spinning disc) —
  // everything actionable and story-specific (investigate, case board, agreed/filed
  // status) moved down into the corner cluster and the vote area below, and Pro Tips
  // moved up into the persistent header since it isn't tied to any one story.
  html += '<div class="feedrail">';
  html += '<div class="railavatar">'+posterInitial(variant)+'</div>';
  if(roundState.ended && status==="skipped"){
    html += '<div class="railitem"><span class="railicon">⏭️</span><span class="raillabel skipped">skipped</span></div>';
  }
  if(roundState.ended && status==="agreed"){
    html += '<div class="railitem"><span class="railicon">✅</span><span class="raillabel agreed">same call</span></div>';
  }
  html += '<div class="raildisc">🎵</div>';
  html += '</div>';

  // Corner action cluster — the story's two spokes, always visible together once
  // it's contested (per Tara: investigate + case board should both be clearly present
  // on the card, not hidden behind one generic flip icon). Still deliberately quiet —
  // small glassy circles with a soft pulse, not a loud full-width red CTA — modeled on
  // flashcard-app / card-game corners, just now two of them side by side.
  if(roundState.ended && !board.filed){
    var invLocked = !seenOnboard.investigate;
    html += '<div class="flipcluster'+(invLocked?' locked':'')+'">';
    html += '<div class="flipnub-wrap" onclick="openSpoke('+claim.id+')"><div class="flipnub">'+(invLocked?'🔒':'🔍')+'</div><div class="flipnub-label">'+(invLocked?'wait':'dig in')+'</div></div>';
    html += '<div class="flipnub-wrap" onclick="openSpoke('+claim.id+',\'board\')"><div class="flipnub">'+(invLocked?'🔒':('🗂️'+(board.board.length>0?('<span class="flipnub-badge">'+board.board.length+'</span>'):'')))+'</div><div class="flipnub-label">'+(invLocked?'wait':'case')+'</div></div>';
    html += '</div>';
  }

  // Everything about the STORY — source, subject, headline, vote — lives in this one
  // block on the card. Source is tappable: expands to show which platform it's from.
  html += '<div class="feedbottom">';
  var srcExpanded = !!sourceExpanded[claim.id];
  html += '<div class="cardsource" onclick="handleSourceTap('+claim.id+')">🔗 '+variant.source+' <span class="chev">'+(srcExpanded?'▲':'▼')+'</span></div>';
  if(srcExpanded) html += '<div class="cardsourceextra">via '+domainFor(claim.sourceUrl)+'</div>';
  html += '<div class="subjecttag">'+claim.subject+'</div>';
  // Once a case is filed, the verdict is the single most important thing about this
  // card — promoted above the headline, not buried after the vote reveal, so it's the
  // first real information you hit. The gut-check votes still render below (readonly
  // stoplight + "see who voted"), so seeing both together on the same card IS the
  // then/now comparison — no separate delta table needed elsewhere.
  if(roundState.ended && board.filed){
    // 8/31/2026: the strip used to read FILED ✓ + the table's determination. There is no
    // determination any more, and the note is the better thing to put here anyway — a
    // real Community Note rides on the post, so the correction travels with the story.
    // The manipulated headline still renders underneath: the post isn't corrected out of
    // existence, it's corrected in place.
    var noteLine = r3NoteText(board);
    var srcLetters = (board.r3 && board.r3.sources || []).map(function(cid){ return "Exh "+letterFor(board.board.indexOf(cid)); }).join(", ");
    html += '<div class="hubnote" onclick="openSpoke('+claim.id+',\'board\')">';
    html += '<div class="hubnotehead">📝 READERS ADDED CONTEXT<span class="hubnotechk">FILED ✓</span></div>';
    html += '<div class="hubnotebody">'+(noteLine || "Context added by your table.")+'</div>';
    html += '<div class="hubnotefoot"><span>'+(srcLetters||"filed")+'</span><span class="hubnotego">See the case →</span></div>';
    html += '</div>';
  }
  html += '<div class="headline">'+variant.headline+'</div>';
  html += '<div class="cardstats"><span>❤️ '+likes+'</span><span>💬 '+comments+'</span></div>';

  if(!roundState.ended){
    html += '<div class="stoplight">';
    [["misinfo","red"],["biased","yellow"],["true","green"]].forEach(function(pair){
      var k = pair[0], colorCls = pair[1];
      html += '<span class="stoplightopt '+colorCls+(myVote===k?' selected':'')+'" onclick="castVote('+claim.id+',\''+k+'\')">'+CALL_META[k].emoji+'</span>';
    });
    html += '</div>';
  } else {
    // Round's over — votes reveal, grouped by who called what (Jared's idea:
    // expand under the buttons rather than a row of avatars). This stays on the
    // FRONT face — Tara: you don't need to know how others voted while investigating.
    var v = claimVotesFor(claim);
    var groups = {misinfo:[], biased:[], "true":[]};
    PLAYERS.forEach(function(p){
      var vote = v[p.id];
      if(vote && groups[vote]) groups[vote].push(p.isYou ? "You" : p.name);
    });
    html += '<div class="stoplight readonly">';
    [["misinfo","red"],["biased","yellow"],["true","green"]].forEach(function(pair){
      var k = pair[0], colorCls = pair[1];
      html += '<span class="stoplightopt '+colorCls+(myVote===k?' selected':'')+'"><span class="stoplightcount">'+groups[k].length+'</span></span>';
    });
    html += '</div>';
    var expanded = !!voteExpanded[claim.id];
    html += '<div class="voteexpand" onclick="toggleVoteExpand('+claim.id+')">'+(expanded?'▴ Hide who voted':'▾ See who voted')+'</div>';
    if(expanded){
      html += '<div class="votegroups">';
      [["misinfo","🚩 Misinfo"],["biased","🤔 Biased"],["true","✅ True"]].forEach(function(pair){
        var k = pair[0], label = pair[1];
        html += '<div class="votegrouprow"><span class="vglabel">'+label+'</span><span class="vgnames">'+(groups[k].length ? groups[k].join(", ") : "—")+'</span></div>';
      });
      html += '</div>';
    }
    // Was contested/agreed. Triage replaced that split (8/31/2026): a story is either
    // one the table committed to chase or one still loose in the feed — and "loose"
    // is an invitation, not a closed door.
    if(triagePicked(claim.id)){
      // Filed note shows up top (see hubnote, above the headline); a picked, unfiled
      // story shows nothing extra here — the corner cluster is its trigger.
    } else {
      html += '<div class="agreedcta">Still out there — dig in anyway</div>';
    }
  }
  html += '</div>'; // end feedbottom
  html += '</div>'; // end cardface-front

  // ---- BACK FACE: inline investigation, open on every story once the round ends ----
  html += '<div class="cardface cardface-back">';
  if(roundState.ended) html += renderCardBack(claim, variant);
  html += '</div>';

  html += '</div>'; // end cardflip-inner
  html += '</div>'; // end feedcard
  return html;
}
function renderCardBack(claim, variant){
  // Left unset the first time (no default) so the move-menu shows before any mode
  // is chosen — see renderMoveMenu below.
  var mode = cardMode[claim.id];
  var board = getBoard(claim.id);
  var html = '<div class="cardback-head">';
  html += '<span class="cardback-flipclose" onclick="flipCard('+claim.id+')">↩</span>';
  html += '<div class="cardback-titlewrap"><div class="cardback-subject">'+claim.subject+' · '+(board.filed ? 'case filed' : (r3Writing(claim.id) ? 'writing the note' : 'investigating'))+'</div><div class="cardback-headline">'+variant.headline+'</div></div>';
  html += '</div>';
  html += '<div class="cardback-scroll" id="cardback-scroll-'+claim.id+'">';
  if(board.filed){
    // Case closed — always land straight on the (read-only) board/receipt, no menu
    // or tabs to get lost in. Search/Ask AI aren't reachable post-filing.
    html += renderClaimBoard(claim);
  } else if(!mode){
    // First entry into this story's workspace: an explicit choice of how to dig in,
    // rather than silently defaulting into Search — this is the "more agency" moment.
    html += renderMoveMenu(claim);
  } else if(r3Writing(claim.id)){
    // Tara, 8/31/2026: "the UX for the whole community note section is weird because you
    // don't need the other tabs anymore, you really just need that evidence board."
    // She's right — Round 3 can only cite what's already in the case file, so Search,
    // Ask AI and Background check have no job left. Deciding you're done looking is
    // exactly what the evidence gate asks, so once that's answered the tools go away
    // and the card is the note plus the evidence it's built from.
    html += renderClaimBoard(claim);
  } else {
    html += '<div class="cardmodetabs">';
    [["background","🕵️"],["search","🔍"],["ai","✨"],["board","🗂️"]].forEach(function(pair){
      var badge = (pair[0]==="board" && board.board.length>0) ? ' ('+board.board.length+')' : '';
      html += '<div class="cardmodetab'+(mode===pair[0]?' active':'')+'" onclick="setCardMode('+claim.id+',\''+pair[0]+'\')">'+pair[1]+badge+'</div>';
    });
    html += '</div>';
    if(mode==="search") html += renderClaimSearch(claim);
    else if(mode==="ai") html += renderClaimAI(claim);
    else if(mode==="background") html += renderClaimBackground(claim);
    else html += renderClaimBoard(claim);
  }
  html += '</div>';
  return html;
}
// The "how do you wanna dig in" move picker — shown once per story, the first time
// its card is opened. After a move is picked, cardMode is sticky and the small tab
// bar (above) takes over for switching between Search / Ask AI / Board without
// having to flip back out and back in — this is what makes one flip cover every
// spoke, instead of the flip itself trying to double as the mode switcher.
function renderMoveMenu(claim){
  // No generic "worth a closer look" kicker — it's a static label that doesn't always
  // match the actual hook (not every claim's hook is about a number/stat worth
  // scrutinizing), so it's just the hook text itself now.
  var html = '<div class="cardhook">'+(claim.hook||"")+'</div>';
  html += '<div class="moveintro">How do you wanna dig in?</div>';
  html += '<div class="movegrid">';
  [
    ["background","move-bg","🕵️","Background check","Who's really behind this post?"],
    ["search","move-search","🔍","Search the web","Pull up what's out there."],
    ["ai","move-ai","✨","Ask AI","Get a take, then question it."],
    ["board","move-board","🤝","Compare notes","See what your table's found — and file when ready."]
  ].forEach(function(m){
    html += '<div class="movecard '+m[1]+'" onclick="setCardMode('+claim.id+',\''+m[0]+'\')">';
    html += '<div class="moveicon">'+m[2]+'</div>';
    html += '<div class="movetitlewrap"><div class="movetitle">'+m[3]+'</div><div class="movedesc">'+m[4]+'</div></div>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}
function navbarBack(title, backFn){

// How each source type presents itself in the results list. Derived from the clip's
// own `who` so no content had to be re-authored — the type is printed on the result
// where a real results page prints the site.
var SRC_LOOK = {
  "News / institution":     {fav:"\ud83d\udcf0", site:"published report",  cls:"inst"},
  "Influencer":             {fav:"\ud83d\udcf1", site:"social post",        cls:"inf"},
  "Can't tell — bot or AI?":{fav:"\u2753",        site:"unverified account", cls:"bot"},
  "Friend":                 {fav:"\ud83d\udc64", site:"shared with you",    cls:""}
};
function renderClaimSearch(claim){
  var html = "";
  if(!claim.wired){ return html + '<div class="emptystate">No results yet for this claim.</div>'; }
  var clips = CLIPS[claim.id].filter(function(c){ return c.source!=="ai" && c.source!=="background"; });
  var addedCount = clips.filter(function(c){ return clipState[c.id].shared; }).length;
  // Search-page chrome. Most of the "this is a search page" work is done here, before
  // a single result renders.
  html += '<div class="srchbar"><span class="mag">\ud83d\udd0d</span><span class="q">'+searchQueryFor(claim)+'</span><span class="x">\u2715</span></div>';
  html += '<div class="srchtabs"><span class="srchtab on">All</span><span class="srchtab">Images</span><span class="srchtab">News</span><span class="srchtab">Videos</span></div>';
  html += '<div class="srchcount">About '+clips.length+' results \u00b7 '+addedCount+' added to your case</div>';
  clips.forEach(function(c){
    var s = clipState[c.id];
    var look = SRC_LOOK[c.who] || SRC_LOOK["Friend"];
    html += '<div class="sresult">';
    html += '<div class="ssite"><div class="sfav">'+look.fav+'</div><div style="min-width:0"><div class="ssitename">'+look.site+'</div></div>'
         +  '<span class="stype '+look.cls+'">'+c.who+'</span></div>';
    html += '<div class="stitle">'+c.text+'</div>';
    if(c.detail) html += '<div class="ssnip">'+c.detail+'</div>';
    html += renderClipImage(c) + renderReverseBlock(c);
    // One tap per result, the same tap, in the same place. Repetition is the
    // instruction — nothing else on a result is tappable.
    if(!s.shared){
      html += '<div class="saddwrap"><button class="btnfilled evidence" onclick="addToBoard('+claim.id+',\''+c.id+'\')">+ Add to case</button></div>';
    } else {
      html += '<div class="sadded">\u2713 Added to case</div>';
    }
    html += '</div>';
  });
  return html;
}
// The query a player would plausibly have typed, from the headline they were served.
function searchQueryFor(claim){
  var h = variantForPlayer(claim, "you").headline.toLowerCase();
  return h.replace(/[".,!?]/g,"").split(/\s+/).slice(0,9).join(" ");
}
var caseToastShown = false, caseToastTimer = null;
// Taught once, at the moment it makes sense, then never again — see .casetoast.
function showCaseToast(){

  caseToastShown = true;

function addToBoard(claimId, clipId){

  var b = getBoard(claimId);

  // A new exhibit is the table saying "we weren't done" — so the note gate gets to ask

  if(onboardDeferred.note){ onboardDeferred.note = false; render(); maybeShowOnboard(); return; }

function renderClaimAI(claim){

           + '<div class="aisub">answers can be wrong \u2014 check them</div></div></div>';

// "Who's really behind this post" — a short account snapshot per claim (flags +
// a one-line note), injected into CLIPS as a source:"background" item so it can be
// marked as evidence and shows up on the shared board exactly like any other exhibit.
// The money panel under a profile. Answers "who pays for this, and what do they get
// out of it" using only what a platform would actually publish about an account —
// ownership, revenue, and whether paid posts are disclosed. No verdict: an account
// funded by the company it's posting about isn't lying, it just isn't neutral, and
// that's the reader's call to make. Renders nothing when a profile has no funding
// data rather than printing an empty shell.
function renderFundingPanel(b){
  if(!b || !b.funding || !b.funding.length) return "";

function renderClaimBackground(claim){

function renderClaimBoard(claim){

  var justFiled = b.filed && justFiledClaimId===claim.id;
  if(justFiled) justFiledClaimId = null;
  var html = "";
  if(b.filed) html += '<div class="stamp'+(justFiled?' justfiled':'')+'">FILED ✓</div>';
  // While the note is being written the evidence is context, not the work — it folds
  // away so the note gets the screen (Tara, 8/31). Open by default before Round 3
  // opens, closed once it does, and always one tap either way.
  var writing = !b.filed && r3Open(claim.id);
  var evOpen = writing ? !!getR3(claim.id).evOpen : true;
  html += '<div class="sectionhead' + (writing ? ' clickable" onclick="r3ToggleEvidence('+claim.id+')' : '') + '">' +
          (writing ? '<span class="evchev">'+(evOpen?"▾":"▸")+'</span> ' : '') +
          'Evidence ('+b.board.length+')</div>';
  html += '<div class="groupcard"'+(evOpen?'':' style="display:none"')+'>';
  // The post itself is always the first exhibit — everything else in this list is
  // context gathered about it. This also retires the separate "compare everyone's
  // version" section further down: the post is already right here, no need to repeat
  // it in a second grid.
  var postVariant = variantForPlayer(claim, "you");
  var postEng = BASE_ENGAGEMENT[claim.id] || 10;
  var postLikes = formatCount(Math.round(postEng*1000 + claim.id*173));
  var postComments = formatCount(Math.round(postEng*180 + claim.id*37));
  html += '<div class="resultrow"><span class="exhibitlabel">THE POST</span>';
  html += '<div class="resulttext" style="margin-top:4px;">'+postVariant.headline+'</div>';
  html += '<div style="font-size:11.5px; color:var(--ios-label2);">'+postVariant.source+' · ❤️ '+postLikes+' · 💬 '+postComments+'</div></div>';
  if(b.board.length===0){
    html += '<div class="resultrow"><span style="color:var(--ios-label2); font-size:13px;">Nothing else pooled yet — go find something in Search or Ask AI and file it here.</span></div>';
  } else {
    var allClips = CLIPS[claim.id];
    b.board.forEach(function(clipId, idx){
      var clip = allClips.find(function(x){ return x.id===clipId; });
      var kind = clip.tell ? tellKind(clip.tell) : "none";
      var origin = clip.source==="ai" ? "🤖 " : "";
      // Tactic-name labels ("· Misleading chart") pulled off exhibit rows on 2026-08-12 —
      // Tara wants Pro Tips content out of the game loop until its best use is figured
      // out, but kept the top-bar nav link to the standalone library itself.
      html += '<div class="resultrow"><span class="exhibitlabel">EXHIBIT '+letterFor(idx)+'</span><div class="resulttext" style="margin-top:4px;">'+origin+clip.text+'</div></div>';
    });
  }
  html += '</div>';

  // ---------------- ROUND 3 LIVES HERE ----------------
  // Was: Table determination radios + a free-text community note + a confirm checkbox.
  // All three are gone (8/31/2026). What replaces them is the role chain that actually
  // writes the note. See getR3/r3* above.
  html += b.filed ? renderFiledNote(claim, b) : renderRound3(claim);
  // "Compare everyone's version" is back (8/24/2026) — but only after filing, which
  // is the whole point of the reveal rule. Before the case is filed this board stays
  // focused on evidence + the team's single determination; the then/now vote
  // comparison still lives on the hub card once you flip back.
  // renderTellReveal is NOT drawn here any more — it is the story summary screen that
  // fires after filing (Tara, 8/30: "on the filed card we don't need the tells").
  return html;
}

// ---------------- ROUND 3: THE SCREENS ----------------
function renderRound3(claim){
  // Deferred: the table said "still investigating", so the board keeps a door open
  // instead of making them add an exhibit they don't need just to get the gate back.
  if(r3Open(claim.id) && !seenOnboard.note && onboardDeferred.note){
    return '<div class="sectionhead">The note</div><div class="groupcard" style="padding:13px;">' +
      '<div class="r3hint" style="margin-bottom:9px;">' + getBoard(claim.id).board.length +
      ' exhibits on the board. Whenever your table\'s ready to say what happened.</div>' +
      '<button class="filebtn" onclick="undeferNote()">We know what happened</button></div>';
  }
  if(!r3Open(claim.id)){
    var need = BOARD_TOUR_EVIDENCE_THRESHOLD - getBoard(claim.id).board.length;
    return '<div class="sectionhead">The note</div><div class="groupcard"><div class="resultrow">' +
      '<span style="color:var(--ios-label2); font-size:13px;">' + need + ' more exhibit' + (need===1?'':'s') +
      ' and your table can write the note.</span></div></div>';
  }
  var r = getR3(claim.id), role = r3RoleNow(r);
  var html = '<div class="sectionhead">Round 3 · the community note</div>';

  if(r.phase === "draft"){
    // The trigger. Four people typing at the same moment doesn't happen because a
    // screen invites it — it happens because a clock started and everyone can see
    // who hasn't finished. So: a hard prompt, a shared countdown, and a row of pips
    // that fill as each person's line lands. Same rule as Round 1's clock — the 60s
    // is a ceiling, not a duration (see r3DraftTick).
    r3StartDraftClock(claim.id);
    var inCount = Object.keys(r.drafts).length, mine = !!r.drafts.you;
    html += '<div class="r3drafthead">';
    html += '<div class="r3draftkicker">Everyone, right now</div>';
    html += '<div class="r3clock'+(r.secondsLeft<=10?' urgent':'')+'" id="r3clock-'+claim.id+'">'+r3Clock(r.secondsLeft)+'</div>';
    html += '</div>';
    html += '<div class="groupcard" style="padding:14px;">';
    html += '<div class="r3ask">What actually happened?</div>';
    html += '<div class="r3hint" style="margin-top:4px">One sentence, in your own words. Nobody sees the others until they\'re all in.</div>';
    if(!mine){
      html += '<textarea class="communitynote" id="r3draft-'+claim.id+'" placeholder="what actually happened…" oninput="r3Typing('+claim.id+', this.value)">'+(r.typing||"")+'</textarea>';
      html += '<button class="filebtn" onclick="r3SubmitDraft('+claim.id+')">That\'s mine</button>';
    } else {
      html += '<div class="r3mine">'+r.drafts.you+'</div>';
      html += '<div class="r3hint">In. Waiting on the rest of the table.</div>';
    }
    html += '</div>';
    html += '<div class="r3whosin">'+PLAYERS.map(function(pl){
      return '<span class="r3inpip'+(r.drafts[pl.id]?' in':'')+'">'+(pl.isYou?"You":pl.name)+'</span>';
    }).join("")+'<span class="r3incount">'+inCount+' of '+PLAYERS.length+' in</span></div>';
    return html;
  }

  // Not in the read phase: nobody has the note any more, it's the table's. Leaving the
  // last role's hand-off banner up there made the ship screen read like the Checker
  // still had a job to do.
  if(r.phase !== "read")
    html += '<div class="r3handoff">'+R3_JOBLINE[role][0]+' Passed to you — <b>'+role+'</b>, '+R3_JOBLINE[role][1]+'</div>';
  else
    html += '<div class="r3handoff">📢 It\'s the table\'s now — read it out loud</div>';

  if(r.phase === "pick"){
    html += '<div class="r3hint" style="margin-bottom:8px;">'+R3_JOB.editor+'</div>';
    r.order.forEach(function(who, i){
      html += '<div class="r3draft" onclick="r3PickDraft('+claim.id+',\''+who+'\')">'+
        '<span class="r3draftlabel">Draft '+String.fromCharCode(65+i)+'</span>'+r.drafts[who]+'</div>';
    });
    return html;
  }

  if(r.phase === "op"){
    var op = r3LiveOp(r), back = !!r.returnRole;
    if(back && r.notBy) html += '<div class="r3back">'+PLAYERS.filter(function(pp){return pp.id===r.notBy;})[0].name+' said not yet — it came back to the '+op+'.</div>';
    if(op !== "checker") html += r3MovesHTML(r, op);
    // "but with no note ... the other roles are still working on the community note"
    // (Tara, 8/31/2026). The Spotter's screen must not show the table's sentence at
    // all — seeing it is what would tempt a player to edit it, and it isn't theirs.
    if(op !== "spotter") html += r3NoteHTML(claim, r, op!=="checker");
    if(op === "spotter"){
      html += r3SpotterHTML(claim, r);
      var spotted = Object.keys(r.spots).length;
      html += '<button class="filebtn ghost" onclick="r3Pass('+claim.id+')">'+
        (back ? "Send it back out" : (spotted < 3 ? "Pass it on early" : "Pass it on"))+'</button>';
      return html;
    }
    if(op === "translator"){
      if(r.editIdx !== null) html += r3WordMenu(claim, r, op);
      else if(r.moves[op] > 0) html += '<div class="r3hint">Tap a word in the note — '+(op==="skeptic"?"cut it, or swap it for something that isn\'t doing the persuading.":"swap it for a plainer one, or cut it.")+'</div>';
      if(back) html += '<div class="groupcard" style="padding:12px;"><div class="r3hint">Or rewrite the whole line — words you leave alone keep whose they were.</div>'+
        '<textarea class="communitynote" id="r3rewrite-'+claim.id+'">'+r3NoteText(getBoard(claim.id))+'</textarea>'+
        '<button class="filebtn" onclick="r3Rewrite('+claim.id+')">Use this line</button></div>';
      html += '<button class="filebtn ghost" onclick="r3Pass('+claim.id+')">'+(back?"Send it back out":(r.moves[op]>0?"Pass it on early":"Pass it on"))+'</button>';
    }
    if(op === "checker"){
      html += '<div class="r3hint">'+R3_JOB.checker+' Once you take one, that person\'s other exhibits close.</div>';
      var b = getBoard(claim.id), clips = CLIPS[claim.id]||[];
      b.board.forEach(function(clipId, idx){
        var clip = clips.filter(function(c){ return c.id===clipId; })[0];
        if(!clip) return;
        var who = r3AddedBy(claim.id, clipId);
        var taken = r.sources.indexOf(clipId) >= 0;
        var blocked = r.sources.length===1 && r3AddedBy(claim.id, r.sources[0])===who && !taken;
        // What a reader needs to judge a citation is WHERE it came from, not which
        // teammate happened to clip it (Tara, 8/31). The two-different-people rule
        // still governs what you can take — it just isn't the label any more; a
        // blocked exhibit says why in its own line.
        html += '<div class="r3exhibit'+(taken?' sel':'')+(blocked?' dead':'')+'" onclick="r3Source('+claim.id+',\''+clipId+'\')">'+
          '<span class="exhibitlabel">EXHIBIT '+letterFor(idx)+' · '+(clip.who||"source")+'</span>'+
          '<div class="resulttext" style="margin-top:3px; font-size:13px;">'+clip.text+'</div>'+
          (blocked ? '<div class="r3blocked">Same person found your first source — cite someone else\'s</div>' : '')+
          '</div>';
      });
      html += '<button class="filebtn" onclick="r3Pass('+claim.id+')" '+(r.sources.length===2?'':'disabled')+'>Cite these two</button>';
    }
    return html;
  }

  // read it out, then ship it
  html += r3NoteHTML(claim, r, false);
  if(!r.readOut){
    html += '<div class="r3hint">Read it out loud, exactly as it stands.</div>';
    html += '<button class="filebtn" onclick="r3ReadOut('+claim.id+')">I read it out</button>';
  } else {
    html += '<div class="r3votes">'+["maya","diego","priya"].map(function(q){
      var v = r.votes[q];
      return '<span class="r3vote'+(v==="ship"?" ship":"")+(v==="not"?" not":"")+'">'+r3Name(q)+': '+(v?(v==="ship"?"ship it":"not yet"):"…")+'</span>';
    }).join("")+'</div>';
    // The note used to file itself the moment the third simulated vote landed, so the
    // last thing that happens to a note your table spent ten minutes on was something
    // you watched (Tara, 8/31/2026: "you should be able to click that's the one").
    // Shipping is a decision, and the tour promises it — "Read it out, then ship it."
    // The button only appears once the table has actually agreed; a pending "not yet"
    // can't be clicked past.
    var allShip = ["maya","diego","priya"].every(function(q){ return r.votes[q]==="ship"; });
    var anyNot  = ["maya","diego","priya"].some(function(q){ return r.votes[q]==="not"; });
    if(allShip) html += '<button class="filebtn" onclick="fileBoard('+claim.id+')">That\'s the one — file it</button>';
    else if(!anyNot) html += '<div class="r3hint">Waiting on the rest of your table…</div>';
  }
  return html;
}
function r3Name(id){
  var p = PLAYERS.filter(function(x){ return x.id===id; })[0];
  return p ? p.name : "You";
}
var R3_MOVE_TOTAL = {translator:2, spotter:3, checker:2};
function r3MovesHTML(r, role){
  var left = r.moves[role], total = R3_MOVE_TOTAL[role] || 2, pips = "";
  for(var i=0;i<total;i++) pips += '<span class="r3pip'+(i<left?' on':'')+'"></span>';
  return '<div class="r3moves">'+pips+'<span>'+(left===0?"no moves left":left+" move"+(left>1?"s":"")+" left")+'</span></div>';
}
function r3NoteHTML(claim, r, tappable){
  var html = '<div class="r3note"><div class="r3notelabel">The note, as it stands</div><div class="r3body">';
  html += r.toks.map(function(t, i){
    var cls = 'r3tok r3-'+t.by + (t.cut?' cut':'') + (tappable && !t.cut ? ' tapme':'') + (r.editIdx===i?' editing':'');
    var on = (tappable && !t.cut) ? ' onclick="r3Tap('+claim.id+','+i+')"' : '';
    return '<span class="'+cls+'"'+on+'>'+t.w+'</span> ';
  }).join("");
  html += '</div>';
  if(r.sources.length){
    html += '<div class="r3srcs"><div class="r3notelabel">Sources</div>';
    var b = getBoard(claim.id), clips = CLIPS[claim.id]||[];
    r.sources.forEach(function(cid){
      var clip = clips.filter(function(c){ return c.id===cid; })[0];
      html += '<div class="r3src"><span class="r3exh">EXH '+letterFor(b.board.indexOf(cid))+'</span>'+
              '<span>'+(clip?clip.text:"")+(clip&&clip.who?' <span class="r3srctype">'+clip.who+'</span>':'')+'</span></div>';
    });
    html += '</div>';
  }
  return html + '</div>';
}
function r3WordMenu(claim, r, role){
  var t = r.toks[r.editIdx], sug = r3Suggest(claim.id);
  var html = '<div class="groupcard" style="padding:12px;">';
  html += '<div class="r3ask">“'+r3Parts(t.w).core+'”</div>';
  if(sug.length){
    html += '<div class="r3hint" style="margin:6px 0 2px;">Plainer:</div>';
    html += sug.map(function(x){ return '<div class="r3draft" onclick="r3Apply('+claim.id+', this.dataset.v)" data-v="'+x+'">'+(x==="—"?"just cut it":x)+'</div>'; }).join("");
  }
  html += '<input class="r3word" id="r3word-'+claim.id+'" value="'+r3Parts(t.w).core+'">';
  html += '<div class="rowctrl" style="margin-top:8px;"><button class="btnfilled" onclick="r3ApplyInput('+claim.id+')">Use this</button>'+
          '<button class="btnfilled warn" onclick="r3Cut('+claim.id+')">Cut it</button>'+
          '<button class="btnfilled ghost" onclick="getR3('+claim.id+').editIdx=null;render()">Never mind</button></div>';
  return html + '</div>';
}
// A filed case board is exactly three things: the stamp (drawn above), the note, the receipt.
function renderFiledNote(claim, b){
  var r = b.r3 || {toks:[], sources:[]};
  var html = '<div class="sectionhead">The note</div>';
  html += '<div class="r3filed"><div class="r3rac">Readers added context</div><div class="r3racsub">Your table, on this story</div>';
  html += '<div class="r3body">'+r.toks.filter(function(t){return !t.cut && t.w;}).map(function(t){
    return '<span class="r3tok r3-'+t.by+'">'+t.w+'</span>'; }).join(" ")+'</div>';
  if(r.sources.length){
    html += '<div class="r3srcs"><div class="r3notelabel">Sources</div>';
    var clips = CLIPS[claim.id]||[];
    r.sources.forEach(function(cid){
      var clip = clips.filter(function(c){ return c.id===cid; })[0];
      html += '<div class="r3src"><span class="r3exh">EXH '+letterFor(b.board.indexOf(cid))+'</span>'+
              '<span>'+(clip?clip.text:"")+(clip&&clip.who?' <span class="r3srctype">'+clip.who+'</span>':'')+'</span></div>';
    });
    html += '</div>';
  }
  html += '</div>';
  var letters = r.sources.map(function(cid){ return "Exh "+letterFor(b.board.indexOf(cid)); }).join(", ");
  html += '<div class="receiptcard">';
  html += '<div class="receiptrow"><span>Case number</span><span>'+(b.caseNo||claimNumber(claim.id))+'</span></div>';
  html += '<div class="receiptrow"><span>Exhibits attached</span><span>'+b.board.length+'</span></div>';
  html += '<div class="receiptrow"><span>Sources cited</span><span>'+(letters||"—")+'</span></div>';
  html += '<div class="receiptrow"><span>Filed</span><span>'+b.filedAt+'</span></div>';
  html += '</div>';
  return html;
}
// Drawn only once a case is filed — see the reveal rules in tells-taxonomy.md.
// Every player saw this same story told a different way; this is the first and only
// place the game names the tell behind each version. Motive, not falsity: the copy
// says how the story reached you, never who was right.
// What the Spotter said about a given version, if the table named that one. This is
// the ONLY place the Spotter's work surfaces — by design it stays out of the note.
function r3CallFor(claim, headline){
  var b = getBoard(claim.id);
  if(!b.r3 || !b.r3.spots) return null;
  var rows = revealRows(claim), hit = null;
  rows.forEach(function(row, vi){ if(row.headline === headline && b.r3.spots[vi]) hit = b.r3.spots[vi].label; });
  return hit;
}
function renderTellReveal(claim){
  // In the multiplayer build PLAYERS is empty until a room is joined \u2014 an empty
  // reveal header with no rows under it is worse than no reveal at all.
  if(!PLAYERS.length) return "";
  // Group by variant, not by player. With 4 players and 3 variants somebody always
  // doubles up, and printing the same headline + same tell twice quietly undercuts
  // the whole point of the screen. One row per version actually in play, with the
  // players who got it listed on it.
  var groups = [];
  PLAYERS.forEach(function(p){
    var v = variantForPlayer(claim, p.id);
    var g = groups.find(function(x){ return x.v === v; });
    if(!g){ g = {v:v, players:[]}; groups.push(g); }
    g.players.push(p);
  });
  var allDistinct = groups.length === PLAYERS.length;
  var html = '<div class="tellreveal">';
  html += '<div class="trhead">\ud83d\udd13 What framed each version</div>';
  html += '<div class="trnote">Your table just filed on one story \u2014 but '+
          (allDistinct ? 'nobody read the same version of it'
                       : 'you weren\u2019t all reading the same version of it')+
          '. Here\u2019s the tell behind each one. A tell is about how a story reached you, not proof of what\u2019s true: your call still stands.</div>';
  groups.forEach(function(g){
    var t = g.v.tell ? TELL[g.v.tell] : null;
    html += '<div class="trrow '+(t ? t.kind : "none")+'">';
    html += '<div class="trwho">';
    g.players.forEach(function(p){
      html += '<span class="trdot" style="background:'+(p.color||"var(--ios-bg3)")+';">'+(p.initial||(p.name||"?").charAt(0))+'</span>';
    });
    html += '<span>'+g.players.map(function(p){ return p.isYou ? "You" : (p.name||"Player"); }).join(" \u00b7 ")+
            (g.players.length>1 ? " \u2014 same version" : "")+'</span>';
    html += '</div>';
    html += '<div class="trheadline">\u201c'+g.v.headline+'\u201d</div>';
    var myCall = r3CallFor(claim, g.v.headline);
    if(myCall) html += '<div class="trcalled"><span class="trcalledlbl">You called it</span>'+myCall+'</div>';
    if(t){
      html += '<span class="trchip '+t.kind+'">'+t.emoji+' '+t.name+'</span>';
      html += '<div class="trdesc">'+t.desc+'</div>';
    } else {
      html += '<span class="trchip none">No tell on this one \u2014 told straight</span>';
    }
    html += '</div>';
  });
  html += '</div>';
  return html;
}

// ---------------- ROUND 3 ACTIONS ----------------
// Direct DOM writes on keystroke (no render()) so the draft box never loses the cursor
// mid-sentence — the same pattern the old community-note textarea used, and for the
// same documented reason (full re-renders steal focus out from under a live input).
function r3ToggleEvidence(claimId){ var r = getR3(claimId); r.evOpen = !r.evOpen; render(); }
function r3Typing(claimId, value){ getR3(claimId).typing = value; }
function r3Clock(sec){ var m = Math.floor(sec/60), s2 = sec%60; return m+":"+(s2<10?"0":"")+s2; }
// One 60-second clock for the whole table's drafting beat. Started once, ticks the
// badge directly rather than re-rendering (a full render would eat the cursor out of
// the draft box mid-sentence — the same documented trap as Round 1's timer).
function r3StartDraftClock(claimId){
  var r = getR3(claimId);
  if(r.draftEndsAt) return;
  r.draftEndsAt = Date.now() + 60000;
  r.secondsLeft = 60;
  // The other three land theirs across the window, so "who's in" actually moves and
  // the last ten seconds feel like something.
  ["maya","diego","priya"].forEach(function(pid, i){
    setTimeout(function(){
      var rr = getR3(claimId);
      if(rr.phase !== "draft" || rr.drafts[pid]) return;
      rr.drafts[pid] = r3NpcDrafts(CLAIMS.filter(function(c){ return c.id===claimId; })[0])[pid];
      r3MaybeCloseDrafting(claimId);
      render();
    }, 9000 + i*11000 + Math.random()*5000);
  });
  r.draftTimer = setInterval(function(){ r3DraftTick(claimId); }, 250);
}
function r3DraftTick(claimId){
  var r = getR3(claimId);
  if(r.phase !== "draft"){ clearInterval(r.draftTimer); r.draftTimer = null; return; }
  r.secondsLeft = Math.max(0, Math.round((r.draftEndsAt - Date.now())/1000));
  var badge = document.getElementById("r3clock-"+claimId);
  if(badge){
    badge.textContent = r3Clock(r.secondsLeft);
    badge.className = "r3clock" + (r.secondsLeft<=10 ? " urgent" : "");
  }
  if(r.secondsLeft <= 0){
    clearInterval(r.draftTimer); r.draftTimer = null;
    // Time's up: whatever you typed goes in. An empty box means you sat this one out —
    // the table still has three lines to pick from, which is better than a stall.
    var el = document.getElementById("r3draft-"+claimId);
    var typed = (((el && el.value) ? el.value : r.typing) || "").trim();
    if(typed && !r.drafts.you) r.drafts.you = typed;
    var claim = CLAIMS.filter(function(c){ return c.id===claimId; })[0];
    var npc = r3NpcDrafts(claim);
    Object.keys(npc).forEach(function(k){ if(!r.drafts[k]) r.drafts[k] = npc[k]; });
    r3CloseDrafting(claimId);
    render();
  }
}
// Everyone answered — move on, don't sit and watch the clock run out.
function r3MaybeCloseDrafting(claimId){
  var r = getR3(claimId);
  if(PLAYERS.every(function(pl){ return r.drafts[pl.id]; })) setTimeout(function(){ r3CloseDrafting(claimId); render(); }, 600);
}
function r3CloseDrafting(claimId){
  var r = getR3(claimId);
  if(r.phase !== "draft") return;
  if(r.draftTimer){ clearInterval(r.draftTimer); r.draftTimer = null; }
  r.phase = "pick";
  r.order = PLAYERS.map(function(pl){ return pl.id; }).filter(function(id){ return r.drafts[id]; })
                   .sort(function(){ return Math.random()-0.5; });
  showRoleCard(claimId, "editor");
}
function r3SubmitDraft(claimId){
  var claim = CLAIMS.filter(function(c){ return c.id===claimId; })[0];
  var r = getR3(claimId);
  var el = document.getElementById("r3draft-"+claimId);
  // Prefer the live field, but fall back to the last keystroke we recorded — a
  // re-render between typing and tapping would otherwise silently eat the draft.
  var v = (((el && el.value) ? el.value : r.typing) || "").trim();
  if(!v) return;
  r.drafts.you = v; r.typing = "";

function r3Suggest(claimId){

function r3Source(claimId, clipId){
  var r = getR3(claimId), b = getBoard(claimId);

  if(!clip) return;

// ---------------- SPREAD ----------------
// Did anybody at the table read this one as spun or worse? This is the spin axis

    var b = getBoard(c.id);
    var h = heat[c.id] || 0;
    if(b.filed){ greenHeat += h; filedN++; }
    else if(tableFlagged(c)){ redHeat += h; playingN++; }
    else {
      // Nobody flagged it — low threat, so it burns quietly rather than not at all.
      greenHeat += h*0.3; straightN++;

    }
  });

    else if(tableFlagged(c)){ heat[c.id] = Math.min(HEAT_CAP, cur + Math.random()*1.6 + 0.4); }
    else { heat[c.id] = cur < 3 ? 3 : cur; }
    // Heat decays after filing, so the high-water mark has to be kept separately,
    // and shares keep totting up for as long as the claim is loose. Both feed the
    // end-of-session report; neither is shown during play.
    var reach = getReach(c.id);
    if(heat[c.id] > reach.peak) reach.peak = heat[c.id];
    if(status==="contested" && !b.filed) reach.shares += heat[c.id] * SHARE_RATE;
  });
  // Skip re-rendering while a full-screen sub-moment (Time's Up interstitial, the
  // per-story reveal) is up — heat isn't shown on either screen, and re-rendering
  // them just recreates the DOM nodes underneath, which replays their one-shot
  // entrance animations on a loop instead of letting them settle.
  // The role card and the story summary joined this list on 8/31/2026 (Tara: "the
  // animations for the role cards and the final report are bouncing"). Measured: three
  // renders in eight seconds, and the .rolecard node was replaced every time, so the
  // deal-in replayed on a 2.2-second loop. Same failure this guard was written for.
  var onSubScreen = roundState.showingTimesUp || revealState.active ||
                    triageState.active || pendingRole !== null || pendingStory !== null;
  // Mirrors the multiplayer file's fix (8/16/2026 playtest): the community note
  // textarea only took a couple characters before losing focus, and the gut-check's
  // card-to-card scroll got cut off mid-animation — both caused by this tick's full
  // render() rebuilding the DOM node underneath an in-progress interaction.
  var typingInNote = document.activeElement && document.activeElement.classList &&
    document.activeElement.classList.contains("communitynote");
  var scrollingCards = Date.now() < scrollAnimUntil;
  if((currentApp==="spread" || (currentApp==="round1" && !onSubScreen)) && !typingInNote && !scrollingCards) render();
}, 2200);

function tickClock(){
  var d = new Date();
  var h = d.getHours() % 12 || 12;
  var m = d.getMinutes();
  document.getElementById("clock").textContent = h + ":" + (m<10?"0":"") + m;
}
setInterval(tickClock, 15000);
tickClock();

initLobby();
render();
</script>
</body>
</html>
