// ---------------- ROUND 1 TIMER ----------------
// Timer no longer auto-starts on render — the table decides when it's ready
// (see renderRound1Start / beginRound1 below).
var roundTimerHandle = null;
function beginRound1(){
  if(roundState.started) return;
  roundState.started = true;
  roundState.startedAt = Date.now();
  roundTimerHandle = setInterval(function(){
    var elapsed = Math.floor((Date.now()-roundState.startedAt)/1000);
    roundState.secondsLeft = Math.max(0, 60-elapsed);
    if(roundState.secondsLeft<=0 && !roundState.ended && !roundState.showingTimesUp){
      // Time's up: hold on the interstitial until the table explicitly continues
      // (see dismissTimesUp) — it no longer auto-advances on its own.
      roundState.showingTimesUp = true;
      clearInterval(roundTimerHandle);
      if(currentApp==="round1") render();
    } else if(currentApp==="round1" && !roundState.showingTimesUp){
      // Only touch the countdown badge directly instead of calling the full render() —
      // rebuilding the whole feed's innerHTML every 250ms was destroying and recreating
      // the vote buttons out from under a tap in progress, which is why picking a color
      // sometimes took several clicks to register (and why auto-advance-to-next-card
      // sometimes looked broken — the smooth scroll got cut off mid-animation by the
      // next rebuild). The countdown is the only thing that actually changes each tick,
      // so that's the only thing that needs to update.
      var badge = document.getElementById("roundbadge");
      if(badge){
        badge.textContent = "⏱ " + roundState.secondsLeft + "s";
        badge.className = "roundbadge" + (roundState.secondsLeft<=10 ? " urgent" : "");
      } else {
        render();
      }
    }
  }, 250);
  render();
}
// Demo/testing shortcut — tap the countdown badge to skip straight to Time's Up,
// instead of waiting out the full 60s. Mirrors exactly what the interval above does
// when it naturally hits 0.
function forceTimesUp(){
  if(!roundState.started || roundState.ended || roundState.showingTimesUp) return;
  if(roundTimerHandle) clearInterval(roundTimerHandle);
  roundState.secondsLeft = 0;
  roundState.showingTimesUp = true;
  if(currentApp==="round1") render();
}
function endRound1(){
  roundState.ended = true;
  roundState.justEnded = true;
  // Clock the moment claims became contested-and-loose — every "loose 3:20" in the
  // end-of-session report is measured from here.
  roundState.endedAt = Date.now();
}

// ---------------- VOTES / SORTING ----------------
function castVote(claimId, call){
  if(roundState.ended) return;
  claimVotes[claimId] = (claimVotes[claimId]===call) ? null : call;
  render();
  // Picking a color (not un-picking one) bounces you straight to the next card —
  // keeps the gut-check moving instead of making players manually scroll each time.
  if(claimVotes[claimId] !== null) scrollToNextCard(claimId);
  maybeEndEarly();
}
// A timer is a ceiling, not a duration (Tara, 8/31/2026): the moment every call is
// in, the round ends — nobody should sit watching a clock run out on a decision the
// table has already made. The 60s cap still exists for the table that stalls.
// Single-player file, so "everyone" is you: every claim carries a call.
function maybeEndEarly(){
  if(!roundState.started || roundState.ended || roundState.showingTimesUp) return;
  var allIn = CLAIMS.every(function(c){ return !!claimVotes[c.id]; });
  if(allIn) setTimeout(forceTimesUp, 500);   // a beat, so the last tap is seen landing
}
// scrollAnimUntil guards the engagement-gravity tick below from rebuilding the
// feed mid-scroll — mirrors the same fix in infodemic-multiplayer-prototype.html
// (8/16/2026 playtest: card-to-card jump didn't always work seamlessly).
var scrollAnimUntil = 0;
function scrollToNextCard(claimId){
  var current = document.getElementById("slide-"+claimId);
  if(!current || !current.nextElementSibling) return;
  var next = current.nextElementSibling;
  if(typeof next.scrollIntoView === "function"){
    scrollAnimUntil = Date.now() + 700;
    next.scrollIntoView({behavior:"smooth", block:"start"});
  }
}
function claimVotesFor(claim){
  var v = {};
  PLAYERS.forEach(function(p){
    v[p.id] = p.isYou ? (claimVotes[claim.id] || null) : claim.npcVotes[p.id];
  });
  return v;
}
function claimStatus(claim){
  if(!roundState.ended) return "voting";
  var v = claimVotesFor(claim);
  var vals = Object.keys(v).map(function(k){ return v[k]; }).filter(function(x){ return x!=null; });
  var uniq = vals.filter(function(x,i){ return vals.indexOf(x)===i; });
  // Nobody called it at all. This used to fall through to "agreed" below, because
  // zero distinct answers also satisfies uniq.length<=1 - so an untouched story got
  // reported as a table decision. Silence isn't consensus (Tara, 8/24/2026).
  if(vals.length===0) return "skipped";
  return uniq.length<=1 ? "agreed" : "contested";
}

// ---------------- NAV ----------------
function goHome(){ currentApp = "round1"; render(); }
// There's no separate full-screen claim view anymore — everything about a story
// (investigate, case board) lives on that story's own card. Jumping to a claim from
// elsewhere (e.g. the Spread's "top contested claim" tile) means: go back to the
// feed, flip that card open straight to its Board tab, and scroll it into view.
function openClaim(id){
  // Was gated on claimStatus === "contested" — the last of the three consensus gates,
  // and the one that made the Spread's "top spreading right now" tile silently do
  // nothing for a story the table happened to agree about. Any unfiled story opens.
  if(!roundState.ended || !seenOnboard.investigate) return;
  if(storyLocked(id)) return;   // one story at a time — see liveClaim()
  currentApp = "round1";
  openSpoke(id, "case");
  setTimeout(function(){
    var el = document.getElementById("slide-"+id);
    if(el && typeof el.scrollIntoView === "function") el.scrollIntoView({behavior:"smooth", block:"start"});
  }, 50);
}
function openApp(name){ currentApp = name; render(); }

// ---------------- CARD FLIP (inline Round 2 investigation) ----------------
// Pure front<->back toggle — only used by the back face's own ↩ close control now.
// Filed claims can still flip (to review the read-only board/receipt), they just
// can't reach Search/Ask AI anymore — renderCardBack enforces that, not this.
function flipCard(claimId){
  // No status gate any more. Triage decides what the table AGREED to chase; it does not
  // decide what anyone is allowed to look at (Tara, 8/31/2026: "any of them should be
  // investigatable"). A story nobody picked is still one tap from its tools.
  if(!roundState.ended) return;
  if(!seenOnboard.investigate) return; // whole table clears the Investigate tour before anyone can flip a card open
  if(storyLocked(claimId) && !getBoard(claimId).filed) return; // one story at a time (cluster A) — but a FILED card is read-only and always browsable (C4)
  claimFlipped[claimId] = !claimFlipped[claimId];
  render();
}
// Front-face buttons use this instead — always flips IN (never toggles back out,
// since these buttons are only reachable while the front face is showing) and can
// jump straight to a specific spoke. Passing no mode leaves cardMode as-is, which
// means "investigate" reopens wherever you last left off, or the move-menu the very
// first time (the case file, since 9/4) — see renderCardBack.
function openSpoke(claimId, mode){
  if(!roundState.ended) return;   // same open-to-all rule as flipCard
  if(!seenOnboard.investigate) return; // same gate as flipCard — finalizeOnboard() flips this true before its own hand-off call
  if(storyLocked(claimId) && !getBoard(claimId).filed) return; // same lock as flipCard; filed cards exempt (C4)
  claimFlipped[claimId] = true;
  if(mode) cardMode[claimId] = mode;
  render();
}
function setCardMode(claimId, mode){ cardMode[claimId] = mode; render(); }

// ---------------- ROUND 1 RENDER ("For You" immersive feed) ----------------
// The onboarding tour (see maybeShowOnboard/ONBOARD_CONTENT) covers this screen
// immediately on entry and now owns starting the round — its last screen's
// "I'm ready" IS the start action once the whole table's (simulated teammates
// included) tapped it (see finalizeOnboard). Mirrors the same change in
// infodemic-multiplayer-prototype.html.
function renderRound1Start(){
  var html = '<div class="r1start">';
  html += '<div class="r1startbadge">ROUND 1</div>';
  html += '<div class="r1starttitle">Gut Check</div>';
  html += '<div class="r1startsub">'+CLAIMS.length+' stories, one shared 60-second clock. Red, yellow, or green — go with your gut on each one before time runs out.</div>';
  html += '<div class="r1starthint">Getting your team ready…</div>';
  html += '</div>';
  document.getElementById("screenArea").innerHTML = html;
}
function renderRound1TimesUp(){
  var html = '<div class="r1timesup">';
  html += '<span class="r1timesupclose" onclick="dismissTimesUp()">✕</span>';
  html += '<div class="r1timesupbig">⏰ TIME\'S UP</div>';
  html += '<div class="r1timesuptitle">Let\'s see where you landed</div>';
  // Was: "go through each story, one at a time — how it was called, and where your table
  // agreed or split." Both halves went stale on 8/31/2026 — the reveal plays ONE story
  // now, and agreed/split stopped being a thing the game says anywhere.
  html += '<div class="r1timesupsub">Pens down. We\'ll start with one story, and how each of you called it.</div>';
  html += '<div class="r1timesupbtn" onclick="dismissTimesUp()">Continue</div>';
  html += '</div>';
  document.getElementById("screenArea").innerHTML = html;
}
// Stays on screen until the table explicitly continues (or X's out) — no auto-timeout.
function dismissTimesUp(){
  roundState.showingTimesUp = false;
  startRoundReveal();
}

// ---------------- ROUND REVEAL (Jackbox-style, one story at a time) ----------------
function startRoundReveal(){
  endRound1(); // locks in final vote tallies so claimStatus/claimVotesFor are stable through the reveal
  revealState.active = true;
  revealState.index = 0;
  // ONE story, not five (8/31/2026, Tara: "it sticks after one"), and the one that
  // flashes is the MOST CONTESTED (9/3/2026): "you all read this differently" is the
  // reveal now. The other four show their spread on the triage cards, where it is
  // information for a choice.
  revealState.order = [mostContestedClaim()];
  if(currentApp==="round1") render();
}
function revealNext(){ finishRoundReveal(); }
function skipRoundReveal(){ finishRoundReveal(); }
// The reveal ends on a CHOICE (Tara, 9/3/2026): "So what actually happened? →" only
// works if it goes straight into investigating that story, so that button commits the
// table to the reveal story and opens it; "Pick a different one" goes to triage. Either
// way one story is chosen; triage returns after each filing while quota remains.
function chaseRevealStory(){
  var claim = revealState.order[revealState.index];
  revealState.active = false;
  triageState.active = false;
  triageState.picked = claim ? [claim.id] : [];
  if(!claim || triageQuota() <= 0){ triageState.stage = "done"; if(currentApp==="round1") render(); return; }
  commitChase();
}
function finishRoundReveal(){
  revealState.active = false;
  triageState.picked = [];
  if(triageQuota() > 0){ triageState.active = true; triageState.stage = "active"; }
  else { triageState.stage = "done"; }
  if(currentApp==="round1") render();
}
// The story whose gut calls are most spread: most distinct calls first, then the most
// non-straight calls, then feed order. Falls back to the first story if nobody voted.
function mostContestedClaim(){
  var best = CLAIMS[0], bestKey = -1;
  CLAIMS.forEach(function(c){
    var v = claimVotesFor(c);
    var vals = Object.keys(v).map(function(k){ return v[k]; }).filter(Boolean);
    var uniq = vals.filter(function(x,i){ return vals.indexOf(x)===i; }).length;
    var spun = vals.filter(function(x){ return x !== "true"; }).length;
    var key = uniq*10 + spun;
    if(key > bestKey){ best = c; bestKey = key; }
  });
  return best;
}
// ---------------- THE REVEAL: the vote flash (9/3/2026) ----------------
// Back to the original shape, now that everyone read the same post: the post's headline
// at the top, then each player's avatar drops in carrying their gut call. No verdict
// line — no "Table agreed / Contested" — the avatars are the whole screen. No tells
// here either: the post-file story summary is where a tell gets named.
var FLAG_CLASS = {misinfo:"red", biased:"yellow", "true":"green"};
function renderRoundReveal(){
  var claim = revealState.order[revealState.index];
  var v = claimVotesFor(claim);
  var html = '<div class="reveal">';
  html += '<span class="revealskip" onclick="skipRoundReveal()">Skip ✕</span>';
  html += '<div class="rvprogress anim" style="animation-delay:0ms;">The first story</div>';
  html += '<div class="rvfact anim" style="animation-delay:60ms;">How each of you called it</div>';
  html += '<div class="revealsubject anim" style="animation-delay:120ms;">'+(claim.topic || claim.subject)+'</div>';
  html += '<div class="revealheadline anim" style="animation-delay:120ms;">'+claim.headline+'</div>';
  html += '<div class="revealvotes">';
  PLAYERS.forEach(function(p, i){
    var vote = v[p.id];
    html += '<div class="revealvoteitem" style="animation-delay:'+(420 + i*180)+'ms;">';
    html += '<div class="revealavatar '+(vote || "none")+'">'+(vote ? CALL_META[vote].emoji : "—")+'</div>';
    html += '<div class="revealvotename">'+(p.isYou?"You":p.name)+'</div>';
    html += '<div class="revealvotecall">'+(vote ? CALL_META[vote].label : "no call")+'</div>';
    html += '</div>';
  });
  html += '</div>';
  var tail = 420 + PLAYERS.length*180;
  // The question that runs through the rest of the game: asked here, answered by the
  // note in Round 3 — so the button that asks it goes straight into THIS story. The
  // quieter option underneath hands off to triage instead.
  html += '<button class="rvbtn anim" style="animation-delay:'+(tail+200)+'ms;" onclick="chaseRevealStory()">So what actually happened? →</button>';
  html += '<button class="rvbtn ghost anim" style="animation-delay:'+(tail+320)+'ms;" onclick="finishRoundReveal()">Pick a different story</button>';
  html += '</div>';
  document.getElementById("screenArea").innerHTML = html;
}

// One screen, fired off the first filed story's summary: here's what's still loose,
// and here's how many more you can take. Deliberately shows every remaining story —
// including the ones nobody flagged — because the choice is the lesson, and a table
// that only ever chases what it already doubted isn't triaging, it's confirming.
function renderTriage(){
  var left = CLAIMS.filter(function(c){ return !getBoard(c.id).filed; });
  var quota = triageQuota();
  var chosen = triageChosen();
  var stays = left.length - quota;
  var filedN = CLAIMS.length - left.length;
  // One pick per visit. First visit comes straight off the reveal; later visits fire
  // off a filed story's summary while the teacher's number isn't reached. Copy is
  // number-driven so a teacher's setting reads right.
  var html = '<div class="triage"><div class="triagescroll">';
  html += '<div class="rvprogress">'+(filedN ? 'What\'s still out there' : 'Your first case')+'</div>';
  html += '<div class="triagetitle">'+(filedN ? left.length+' stories left. You can chase '+(quota===1 ? 'one more.' : quota+' more.')
                                              : 'Which one first?')+'</div>';
  html += '<div class="triagesub">'+(filedN ? 'That one took your whole team. Pick the next one'
                                            : 'Your whole team works each case together, so choose what\'s worth the time')+
          ' — the other '+stays+(stays===1 ? ' stays in the feed, and keeps' : ' stay in the feed, and keep')+' spreading.</div>';
  left.forEach(function(claim){
    var picked = triagePicked(claim.id);
    var votes = claimVotesFor(claim);
    var flags = PLAYERS.map(function(pl){ return votes[pl.id]; });
    var spun = flags.filter(function(f){ return f && f !== "true"; }).length;
    html += '<div class="triagecard'+(picked?' picked':'')+'">';
    html += '<div class="triagerow" onclick="toggleTriage('+claim.id+')">';
    html += '<div class="triagetick">'+(picked?'✓':'')+'</div>';
    html += '<div class="triagebody"><div class="triagetopic">'+(claim.topic||claim.subject)+'</div>';
    html += '<div class="triagehead">'+claim.headline+'</div>';
    html += '<div class="triageflags">'+PLAYERS.map(function(pl){
      var f = claimVotesFor(claim)[pl.id];
      return '<span class="triagedot '+(FLAG_CLASS[f]||"none")+'"></span>';
    }).join("")+'<span class="triagemeta">'+(spun ? spun+" of "+flags.length+" called it spun or worse" : "nobody flagged this one")+'</span></div>';
    html += '</div></div>';
    html += '</div>';
  });
  html += '</div><div class="triagefoot">';
  html += '<div class="triagecount">'+(chosen ? 'one picked' : 'pick one')+(quota>1 ? ' · '+(quota-1)+' more after this' : '')+'</div>';
  html += '<div class="triagebtn'+(chosen<1?' off':'')+'" onclick="finishTriage()">Go find out what happened →</div>';
  html += '</div></div>';
  document.getElementById("screenArea").innerHTML = html;
}

function renderRound1(){
  if(!roundState.started){ renderRound1Start(); return; }
  if(roundState.showingTimesUp){ renderRound1TimesUp(); return; }
  if(revealState.active){ renderRoundReveal(); return; }
  if(triageState.active){ renderTriage(); return; }
  var justSorted = roundState.justEnded;
  roundState.justEnded = false;

  // Sorted by what the table committed to, not by whether they disagreed (8/31/2026).
  var chasing = CLAIMS.filter(function(c){ return triagePicked(c.id); });
  var loose = CLAIMS.filter(function(c){ return !triagePicked(c.id); });
  var voting = CLAIMS.filter(function(c){ return claimStatus(c)==="voting"; });
  var order = roundState.ended ? chasing.concat(loose) : voting;

  // Preserve scroll position across re-renders (timer ticks, vote taps) so scrolling
  // through the feed isn't reset every 250ms. The one exception is right after the
  // round sorts — that's the intentional "pull contested claims to the front" moment.
  var prevEl = document.getElementById("feedscroll");
  var prevScroll = prevEl ? prevEl.scrollTop : 0;
  // Same idea for any flipped card's own inline scroll region (evidence marking, mode
  // switches, and the AI typing reveal all trigger a full re-render too) — otherwise
  // reading through Search results would keep getting yanked back to the top.
  var prevCardScrolls = {};
  Object.keys(claimFlipped).forEach(function(id){
    if(!claimFlipped[id]) return;
    var el = document.getElementById("cardback-scroll-"+id);
    if(el) prevCardScrolls[id] = el.scrollTop;
  });

  // Round/timer/spread info now lives once in a persistent top bar instead of being
  // repeated on every card — keeps each card focused on just its own story.
  var s = spreadStats();
  var pr = s.total>0 ? Math.round(100*s.redHeat/s.total) : 0;
  var html = '<div class="r1topbar"><div><div class="r1toptitle">For You</div>';
  var topsub = roundState.ended
    ? (sessionState.ended ? 'Session complete · '+CLAIMS.filter(function(c){ return getBoard(c.id).filed; }).length+' cases filed'
                          : 'Chasing '+chasing.length+' · '+loose.length+' still out there')
    : 'Round 1 · Gut check';
  html += '<div class="r1topsub">'+topsub+'</div></div>';
  html += '<div class="r1toptools">';
  // Once the session's over the report is reachable again from here — dismissing it
  // shouldn't mean losing it.
  if(sessionState.ended) html += '<div class="sessionbadge" onclick="openEndReport()">📋 Report</div>';
  html += '<div class="spreadbadge" onclick="openApp(\'spread\')">🔥 '+pr+'%</div>';
  // Pro Tips lives here now instead of on every card's rail — it's not tied to any
  // one story, so it belongs in the persistent header, not repeated per-card.
  html += '<div class="tipsbadge" onclick="openApp(\'tells\')">🧠</div>';
  if(!roundState.ended) html += '<div class="roundbadge'+(roundState.secondsLeft<=10?' urgent':'')+'" id="roundbadge" onclick="forceTimesUp()">⏱ '+roundState.secondsLeft+'s</div>';
  html += '</div></div>';

  html += '<div class="feedscroll" id="feedscroll">';
  order.forEach(function(c, idx){ html += renderFeedCard(c, justSorted, idx); });
  html += '</div>';
  document.getElementById("screenArea").innerHTML = html;

  var newEl = document.getElementById("feedscroll");
  if(newEl && !justSorted) newEl.scrollTop = prevScroll;
  Object.keys(prevCardScrolls).forEach(function(id){
    var el = document.getElementById("cardback-scroll-"+id);
    if(el) el.scrollTop = prevCardScrolls[id];
  });
}
function renderFeedCard(claim, justSorted, idx){
  var status = claimStatus(claim);
  var variant = claim;   // one post per story — the claim itself carries headline/source/background
  var myVote = claimVotes[claim.id] || null;
  var bg = 'linear-gradient(200deg, hsl('+claim.hue+',55%,22%), #05060a 70%)';
  var eng = BASE_ENGAGEMENT[claim.id] || 10;
  var likes = formatCount(Math.round(eng*1000 + claim.id*173));
  var comments = formatCount(Math.round(eng*180 + claim.id*37));
  var board = getBoard(claim.id);
  var flipped = !!claimFlipped[claim.id];

  // Right after the round ends, cards visibly shuffle into their new order —
  // staggered by position so contested claims appear to settle into the front
  // of the deck one after another, not just pop in all at once.
  var justSorting = justSorted && roundState.ended;
  var cardCls = "feedcard" + (justSorting ? " justsorted" : "");
  var styleAttr = justSorting ? ('animation-delay:'+(Math.min(idx,8)*70)+'ms;') : '';
  var html = '<div class="'+cardCls+'" style="'+styleAttr+'" id="slide-'+claim.id+'">';
  html += '<div class="cardflip-inner'+(flipped?' flipped':'')+'">';

  // ---- FRONT FACE: the feed card itself, unchanged from before ----
  html += '<div class="cardface cardface-front" style="background:'+bg+';">';
  html += '<div class="feedtopscrim"></div><div class="feedbottomscrim"></div>';

  // Rail is decorative/ambient furniture now (poster avatar + the spinning disc) —
  // everything actionable and story-specific (investigate, case board, agreed/filed
  // status) moved down into the corner cluster and the vote area below, and Pro Tips
  // moved up into the persistent header since it isn't tied to any one story.
  html += '<div class="feedrail">';
  html += '<div class="railavatar">'+posterInitial(variant)+'</div>';
  if(roundState.ended && status==="skipped"){
    html += '<div class="railitem"><span class="railicon">⏭️</span><span class="raillabel skipped">skipped</span></div>';
  }
  if(roundState.ended && status==="agreed"){
    html += '<div class="railitem"><span class="railicon">✅</span><span class="raillabel agreed">same call</span></div>';
  }
  html += '<div class="raildisc">🎵</div>';
  html += '</div>';

  // Corner action cluster — the story's two spokes, always visible together once
  // it's contested (per Tara: investigate + case board should both be clearly present
  // on the card, not hidden behind one generic flip icon). Still deliberately quiet —
  // small glassy circles with a soft pulse, not a loud full-width red CTA — modeled on
  // flashcard-app / card-game corners, just now two of them side by side.
  // Tara, 9/3/2026 (cluster A, second pass): no padlocks. A story that isn't live simply
  // has NO tools on it — "how many am I supposed to look at" is answered by there being
  // exactly one card with buttons. The pre-tour "wait" lock went too: the tour is
  // full-screen, so nobody ever saw it. The tap gates in flipCard/openSpoke/openClaim
  // stay underneath as the safety net.
  if(roundState.ended && !board.filed && seenOnboard.investigate && !storyLocked(claim.id)){
    html += '<div class="flipcluster">';
    // 9/4/2026 (Rebecca's shape): the case file IS the landing screen now, so the two
    // doors ("dig in" → the move menu, "case" → the board tab) collapsed into one.
    html += '<div class="flipnub-wrap" onclick="openSpoke('+claim.id+',\'case\')"><div class="flipnub">🗂️'+(board.board.length>0?('<span class="flipnub-badge">'+board.board.length+'</span>'):'')+'</div><div class="flipnub-label">dig in</div></div>';
    html += '</div>';
  }

  // Everything about the STORY — account, subject, headline, vote — lives in this one
  // block on the card. The account line is real-platform shape (C1/C2): name, ✓ if
  // verified, handle, follower count — read off `background`, the same data Background
  // check shows in full. Seen, not investigated: no affordance until it's a tap (C3).
  html += '<div class="feedbottom">';
  html += renderAccountLine(claim);
  html += '<div class="subjecttag">'+claim.subject+'</div>';
  // Once a case is filed, the verdict is the single most important thing about this
  // card — promoted above the headline, not buried after the vote reveal, so it's the
  // first real information you hit. The gut-check votes still render below (readonly
  // stoplight + "see who voted"), so seeing both together on the same card IS the
  // then/now comparison — no separate delta table needed elsewhere.
  if(roundState.ended && board.filed){
    // 8/31/2026: the strip used to read FILED ✓ + the table's determination. There is no
    // determination any more, and the note is the better thing to put here anyway — a
    // real Community Note rides on the post, so the correction travels with the story.
    // The manipulated headline still renders underneath: the post isn't corrected out of
    // existence, it's corrected in place.
    // A straight story files as CHECKS OUT (B12); the auto tell line rides under the note.
    var noteLine = r3NoteText(board);
    var srcLetters = r3CiteLabel(claim.id, board.r3 && board.r3.sources || []);
    var straightNote = !claim.cardTell;
    html += '<div class="hubnote" onclick="openSpoke('+claim.id+',\'board\')">';
    html += '<div class="hubnotehead">📝 READERS ADDED CONTEXT<span class="hubnotechk">'+(straightNote ? "CHECKS OUT" : "FILED ✓")+'</span></div>';
    html += '<div class="hubnotebody">'+(escapeHtml(noteLine) || "Context added by your team.")+'</div>';
    html += '<div class="hubnoteline'+(straightNote?" g":"")+'">'+r3AutoLine(claim, true)+'</div>';
    html += '<div class="hubnotefoot">'+PLAYERS.map(function(p){ return r3Av(p.id); }).join("")+'<span>'+(srcLetters||"filed")+'</span><span class="hubnotego">See the case →</span></div>';
    html += '</div>';
  }
  html += '<div class="headline">'+variant.headline+'</div>';
  html += '<div class="cardstats"><span>❤️ '+likes+'</span><span>💬 '+comments+'</span></div>';

  if(!roundState.ended){
    html += '<div class="stoplight">';
    [["misinfo","red"],["biased","yellow"],["true","green"]].forEach(function(pair){
      var k = pair[0], colorCls = pair[1];
      html += '<span class="stoplightopt '+colorCls+(myVote===k?' selected':'')+'" onclick="castVote('+claim.id+',\''+k+'\')">'+CALL_META[k].emoji+'</span>';
    });
    html += '</div>';
  } else {
    // Round's over — votes reveal, grouped by who called what (Jared's idea:
    // expand under the buttons rather than a row of avatars). This stays on the
    // FRONT face — Tara: you don't need to know how others voted while investigating.
    var v = claimVotesFor(claim);
    var groups = {misinfo:[], biased:[], "true":[]};
    PLAYERS.forEach(function(p){
      var vote = v[p.id];
      if(vote && groups[vote]) groups[vote].push(p.isYou ? "You" : p.name);
    });
    html += '<div class="stoplight readonly">';
    [["misinfo","red"],["biased","yellow"],["true","green"]].forEach(function(pair){
      var k = pair[0], colorCls = pair[1];
      html += '<span class="stoplightopt '+colorCls+(myVote===k?' selected':'')+'"><span class="stoplightcount">'+groups[k].length+'</span></span>';
    });
    html += '</div>';
    var expanded = !!voteExpanded[claim.id];
    html += '<div class="voteexpand" onclick="toggleVoteExpand('+claim.id+')">'+(expanded?'▴ Hide who voted':'▾ See who voted')+'</div>';
    if(expanded){
      html += '<div class="votegroups">';
      [["misinfo","🚩 Misinfo"],["biased","🤔 Biased"],["true","✅ True"]].forEach(function(pair){
        var k = pair[0], label = pair[1];
        html += '<div class="votegrouprow"><span class="vglabel">'+label+'</span><span class="vgnames">'+(groups[k].length ? groups[k].join(", ") : "—")+'</span></div>';
      });
      html += '</div>';
    }
    // Was contested/agreed. Triage replaced that split (8/31/2026): a story is either
    // one the table committed to chase or one still loose in the feed — and "loose"
    // is an invitation, not a closed door.
    if(triagePicked(claim.id)){
      // Filed note shows up top (see hubnote, above the headline); a picked, unfiled
      // story shows nothing extra here — the corner cluster is its trigger.
    } else {
      // While another story is live this card has no tools, so "dig in anyway" would be
      // a lie — the bare line just says it's still loose.
      html += '<div class="agreedcta">'+(storyLocked(claim.id) ? 'Still out there' : 'Still out there — dig in anyway')+'</div>';
    }
  }
  html += '</div>'; // end feedbottom
  html += '</div>'; // end cardface-front

  // ---- BACK FACE: inline investigation, open on every story once the round ends ----
  html += '<div class="cardface cardface-back">';
  if(roundState.ended) html += renderCardBack(claim, variant);
  html += '</div>';

  html += '</div>'; // end cardflip-inner
  html += '</div>'; // end feedcard
  return html;
}
function renderCardBack(claim, variant){
  // Rebecca's shape (9/4/2026, from the approved infodemic-round2-mock.html): the card
  // back is one screen — the case file — and the tools are pills on it. cardMode is
  // "case" (home) or one of the three tools; "board" from older callers means home.
  var mode = cardMode[claim.id];
  if(!mode || mode==="board") mode = "case";
  var board = getBoard(claim.id);
  var nEx = board.board.length, needEx = BOARD_TOUR_EVIDENCE_THRESHOLD, enough = nEx >= needEx;
  var html = '<div class="cardback-head">';
  html += '<span class="cardback-flipclose" onclick="flipCard('+claim.id+')">↩</span>';
  // Tara, 9/4 evening: while investigating, the headline is NOT repeated up here — the
  // post is the first row of the case file, highlighted. The head is just the way out
  // and the status. Filed / writing keep the headline (their board doesn't lead with it).
  // The tools drop it too: the ‹ Case file line carries the count, Search carries the query.
  var homeMode = !board.filed && !r3Writing(claim.id);
  // Tara, 9/4 eve: while investigating the header is just the round — "ROUND 2 · INVESTIGATION".
  html += '<div class="cardback-titlewrap"><div class="cardback-subject" style="margin-bottom:0">'+(board.filed ? claim.subject+' · case filed' : (r3Writing(claim.id) ? 'Round 4 · Community note' : 'Round 2 · Investigation'))+'</div>';
  if(!homeMode) html += '<div class="cardback-headline">'+variant.headline+'</div>';
  html += '</div>';
  html += '</div>';
  html += '<div class="cardback-scroll" id="cardback-scroll-'+claim.id+'">';
  if(board.filed && mode==="background"){
    // C4 (9/3/2026): tapping a filed story's account opens its profile, read-only.
    // One way back — to the case — and no other tabs.
    html += '<div class="cardback-backlink" onclick="setCardMode('+claim.id+',\'case\')">← Back to the case</div>';
    html += renderClaimBackground(claim);
  } else if(board.filed){
    // Case closed — land straight on the (read-only) board/receipt, no menu
    // or tabs to get lost in. Search/Ask AI aren't reachable post-filing.
    html += renderClaimBoard(claim);
  } else if(r3Writing(claim.id)){
    // Tara, 8/31/2026: "the UX for the whole community note section is weird because you
    // don't need the other tabs anymore, you really just need that evidence board."
    // Round 3 can only cite what's already in the case file, so the tools go away and
    // the card is the note plus the evidence it's built from.
    html += renderClaimBoard(claim);
  } else if(mode==="case"){
    // HOME. Framing line + the standing goal line (cluster A, reworded 9/3 evening) sit
    // directly above the list they're counting — that was the whole point of the move.
    var goalTxt;
    if(nEx === 0)        goalTxt = 'Add at least '+needEx+' pieces of evidence to your case file. Then your team writes the community note.';
    else if(!enough)     goalTxt = nEx+' in your case file — add at least '+(needEx-nEx)+' more. Then your team writes the community note.';
    else                 goalTxt = 'Enough in your case file. Keep digging, or tell your team you\'re ready.';
    html += '<div class="cardback-frame">'+(enough ? 'Your case is building. 🗂️' : 'Now gather the evidence. 🗂️')+'<span class="goal'+(enough?' done':'')+'">'+goalTxt+'</span></div>';
    html += renderToolPills(claim);
    html += renderCaseFile(claim);
  } else {
    // A tool — a whole screen, one way back. The 🗂️ count is the only trace of home.
    html += '<div class="cardback-navback" onclick="setCardMode('+claim.id+',\'case\')"><span class="chev">‹</span> Case file<span class="cnt">🗂️ '+nEx+'/'+needEx+'</span></div>';
    if(mode==="search") html += renderClaimSearch(claim);
    else if(mode==="ai") html += renderClaimAI(claim);
    else html += renderClaimBackground(claim);
  }
  html += '</div>';
  // The Round 2 → 3 door (B18, re-decided 9/4 with Rebecca's note): a standing Ready
  // button under the case file, grey until the minimum, and the PLAYER ends Round 2 —
  // the gate no longer fires itself at four. The B18 question isn't asked a second time:
  // the button is that decision.
  if(homeMode && mode==="case"){
    html += '<div class="cardback-foot">';
    html += '<button class="readybtn'+(enough?' pulse':'')+'"'+(enough?'':' disabled')+' onclick="readyForNote('+claim.id+')">Ready to go! →</button>';
    html += '<div class="readynote">'+(enough ? 'Tap when your team agrees you\'re done looking.' : 'Unlocks at '+needEx+' pieces of evidence · '+nEx+' so far')+'</div>';
    html += '</div>';
  }
  return html;
}
// The three tools as a pill row. Three, not four: Rebecca counted today's tiles, but the
// fourth (Compare notes) is this screen's body now. Measured on the mock: three short
// labels fit a 390px card; the long names and any fourth pill overflow.
function renderToolPills(claim){
  var b = getBoard(claim.id), clips = CLIPS[claim.id] || [];
  function onBoardCount(pred){ return b.board.filter(function(id){ var c = clips.filter(function(x){ return x.id===id; })[0]; return c && pred(c); }).length; }
  var pills = [
    ["background","bg","🕵️","Background", onBoardCount(function(c){ return c.source==="background"; })],
    ["search","search","🔍","Search",      onBoardCount(function(c){ return !c.source; })],
    ["ai","ai","✨","Ask AI",              onBoardCount(function(c){ return c.source==="ai"; })]
  ];
  var html = '<div class="pillrow">';
  pills.forEach(function(p){
    html += '<div class="pill '+p[1]+'" onclick="setCardMode('+claim.id+',\''+p[0]+'\')"><span class="ic">'+p[2]+'</span><span>'+p[3]+'</span>'+(p[4]?'<span class="n">'+p[4]+'</span>':'')+'</div>';
  });
  return html + '</div>';
}
// The case file as the body of the open story: the post first, then exhibits, then
// dashed slots for whatever's still short of the minimum. Read-only variants of this
// list (filed / writing) still come from renderClaimBoard.
var justAddedClipId = null;
function renderCaseFile(claim){
  var b = getBoard(claim.id), need = BOARD_TOUR_EVIDENCE_THRESHOLD;
  var html = '<div class="sectionhead casehead">Your case file <span class="cnt">'+b.board.length+' / '+need+' MIN</span></div>';
  html += '<div class="groupcard">';
  var postEng = BASE_ENGAGEMENT[claim.id] || 10;
  // Tara, 9/4 evening: the post is the thing everything else is ABOUT, and it's no longer
  // repeated in the head — so it's the highlighted first row, with its account line (a tap
  // into Background check, same as the card front on the live story).
  var bg = claim.background || {};
  html += '<div class="resultrow thepost"><span class="exhibitlabel">The post you\'re chasing</span>';
  html += '<div class="postacct" onclick="setCardMode('+claim.id+',\'background\')"><span class="postav" style="background:linear-gradient(160deg, hsl('+claim.hue+',55%,42%), hsl('+claim.hue+',55%,22%));">'+(bg.displayName ? bg.displayName.charAt(0) : posterInitial(claim))+'</span>'
       + '<span class="postname">'+(bg.displayName || claim.source)+(bg.verified ? ' <span class="vfd">✓</span>' : '')+'</span><span class="postmeta">'+(bg.handle || '')+(bg.followers ? ' · '+bg.followers+' followers' : '')+'</span></div>';
  html += '<div class="posttext">'+claim.headline+'</div>';
  html += '<div class="postengage">❤️ '+formatCount(Math.round(postEng*1000 + claim.id*173))+' &nbsp; 💬 '+formatCount(Math.round(postEng*180 + claim.id*37))+' &nbsp; <span style="color:var(--ios-label3)">'+claim.source+'</span></div></div>';
  var allClips = CLIPS[claim.id] || [];
  b.board.forEach(function(clipId, idx){
    var clip = allClips.filter(function(x){ return x.id===clipId; })[0] || {text:clipId, who:"source"};
    var origin = clip.source==="ai" ? "🤖 " : (clip.source==="background" ? "🕵️ " : "");
    html += '<div class="resultrow'+(justAddedClipId===clipId?' justadded':'')+'"><span class="exhibitlabel">EXHIBIT '+letterFor(idx)+'</span>';
    html += '<div class="resulttext" style="margin-top:4px; margin-bottom:3px;">'+origin+clip.text+'</div>';
    html += '<div style="font-size:11.5px; color:var(--ios-label2);">'+r3ClipWho(clip)+'</div></div>';
  });
  for(var i=b.board.length; i<need; i++){
    html += '<div class="caseghost"><span class="slot">'+letterFor(i)+'</span>'+(i===b.board.length ? (b.board.length===0 ? 'Nothing here yet — use a tool above to find something.' : 'Next piece of evidence') : '')+'</div>';
  }
  html += '</div>';
  html += '<div class="caseteam">'+PLAYERS.map(function(p){ return r3Av(p.id); }).join('')+'&nbsp; Everyone on your team sees this list.</div>';
  justAddedClipId = null;
  return html;
}

// How each source type presents itself in the results list. Derived from the clip's
// own `who` so no content had to be re-authored — the type is printed on the result
// where a real results page prints the site.
var SRC_LOOK = {
  "News / institution":     {fav:"\ud83d\udcf0", site:"published report",  cls:"inst"},
  "Influencer":             {fav:"\ud83d\udcf1", site:"social post",        cls:"inf"},
  "Can't tell — bot or AI?":{fav:"\u2753",        site:"unverified account", cls:"bot"},
  "Friend":                 {fav:"\ud83d\udc64", site:"shared with you",    cls:""}
};
function renderClaimSearch(claim){
  var html = "";
  if(!claim.wired){ return html + '<div class="emptystate">No results yet for this claim.</div>'; }
  var clips = CLIPS[claim.id].filter(function(c){ return c.source!=="ai" && c.source!=="background"; });
  var addedCount = clips.filter(function(c){ return clipState[c.id].shared; }).length;
  // Search-page chrome. Most of the "this is a search page" work is done here, before
  // a single result renders.
  html += '<div class="srchbar"><span class="mag">\ud83d\udd0d</span><span class="q">'+searchQueryFor(claim)+'</span><span class="x">\u2715</span></div>';
  html += '<div class="srchtabs"><span class="srchtab on">All</span><span class="srchtab">Images</span><span class="srchtab">News</span><span class="srchtab">Videos</span></div>';
  html += '<div class="srchcount">About '+clips.length+' results \u00b7 '+addedCount+' added to your case</div>';
  clips.forEach(function(c){
    var s = clipState[c.id];
    var look = SRC_LOOK[c.who] || SRC_LOOK["Friend"];
    html += '<div class="sresult">';
    html += '<div class="ssite"><div class="sfav">'+look.fav+'</div><div style="min-width:0"><div class="ssitename">'+look.site+'</div></div>'
         +  '<span class="stype '+look.cls+'">'+c.who+'</span></div>';
    html += '<div class="stitle">'+c.text+'</div>';
    if(c.detail) html += '<div class="ssnip">'+c.detail+'</div>';
    html += renderClipImage(c) + renderReverseBlock(c);
    // One tap per result, the same tap, in the same place. Repetition is the
    // instruction — nothing else on a result is tappable.
    if(!s.shared){
      html += '<div class="saddwrap"><button class="btnfilled evidence" onclick="addToBoard('+claim.id+',\''+c.id+'\')">+ Add to case</button></div>';
    } else {
      html += '<div class="sadded">\u2713 Added to case</div>';
    }
    html += '</div>';
  });
  return html;
}
// The query a player would plausibly have typed, from the post's headline.
function searchQueryFor(claim){
  var h = claim.headline.toLowerCase();

// "Who's really behind this post" — a short account snapshot per claim (flags +
// a one-line note), injected into CLIPS as a source:"background" item so it can be
// marked as evidence and shows up on the shared board exactly like any other exhibit.
// The money panel under a profile. Answers "who pays for this, and what do they get
// out of it" using only what a platform would actually publish about an account —
// ownership, revenue, and whether paid posts are disclosed. No verdict: an account
// funded by the company it's posting about isn't lying, it just isn't neutral, and
// that's the reader's call to make. Renders nothing when a profile has no funding
// data rather than printing an empty shell.
function renderFundingPanel(b){
  if(!b || !b.funding || !b.funding.length) return "";
  var html = '<div class="profileabout"><div class="pahead">\u2139\ufe0f About this account</div>';
  b.funding.forEach(function(row){
    html += '<div class="parow"><div class="pak">'+row.k+'</div><div class="pav">'+row.v+'</div></div>';
  });
  return html + '</div>';
}
function renderClaimBackground(claim){
  var b = claim.background;
  var clipId = "bg-"+claim.id;
  if(!b || !clipState[clipId]) return '<div class="emptystate">No background info for this one yet.</div>';
  var s = clipState[clipId];
  // A real profile page, not a list of labeled red flags — no "here's what's wrong
  // with this account" callouts. Whatever's worth noticing (a suspiciously young
  // account, a bio that undercuts its own authority, a link-in-bio incentive) has to
  // be read off the profile itself, same as it would on the real platform.
  var html = '<div class="profilecard">';
  html += '<div class="profileavatar" style="background:linear-gradient(160deg, hsl('+claim.hue+',55%,42%), hsl('+claim.hue+',55%,22%));">'+b.displayName.charAt(0)+'</div>';
  html += '<div class="profilename">'+b.displayName+(b.verified?' <span class="profilebadge">✔️</span>':'')+'</div>';
  html += '<div class="profilehandle">'+b.handle+'</div>';
  html += '<div class="profilebio">'+b.bio+'</div>';
  html += '<div class="profilestats">';
  [["posts",b.posts],["followers",b.followers],["following",b.following]].forEach(function(stat){
    html += '<div class="profilestat"><span class="num">'+stat[1]+'</span><span class="lbl">'+stat[0]+'</span></div>';
  });
  html += '</div>';
  html += '<div class="profilejoined">📅 '+b.joined+'</div>';
  html += renderFundingPanel(b);
  html += '</div>';
  if(!s.shared){
    html += '<div class="rowctrl" style="margin-top:12px;"><button class="btnfilled evidence" onclick="addToBoard('+claim.id+',\''+clipId+'\')">+ Add to case</button></div>';
  } else {
    html += '<div class="resolvedtext" style="margin-top:12px;"><span>✓ Added to case</span></div>';
  }
  return html;
}

function renderClaimBoard(claim){
  var b = getBoard(claim.id);
  var justFiled = b.filed && justFiledClaimId===claim.id;
  if(justFiled) justFiledClaimId = null;
  var html = "";
  if(b.filed) html += '<div class="stamp'+(justFiled?' justfiled':'')+'">FILED ✓</div>';
  // The evidence fold (8/31) went with the role chain: Round 3 runs full-screen on its
  // own scrim now, so the board underneath is always the plain, read-only case file.
  html += '<div class="sectionhead">Evidence ('+b.board.length+')</div>';
  html += '<div class="groupcard">';
  // The post itself is always the first exhibit — everything else in this list is
  // context gathered about it. This also retires the separate "compare everyone's
  // version" section further down: the post is already right here, no need to repeat
  // it in a second grid.
  var postVariant = claim;
  var postEng = BASE_ENGAGEMENT[claim.id] || 10;
  var postLikes = formatCount(Math.round(postEng*1000 + claim.id*173));
  var postComments = formatCount(Math.round(postEng*180 + claim.id*37));
  html += '<div class="resultrow"><span class="exhibitlabel">THE POST</span>';
  html += '<div class="resulttext" style="margin-top:4px;">'+postVariant.headline+'</div>';
  html += '<div style="font-size:11.5px; color:var(--ios-label2);">'+postVariant.source+' · ❤️ '+postLikes+' · 💬 '+postComments+'</div></div>';
  if(b.board.length===0){
    html += '<div class="resultrow"><span style="color:var(--ios-label2); font-size:13px;">Nothing else pooled yet — go find something in Search or Ask AI and file it here.</span></div>';
  } else {
    var allClips = CLIPS[claim.id];
    b.board.forEach(function(clipId, idx){
      var clip = allClips.find(function(x){ return x.id===clipId; });
      var kind = clip.tell ? tellKind(clip.tell) : "none";
      var origin = clip.source==="ai" ? "🤖 " : "";
      // Tactic-name labels ("· Misleading chart") pulled off exhibit rows on 2026-08-12 —
      // Tara wants Pro Tips content out of the game loop until its best use is figured
      // out, but kept the top-bar nav link to the standalone library itself.
      // A ruling from Defend Your Evidence stays visible on the board (B8): ✓ it holds, 🚩 flagged.
      var ruling = b.r3 && b.r3.rulings ? b.r3.rulings[clipId] : null;
      var mark = ruling==="flag" ? ' <span title="flagged while writing">🚩</span>' : '';
      html += '<div class="resultrow"><span class="exhibitlabel">EXHIBIT '+letterFor(idx)+mark+'</span><div class="resulttext" style="margin-top:4px;">'+origin+clip.text+'</div></div>';
    });
  }
  html += '</div>';

  // ---------------- ROUND 3 ----------------
  // The beats run on #r3Scrim (renderR3); the board only carries the gate's door, the
  // "N more exhibits" line, and — once filed — the note and the receipt.
  html += b.filed ? renderFiledNote(claim, b) : renderRound3(claim);
  // Before the case is filed this board stays focused on evidence + the team's single
  // determination; the then/now vote comparison still lives on the hub card once you
  // flip back. The tell is named on the story summary screen that fires after filing
  // (Tara, 8/30: "on the filed card we don't need the tells").
  return html;
}

// ---------------- ROUND 3 ON THE BOARD ----------------
// What the case board says about the note while Round 3 hasn't started or is running on
// the scrim above it. The beats themselves never render here — see renderR3().
function renderRound3(claim){
  // The "N more exhibits" line and the deferred-gate door left with the auto-fire (9/4):
  // the case-file home carries the count and the Ready button now. This board only
  // renders while Round 3 runs on the scrim above it.
  if(r3Writing(claim.id)){
    return '<div class="sectionhead">Round 4 · the community note</div><div class="groupcard" style="padding:13px;">' +
      '<div class="r3hint" style="margin:0;">Your team is writing the note.</div></div>';
  }
  return "";
}
// A filed case board is exactly three things: the stamp (drawn above), the note, the receipt.
function renderFiledNote(claim, b){
  var r = b.r3 || {}, n = r.note, straight = !claim.cardTell;
  var html = '<div class="sectionhead">The note</div>';
  if(n){
    var p = P(n.by);
    html += '<div class="r3notecard win">';
    html += '<div class="byline">'+r3Av(n.by, "big")+'<div><div class="name">'+(p.isYou ? "Your note" : p.name+"’s note")+'</div>'+
            '<div class="sub">rated most helpful · '+n.cites.length+' '+(n.cites.length===1?"source":"sources")+' cited</div></div></div>';
    html += '<div class="nbody">'+escapeHtml(n.text)+'</div>';
    html += '<div class="nauto'+(straight?" g":"")+'">'+r3AutoLine(claim, true)+'</div>';
    n.cites.forEach(function(cid){
      var e = r3Exhibit(claim.id, cid);
      if(e) html += '<div class="nsrc"><span class="nexh">EXH '+e.letter+(r3Flagged(claim.id, cid)?' 🚩':'')+'</span><span>'+escapeHtml(e.clip.text)+' <span style="color:var(--ios-label3)">'+escapeHtml(r3ClipWho(e.clip))+'</span></span></div>';
    });
    html += '</div>';
  }
  html += '<div class="receiptcard">';
  html += '<div class="receiptrow"><span>Case number</span><span>'+(b.caseNo||claimNumber(claim.id))+'</span></div>';
  html += '<div class="receiptrow"><span>Exhibits attached</span><span>'+b.board.length+'</span></div>';
  html += '<div class="receiptrow"><span>Sources cited</span><span>'+(r3CiteLabel(claim.id, r.sources)||"—")+'</span></div>';
  html += '<div class="receiptrow"><span>Filed</span><span>'+b.filedAt+'</span></div>';
  html += '</div>';
  return html;
}

// ---------------- ROUND 3: THE BEATS (on #r3Scrim) ----------------
// Timers are ceilings and nothing here expires (B13): every wait is short and scripted,
// and the 90s write bar is decoration over a Done button that never locks.
function r3Later(claimId, fn, ms){ var r = getR3(claimId); r.timers.push(setTimeout(function(){ fn(); }, ms)); }
function r3ClearTimers(claimId){ var r = getR3(claimId); r.timers.forEach(clearTimeout); r.timers = []; }
function r3Go(claimId, beat){
  var r = getR3(claimId);
  r3ClearTimers(claimId);
  r.beat = beat; r.naming = null;
  if(beat==="write" && !r.writeStartedAt) r.writeStartedAt = Date.now();
  if(beat==="rate" && !r.notes) r3SeedNotes(claimId);
  render();
}
var r3ScreenKey = null;
function renderR3(){
  var el = document.getElementById("r3Scrim");
  if(!el) return;
  var claim = r3ActiveClaim();
  if(!claim || pendingStory !== null){ r3ScreenKey = null; el.className = "onboard-scrim"; el.innerHTML = ""; return; }
  var r = getR3(claim.id);
  // Rebuilding the node is what replays the entrance animations and steals focus out of
  // the note box, so only rebuild when the screen is actually a different screen — same
  // one-shot rule as renderStorySummary (storyCardKey). Typing and cite taps write state
  // directly; the key deliberately leaves r.text out.
  var key = [claim.id, r.beat, JSON.stringify(r.spot), r.naming, JSON.stringify(r.rulings),
             r.cites.join(","), JSON.stringify(r.ratings)].join("|");
  if(key === r3ScreenKey && el.innerHTML) return;
  r3ScreenKey = key;
  var ta = document.getElementById("r3ta"), focus = ta && document.activeElement===ta, pos = focus ? ta.selectionStart : 0;
  var R = {transition:r3RenderTransition, spot:r3RenderSpot, wait:r3RenderWait, flash:r3RenderFlash, noteintro:r3RenderNoteIntro,
           write:r3RenderWrite, ratein:r3RenderRateIn, rate:r3RenderRate, file:r3RenderFile};
  el.innerHTML = (R[r.beat] || r3RenderTransition)(claim, r);
  el.className = "onboard-scrim active";
  if(focus){ var t2 = document.getElementById("r3ta"); if(t2){ t2.focus(); t2.setSelectionRange(pos, pos); } }
}

// ---- 1 · transition (B2): why you're looking at the post again ----
function r3RenderTransition(claim, r){
  // Tara, 9/4 eve: spotting is its OWN round now (it felt out of place as the first beat
  // of "Community note"). Four rounds: 1 Gut check · 2 Investigation · 3 Spot the tell ·
  // 4 Community note — 1 and 3 are silent solo looks at the post, 2 and 4 are team work.
  return '<div class="r3full"><div class="onboard-kicker">Round 3 · Spot the tell</div><div class="onboard-big">👀</div>'+
    '<div class="onboard-title">One more look at the post.</div>'+
    '<div class="onboard-sub">You know what happened now. Cross out the part that was working on you.</div>'+
    '<div class="onboard-cta"><button class="r3btn" onclick="r3Go('+claim.id+',\'spot\')">Look at it again</button></div></div>';
}

// ---- Round 4's door (9/4 eve, four rounds): a change of job gets a full-screen card ----
// Tara, later the same evening: "I love the energy of Defend your evidence but in the spirit
// of simplify it doesn't really work — people will just click through. It makes more sense
// to go right to writing." The listen / your-turn screens (B5–B9) are DELETED; the flash goes
// here, and here goes straight to Write. What survives of Defend: a 🚩 on every cite row of
// the Write screen, and one rule — "speak up: if you flag evidence, tell your team why."
function r3RenderNoteIntro(claim, r){
  return '<div class="r3full"><div class="onboard-kicker">Round 4 · Community note</div><div class="onboard-big">📝</div>'+
    '<div class="onboard-title">Now write what actually happened.</div>'+
    '<div class="onboard-sub">Everyone writes a note from the case file. The one your team rates most helpful goes on the post.</div>'+
    '<div class="doorrule">🚩 Speak up. If you flag a piece of evidence, tell your team why — out loud.</div>'+
    '<div class="onboard-cta"><button class="r3btn" onclick="r3Go('+claim.id+',\'write\')">Start writing</button></div></div>';
}

// ---- the post, whole and in context. mode: "tap" (spot beat), "all" (flash: everyone's slashes) ----
function r3PostHTML(claim, r, mode, extraCls){
  var W = r3Words(claim), slashers = {};
  if(mode==="all"){ PLAYERS.forEach(function(p){ var s = r3SpotOf(claim, p.id); if(s && !s.straight && s.i!=null){ (slashers[s.i] = slashers[s.i]||[]).push(p.id); } }); }
  if(mode==="tap" && r.spot && !r.spot.straight) slashers[r.spot.i] = ["you"];
  var body = W.map(function(w, i){
    var who = slashers[i] || [];
    var live = mode==="tap" && r.naming===i;
    var cls = "tok"+(mode==="tap"?" tap":"")+(who.length?" slashed":"")+(live?" live":"");
    var style = who.length ? ' style="text-decoration-color:'+P(who[0]).color+'"' : "";
    var avs = who.length ? '<span class="tokavs">'+who.map(function(pid){ return r3Av(pid, mode==="all" && r3Matched(claim, pid) ? "hit" : ""); }).join("")+'</span>' : "";
    var on = mode==="tap" ? ' onclick="r3TapWord('+claim.id+','+i+')"' : "";
    return '<span class="'+cls+'"'+style+on+'>'+escapeHtml(w)+avs+'</span>';
  }).join(" ");
  var bg = claim.background || {}, eng = BASE_ENGAGEMENT[claim.id] || 10;
  var likes = formatCount(Math.round(eng*1000 + claim.id*173)), comments = formatCount(Math.round(eng*180 + claim.id*37));
  var got = '<span class="spotgot">'+PLAYERS.map(function(p){ return r3Av(p.id); }).join("")+'</span>';
  return '<div class="r3post '+(extraCls||"")+'" style="background:linear-gradient(200deg, hsl('+claim.hue+',48%,17%), #06070c 78%)">'+
    '<div class="spothead"><span class="spotav">'+posterInitial(claim)+'</span><span class="spotwho"><span class="spotname">'+(bg.displayName||claim.source)+'</span>'+
    '<span class="spothandle">'+(bg.handle||claim.source)+(bg.followers ? ' · '+bg.followers+' followers' : '')+'</span></span>'+got+'</div>'+
    '<div class="spotbody">'+body+'</div>'+
    '<div class="spotstats"><span>❤️ '+likes+'</span><span>💬 '+comments+'</span><span>↻ shared a lot</span></div>'+
    '</div>';
}

// ---- 2 · SPOT (silent, B4) — direct state writes, one render per tap ----
function r3TapWord(claimId, i){ var r = getR3(claimId); if(r.beat!=="spot") return; r.naming = i; render(); }
function r3PickChip(claimId, key){ var r = getR3(claimId); if(r.naming===null) return; r.spot = {i:r.naming, key:key}; r.naming = null; render(); }
function r3PickStraight(claimId){ var r = getR3(claimId); r.spot = {straight:true}; r.naming = null; render(); }
function r3UndoSpot(claimId){ var r = getR3(claimId); r.spot = null; r.naming = null; render(); }
function r3NeverMind(claimId){ var r = getR3(claimId); r.naming = null; render(); }
function r3SpotDone(claimId){
  var r = getR3(claimId);
  if(!r.spot) return;
  r.waitN = 2;
  r3Go(claimId, "wait");
  // Done is a ceiling: the other two land, then the flash. The count is written straight
  // into the DOM so the spinner doesn't restart.
  r3Later(claimId, function(){ r.waitN = 1; var w = document.getElementById("r3waitline"); if(w) w.textContent = "Waiting on 1 teammate…"; }, 800);
  r3Later(claimId, function(){ r3Go(claimId, "flash"); }, 1500);
}
function r3RenderSpot(claim, r){
  var naming = r.naming!==null, s = r.spot;
  var h = '<div class="r3col"><div class="r3scroll">';
  h += '<div class="r3kick">Round 3 · Spot the tell <span class="mode">silent</span></div>';
  h += '<div class="r3title">Cross out the part that was working on you.</div>';
  h += '<div class="r3sub">Tap a word. Then say what it was doing. Everyone\'s on the same post — no talking yet.</div>';
  h += r3PostHTML(claim, r, "tap", naming ? "live" : (s ? "done" : ""));
  if(naming){
    h += '<div class="spotname-panel"><div class="spotq">How was this one manipulating us?</div><div class="spotchips">'+
      r3SpotTells().map(function(t){ return '<button class="spotchip'+(s && s.key===t.key && s.i===r.naming ? " on":"")+'" onclick="r3PickChip('+claim.id+',\''+t.key+'\')">'+t.emoji+' '+t.name+'</button>'; }).join("")+
      '<button class="spotchip g" onclick="r3PickStraight('+claim.id+')">✅ '+SPOT_STRAIGHT+'</button></div>'+
      '<div class="spotcalled"><span class="spotundo" onclick="r3NeverMind('+claim.id+')">never mind</span></div></div>';
  } else if(s){
    h += '<div class="spotcalled'+(s.straight?" straight":"")+'"><span class="spotcalledlbl">You called it</span>'+r3ChipLabel(s)+
      '<span class="spotundo" onclick="r3UndoSpot('+claim.id+')">change</span></div>';
  } else {
    h += '<div class="spotstraight" onclick="r3PickStraight('+claim.id+')">✅ '+SPOT_STRAIGHT+'</div>';
  }
  h += '</div><div class="r3foot"><button class="r3btn" id="r3spotDone" '+(s?"":"disabled")+' onclick="r3SpotDone('+claim.id+')">Done</button></div></div>';
  return h;
}
function r3RenderWait(claim, r){
  return '<div class="r3col"><div class="r3scroll"><div class="r3kick">Round 3 · Spot the tell <span class="mode">silent</span></div>'+
    r3PostHTML(claim, r, "tap", "dim")+'<div class="r3waiting"><div class="r3spin"></div><span id="r3waitline">Waiting on '+r.waitN+' teammate'+(r.waitN===1?'':'s')+'…</span></div></div></div>';
}
// ---- 2b · FLASH (B1): everyone's slashes + chips on the post, and the real tell named ----
function r3RenderFlash(claim, r){
  var h = '<div class="r3col"><div class="r3scroll">';
  h += '<div class="r3kick">Round 3 · The flash <span class="mode">everyone\'s in</span></div>';
  h += '<div class="r3title anim">Here\'s what your team saw.</div>';
  h += '<div class="r3sub">Everyone\'s slash is on the post. The tell is underneath.</div>';
  h += r3PostHTML(claim, r, "all");
  var who = r3Callers(claim), avs = who.map(function(p){ return r3Av(p.id); }).join(""), names = who.map(function(p){ return p.name; }).join(", ");
  var nobody = '<span>Nobody called it this time.</span>';

      '<div class="tellwords">This one held up. Your note says so.</div>'+
      '<div class="tellcalled">'+(who.length ? avs+'<span>'+names+' called it</span>' : nobody)+'</div></div>';
  } else {
    var card = TELL[claim.cardTell], dig = TELL[claim.tell];

      '<div class="tellwords">'+(claim.cardWords ? '“<b>'+escapeHtml(claim.cardWords)+'</b>” — ' : '')+(R3_CARD_LINE[claim.cardTell] || card.desc)+'</div>'+
      '<div class="tellcalled">'+(who.length ? avs+'<span>'+names+' called it — ✓ on the post</span>' : nobody)+'</div>'+
      (dig ? '<div class="tellunder">Underneath it, your dig found <b>'+dig.emoji+' '+dig.name+'</b> — '+(R3_DIG_UNDER[claim.tell] || r3DigPlain(claim)+'.')+'</div>' : '')+

// ---- 4 · WRITE (silent, B10–B13) ----
// Direct DOM writes on keystroke (no render()) so the note box never loses the cursor
// mid-word — full re-renders steal focus out from under a live input. Cite taps do render,
// and renderR3 restores focus + caret when they do.
function r3Type(claimId, el){
  var r = getR3(claimId);
  r.text = el.value;
  var b = document.getElementById("r3writeDone"); if(b) b.disabled = !r3CanWrite(claimId);
}
function r3CanWrite(claimId){ var r = getR3(claimId); return r.text.trim().length>0 && r.cites.length>=1; }
function r3ToggleCite(claimId, clipId){
  var r = getR3(claimId), i = r.cites.indexOf(clipId), b = getBoard(claimId);
  if(i>=0) r.cites.splice(i,1); else r.cites.push(clipId);
  r.cites.sort(function(a, c){ return b.board.indexOf(a) - b.board.indexOf(c); });
  render();
}
function r3WriteDone(claimId){ if(r3CanWrite(claimId)) r3Go(claimId, "ratein"); }
// 🚩 on a cite row: the exhibit stays on the board and stays citable (B8) — a flag is a
// warning to the team, not a delete. Toggling it is the moment the door's rule points at.
function r3ToggleFlag(claimId, clipId, ev){
  if(ev) ev.stopPropagation();
  var r = getR3(claimId);
  if(r.rulings[clipId]==="flag") delete r.rulings[clipId]; else r.rulings[clipId] = "flag";
  render();
}
function r3RenderWrite(claim, r){
  var b = getBoard(claim.id), straight = !claim.cardTell;
  var elapsed = r.writeStartedAt ? Math.min(90, (Date.now()-r.writeStartedAt)/1000) : 0;
  var h = '<div class="r3col"><div class="r3scroll">';
  h += '<div class="r3kick">Round 4 · Write <span class="mode">silent · 90s</span></div>';
  h += '<div class="r3clock"><i style="animation-delay:-'+elapsed.toFixed(1)+'s"></i></div><div class="clocklbl"><span>everyone done = move on</span><span>1:30 ceiling</span></div>';
  h += '<div class="r3title">Write what actually happened.</div>';
  h += '<div class="r3lbl">What actually happened</div>';
  h += '<textarea class="communitynote r3ta" id="r3ta" placeholder="Say it plainly, in one or two sentences. A reader who only sees the post should get the real picture." oninput="r3Type('+claim.id+', this)">'+escapeHtml(r.text)+'</textarea>';
  h += '<div class="r3lbl">Cite your evidence · 🚩 flag what doesn\'t hold</div>';
  var flagged = [];
  h += '<div class="citerows">'+r3Exhibits(claim.id).map(function(e){
    var on = r.cites.indexOf(e.clipId)>=0, fl = r.rulings[e.clipId]==="flag";
    if(fl) flagged.push(e.letter);
    return '<div class="citerow'+(on?" on":"")+(fl?" flagged":"")+'" onclick="r3ToggleCite('+claim.id+',\''+e.clipId+'\')"><span class="citelet">'+e.letter+(fl?'<i class="mark f">🚩</i>':'')+'</span>'+
      '<span class="citebody"><span class="citetext">'+escapeHtml(e.clip.text)+'</span><span class="citewho">'+escapeHtml(r3ClipWho(e.clip))+' · '+(P(e.owner).isYou?"you":P(e.owner).name)+' added it'+(fl?' · 🚩 flagged':'')+'</span></span>'+
      '<span class="citeflag'+(fl?" on":"")+'" title="'+(fl?"unflag":"flag it")+'" onclick="r3ToggleFlag('+claim.id+',\''+e.clipId+'\', event)">🚩</span>'+
      '<span class="citetick">'+(on?"✓":"")+'</span></div>';
  }).join("")+'</div>';
  // The Defend spirit, as one line: the moment you flag something, say why.
  if(flagged.length) h += '<div class="speakup">🚩 You flagged '+(flagged.length===1 ? 'Exhibit '+flagged[0] : 'Exhibits '+flagged.join(", "))+' — speak up and tell your team why.</div>';
  var hint = r.cites.length===0 ? "Tap at least one exhibit." : (r.cites.length===1 ? "A second source makes it stronger." : "Cited: "+r3CiteLabel(claim.id, r.cites));
  h += '<div class="citehint'+(r.cites.length>=2?" good":"")+'">'+hint+'</div>';
  h += '<div class="autoline"><div class="r3lbl"><span>auto</span> from your call + the real tell</div><div class="autotext'+(straight?" g":"")+'">'+r3AutoLine(claim, true)+'</div></div>';
  h += '</div><div class="r3foot"><button class="r3btn" id="r3writeDone" '+(r3CanWrite(claim.id)?"":"disabled")+' onclick="r3WriteDone('+claim.id+')">Done</button></div></div>';
  return h;
}

// ---- 5 · RATE (silent, B14–B16) ----
// The other three's notes come from r3NpcDrafts, with cites seeded 1 / 2 / 2 so cites
// matter (B19): a one-cite player note can lose to an NPC's two-cite note.
function r3SeedNotes(claimId){
  var r = getR3(claimId), b = getBoard(claimId), claim = claimById(claimId), d = r3NpcDrafts(claim), bd = b.board;
  function pick(idxs){ var out = []; idxs.forEach(function(i){ var c = bd[Math.min(i, bd.length-1)]; if(c && out.indexOf(c)<0) out.push(c); }); return out; }
  r.notes = {
    you:   {text:r.text.trim(), cites:r.cites.slice()},
    maya:  {text:d.maya,  cites:pick([0])},
    diego: {text:d.diego, cites:pick([0, 2])},
    priya: {text:d.priya, cites:pick([0, bd.length-1])}
  };
}
function r3AllNotes(claimId){
  var r = getR3(claimId), order = ["maya","priya","you","diego"];      // fixed, anonymous while rating
  return order.map(function(pid, i){ var n = r.notes[pid]; return {label:"NOTE "+String.fromCharCode(65+i), pid:pid, text:n.text, cites:n.cites}; });
}
function r3WordCount(t){ return t.trim().split(/\s+/).filter(Boolean).length; }
// B19: NPCs rate honestly — each ranks the three notes it can see by cites, then length; top two HELPFUL, last NOT.
function r3NpcRatings(claimId, pid){
  var seen = r3AllNotes(claimId).filter(function(n){ return n.pid!==pid; })
    .sort(function(a, b){ return (b.cites.length-a.cites.length) || (r3WordCount(b.text)-r3WordCount(a.text)); });
  var out = {}; seen.forEach(function(n, i){ out[n.pid] = i<2 ? "h" : "n"; }); return out;
}
// Most helpful wins; tie → most cites → quietest author (B16). No re-vote, no coin flip.
function r3ComputeResult(claimId){
  var r = getR3(claimId), notes = r3AllNotes(claimId), helpful = {};
  notes.forEach(function(n){ helpful[n.pid] = 0; });
  ["maya","diego","priya"].forEach(function(pid){ var rr = r3NpcRatings(claimId, pid); Object.keys(rr).forEach(function(t){ if(rr[t]==="h") helpful[t]++; }); });
  Object.keys(r.ratings).forEach(function(t){ if(r.ratings[t]==="h") helpful[t]++; });
  var quiet = r3QuietOrder(claimId).map(function(p){ return p.id; });
  var ranked = notes.slice().sort(function(a, b){
    return (helpful[b.pid]-helpful[a.pid]) || (b.cites.length-a.cites.length) || (quiet.indexOf(a.pid)-quiet.indexOf(b.pid));
  });
  return {helpful:helpful, ranked:ranked, winner:ranked[0]};
}
function r3Rate(claimId, pid, v){ var r = getR3(claimId); r.ratings[pid] = v; render(); }
function r3RateDone(claimId){
  var r = getR3(claimId);
  if(!["maya","diego","priya"].every(function(p){ return !!r.ratings[p]; })) return;
  r.result = r3ComputeResult(claimId);
  r3Go(claimId, "file");
}
function r3RenderRate(claim, r){
  var notes = r3AllNotes(claim.id), done = ["maya","diego","priya"].every(function(p){ return !!r.ratings[p]; });
  var h = '<div class="r3col"><div class="r3scroll">';
  h += '<div class="r3kick">Round 4 · Rate <span class="mode">silent</span></div>';
  h += '<div class="r3title">Which note helps a reader most?</div>';
  h += '<div class="r3sub">No names. Rate every note but your own. No lobbying.</div>';
  notes.forEach(function(n){
    var mine = n.pid==="you";
    h += '<div class="r3notecard'+(mine?" mine":"")+'"><div class="ntop">'+n.label+(mine?' · yours':'')+'<span class="cnt"><b>'+n.cites.length+'</b> '+(n.cites.length===1?"source":"sources")+' cited</span></div>';
    h += '<div class="nbody">'+escapeHtml(n.text)+'</div>';
    h += '<div class="ncites">'+r3CiteLabel(claim.id, n.cites)+'</div>';
    if(mine) h += '<div class="yours">yours — you don’t rate your own</div>';
    else h += '<div class="rate"><button class="ratebtn h'+(r.ratings[n.pid]==="h"?" on":"")+'" onclick="r3Rate('+claim.id+',\''+n.pid+'\',\'h\')">👍 Helpful</button>'+
      '<button class="ratebtn n'+(r.ratings[n.pid]==="n"?" on":"")+'" onclick="r3Rate('+claim.id+',\''+n.pid+'\',\'n\')">Not helpful</button></div>';
    h += '</div>';
  });
  h += '</div><div class="r3foot"><button class="r3btn" id="r3rateDone" '+(done?"":"disabled")+' onclick="r3RateDone('+claim.id+')">Done</button></div></div>';
  return h;
}

function r3RenderFile(claim, r){
  var res = r.result || (r.result = r3ComputeResult(claim.id)), w = res.winner, p = P(w.pid), straight = !claim.cardTell;
  var h = '<div class="r3col"><div class="r3scroll"><div class="r3kick">Round 4 · File it <span class="mode talk">talk</span></div>';

// The winning note becomes THE note: what r3NoteText() reads, what the receipt cites, what
// rides on the post. Then the existing filing path — stamp, spread stats, story summary.
function r3File(claimId){
  var r = getR3(claimId);
  var res = r.result || (r.result = r3ComputeResult(claimId)), w = res.winner;
  r.note = {text:w.text, cites:w.cites.slice(), by:w.pid};
  r.sources = w.cites.slice();
  r3ClearTimers(claimId);
  fileBoard(claimId);
}
function fileBoard(claimId){
  var b = getBoard(claimId);
  // No determination to check any more (8/31/2026) — the gate is simply that the note
  // exists. Submitting it files the case and stamps it.
  if(!r3NoteText(b)) return;
  b.r3.beat = "filed";
  b.caseNo = claimNumber(claimId);
  // Where the live spread meter stands the instant BEFORE this case lands — the end
  // report's balance bar animates down from here, which it can't do once the last
  // contested claim has already flipped to filed and the meter reads zero.
  var live = spreadStats();
  sessionState.lastLiveRedPct = live.total>0 ? Math.round(100*live.redHeat/live.total) : 0;
  b.filed = true;
  justFiledClaimId = claimId;
  var d = new Date();
  var h = d.getHours() % 12 || 12;
  var m = d.getMinutes();
  b.filedAt = (d.getMonth()+1)+"/"+d.getDate()+"/"+d.getFullYear()+" · "+h+":"+(m<10?"0":"")+m;
  // Snapshot how far this story got before the table shut it down — the
  // end-of-session report is built out of these.
  recordFiling(claimId);
  // The reveal unlocks here and nowhere earlier.
  commitTells(claimId);
  // ...and it now gets its own screen, a beat later, so the FILED stamp lands first.
  // The tells are NOT on the filed card and NOT in the note (Tara, 8/30) — the note
  // says what happened, this says what was done to each of you.
  setTimeout(function(){ pendingStory = claimId; render(); }, 2000);
  render();
  // Filing the last contested case is the end of the game.
  if(allCasesFiled()) endSession();
}

// ---------------- SPREAD ----------------
// Did anybody at the table read this one as spun or worse? This is the spin axis
// ([[manipulation-axis-reframe]]: straight up → spun → playing you), not consensus.
// Consensus stopped being a thing the game says anywhere on 8/31/2026 — a story two
// people happened to agree about was never "settled", it was just unexamined.
function tableFlagged(claim){
  var v = claimVotesFor(claim);
  return PLAYERS.some(function(pl){ return v[pl.id] && v[pl.id] !== "true"; });
}
function spreadStats(){
  var redHeat = 0, greenHeat = 0, playingN = 0, straightN = 0, filedN = 0, skippedN = 0;
  CLAIMS.forEach(function(c){
    var b = getBoard(c.id);
    var h = heat[c.id] || 0;
    if(b.filed){ greenHeat += h; filedN++; }
    else if(tableFlagged(c)){ redHeat += h; playingN++; }
    else {
      // Nobody flagged it — low threat, so it burns quietly rather than not at all.
      greenHeat += h*0.3; straightN++;
      if(claimStatus(c)==="skipped") skippedN++;   // ...or nobody answered at all
    }
  });
  return {redHeat:redHeat, greenHeat:greenHeat, total:Math.max(1, redHeat+greenHeat),
          playingN:playingN, straightN:straightN, filedN:filedN, skippedN:skippedN};
}
function renderSpread(){
  var s = spreadStats();
  var pr = Math.round(100*s.redHeat/s.total);
  var top = CLAIMS.filter(function(c){ return !getBoard(c.id).filed && tableFlagged(c); })
    .sort(function(a,b){ return (heat[b.id]||0)-(heat[a.id]||0); })[0];
  var html = navbarBack("The Spread", goHome);
  html += '<div class="appbody">';
  if(sessionState.ended){
    html += '<div class="wtile" style="cursor:pointer; border-color:rgba(48,209,88,.35);" onclick="openEndReport()">';
    html += '<div class="wtag"><span class="dot"></span>SESSION COMPLETE</div>';
    html += '<div class="topclaim">Every case is filed — nothing is spreading anymore.</div>';
    html += '<div class="wsub">Tap to reopen the final report</div></div>';
  }
  html += '<div class="wrow3">';
  // Was CONTESTED / AGREED — table consensus, which the game stopped saying on
  // 8/31/2026 (Tara: "maybe it's playing with you vs straight up"). These now read the
  // spin axis instead, and count only stories still loose, so the three tiles always
  // add up to the feed.
  html += '<div class="wtile"><div class="wtag"><span class="dot"></span>PLAYING YOU</div><div class="wnum" style="color:var(--ios-red);">'+s.playingN+'</div><div class="wsub">still spreading</div></div>';
  html += '<div class="wtile"><div class="wtag"><span class="dot"></span>STRAIGHT UP</div><div class="wnum" style="color:var(--ios-label2);">'+s.straightN+'</div><div class="wsub">nobody flagged'+(s.skippedN?' \u00b7 '+s.skippedN+' never called':'')+'</div></div>';
  html += '<div class="wtile"><div class="wtag"><span class="dot"></span>FILED</div><div class="wnum" style="color:var(--ios-green);">'+s.filedN+'</div><div class="wsub">contained</div></div>';
  html += '</div>';
  html += '<div class="wtile"><div class="wtag"><span class="dot"></span>BALANCE</div><div class="wsub">spreading vs. contained attention</div>';
  html += '<div class="balancebar"><div class="r" style="width:'+pr+'%"></div><div class="g" style="width:'+(100-pr)+'%"></div></div></div>';
  if(top){
    html += '<div class="wtile" style="cursor:pointer;" onclick="openClaim('+top.id+')">';
    html += '<div class="wtag"><span class="dot"></span>TOP SPREADING RIGHT NOW</div>';
    html += '<div class="topclaim">'+top.headline+'</div>';
    html += '<div class="wsub">🔥 '+Math.round(heat[top.id]||0)+' heat · tap to investigate</div></div>';
  }
  html += '<div style="color:var(--ios-label3); font-size:12px; line-height:1.6; margin-top:6px;">Heat climbs on its own the longer a story sits un-filed — that\'s attention, not accuracy. Filing a case is the only thing that brings it back down. The ones nobody flagged burn quietly in the background, which isn\'t the same as them being fine.</div>';
  html += '</div>';
  document.getElementById("screenArea").innerHTML = html;
}
