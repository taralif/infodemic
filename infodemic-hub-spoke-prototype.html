    {title:"Read the profile, not just the post", sub:"Bio, join date, what they link to",
      mock:'<div class="onboardmock"><div class="onboardmock-mini"><div class="onboardmock-miniavatar">D</div><div class="onboardmock-minibio">your fav products, dupes + drama \ud83d\udecd\ufe0f | shop my finds below \ud83d\udd17</div><div class="onboardmock-minimeta">2.2M followers \u00b7 <b>Joined Jun 2020</b></div></div></div>'},
    {title:"Check the date and the caption", sub:"Same picture can carry a different story",
      mock:'<div class="onboardmock"><div class="onboardmock-row"><div class="onboardmock-rowtext">The same photo, posted before</div><div class="onboardmock-rowmeta"><b>3 years ago</b> \u00b7 different caption</div></div><div class="onboardmock-row"><div class="onboardmock-rowtext">Wire coverage of the same event</div><div class="onboardmock-rowmeta">named outlet \u00b7 dated</div></div></div>'},
    {title:"Ask what it\u2019s citing", sub:"A confident answer isn\u2019t a source",
      mock:'<div class="onboardmock"><div class="onboardmock-bubble">Studies suggest this is well established \u2014 <b>but no study is named.</b></div></div>'},
    {big:"\ud83d\udd12", title:"Which one was it? File and find out.", sub:"The list stays open the whole game"}
  ]},
  // The `board` tour was DELETED 8/31/2026 (Tara). It taught mechanics that no longer
  // exist and one that was explicitly removed: "Compare versions" (gone with per-player
  // versions), "Write the note — required to file" described the old justification box,
  // and "File to win" contradicts the no-scoring decision outright. Its replacement is
  // the Round 3 note tour, which is designed but not built — see the project memory
  // note infodemic-instruction-tour-merge-list. Deliberately left absent rather than
  // patched: a wrong tour is worse than no tour.
  // Rewritten 8/31/2026. The old version described an ambient meter you could ignore.
  // Triage changes what it means: you can only chase two stories, so the ones you leave
  // keep climbing — the meter is now the thing you are choosing against, and the tour
  // should say the cost out loud rather than reassuring players that it "never drives."
  // The Round 3 note tour — replaces the deleted `board` tour. Team-gated like round1
  // and investigate: the role chain is synchronous, so the table has to be on the same
  // step before the first draft box opens. Fires on the same gate that opens Round 3
  // (enough evidence pooled to write from), not on a button tap.
  // The Round 2 → 3 gate, rebuilt (B18, 9/4/2026 — Tara: "something simpler, more clear
  // with the goal"). ONE question echoing the cluster A purpose card, two taps. It fires
  // per story on the evidence gate (r3GateClaim), and it is a decision, not a tour: the
  // defer / re-ask mechanics underneath (deferOnboard, re-fire on addToBoard, the board's
  // door) are unchanged. Not team-gated any more — the mock has no waiting screen; the
  // Spotter's own "waiting on your teammates" beat is where the team catches up.
  note: {teamGated:false, choice:true, screens:[
    {kicker:"ROUND 2 → ROUND 3", big:"🎯", title:"Can your team say what actually happened yet?",
      count:function(){ return r3GateCount()+" in your case file — enough to write."; }}
  ]},
  spread: {teamGated:false, screens:[
    {kicker:"THE SPREAD", big:"📊", title:"Attention isn't accuracy", sub:"A story spreads whether or not it's true"},
    {big:"🔥", title:"The ones you skip keep climbing", sub:"Every story you don't take is still out there"},
    {big:"🧯", title:"Filing a case cools it", sub:"Contained — that's the whole job"},
    {big:"⚖️", title:"You can't catch them all", sub:"That's the point. Pick the ones worth catching."}
  ]}
};
// Board's tour used to auto-chain right after investigate's, both up front before
// anyone had gathered anything (8/18/2026, first pass). Revised same day, per Tara
// (mirrored from infodemic-multiplayer-prototype.html): "one shared board" only
// means something once there's an actual case sitting in front of you, so it now
// waits until some claim's board has real evidence on it.
var BOARD_TOUR_EVIDENCE_THRESHOLD = 4;
function onboardKeyFor(){
  if(currentApp==="round1"){
    if(!roundState.started) return seenOnboard.round1 ? null : "round1";
    if(!roundState.ended) return null;
    if(!roundState.readyForR2Popup) return null; // wait for the shuffle to settle first
    if(triageState.active) return null;   // the picker owns the screen while it's up
    if(!seenOnboard.investigate) return "investigate";
    // The note tour fires on the gate that opens Round 3 — enough evidence pooled on
    // some claim to write from. Same constant the deleted board tour used, because it
    // was always the same idea.
    // Per story, not per session: it asks again for the next case (r3GateClaim skips
    // stories that already answered yes).
    // The note gate used to auto-fire here at the evidence minimum (B18). Retired 9/4
    // (Rebecca's shape): the Ready button on the case file is the door — readyForNote().
    // ONBOARD_CONTENT.note is kept for reference; nothing returns "note" any more.
    return null;
  }
  // The Tells tour is NOT auto-chained into Round 2 (8/24/2026, Tara) \u2014 it fires
  // only when a player actually taps the \ud83e\udde0 badge and opens the library. Round 2
  // already hands you two tours back to back; this one is for the moment someone
  // chooses to go look, which is also when they're most likely to read it.
  if(currentApp==="tells") return seenOnboard.tells ? null : "tells";
  if(currentApp==="spread") return seenOnboard.spread ? null : "spread";
  return null;
}
function maybeShowOnboard(){
  var key = onboardKeyFor();
  if(key !== pendingOnboard) onboardScreenIdx = 0;
  pendingOnboard = key;
  if(key && ONBOARD_CONTENT[key].teamGated) scheduleNpcOnboardReady(key);
  renderOnboard();
}
function isTeamReady(key){
  var ready = onboardReady[key] || [];
  return PLAYERS.every(function(p){ return ready.indexOf(p.id) !== -1; });
}
// Simulated teammates each mark themselves ready on a staggered delay, once per key
// (guarded by onboardNpcScheduled) regardless of how many times this key's tour gets
// recomputed by render().
function scheduleNpcOnboardReady(key){
  if(onboardNpcScheduled[key]) return;
  onboardNpcScheduled[key] = true;
  PLAYERS.filter(function(p){ return !p.isYou; }).forEach(function(p, i){
    setTimeout(function(){
      if((onboardReady[key]||[]).indexOf(p.id) !== -1) return;
      onboardReady[key] = (onboardReady[key]||[]).concat([p.id]);
      if(isTeamReady(key)) finalizeOnboard(key); else render();
    }, 900 + i*700 + Math.random()*500);
  });
}
// "Still investigating" closes the gate without marking it seen, so the tour is still
// owed. It comes back the moment the board grows — addToBoard clears this — which makes
// the loop honest: go find more, and the question gets asked again with a bigger number.
// The board also carries its own "We know what happened" button while deferred, so a
// table that changes its mind doesn't have to add a clip it doesn't need.
var onboardDeferred = {};
function deferOnboard(key){
  onboardDeferred[key] = true;
  pendingOnboard = null;
  onboardScreenIdx = 0;
  render();
}
function onboardMarkReady(key){
  onboardDeferred[key] = false;
  if((onboardReady[key]||[]).indexOf("you") !== -1) return;
  onboardReady[key] = (onboardReady[key]||[]).concat(["you"]);
  if(isTeamReady(key)) finalizeOnboard(key); else render();
}
function finalizeOnboard(key){
  seenOnboard[key] = true;
  pendingOnboard = null;
  onboardScreenIdx = 0;
  if(key==="round1" && !roundState.started) beginRound1();
  // "Yes — let's write it": Round 3 opens on the story that crossed the gate.
  if(key==="note"){ var gateClaim = r3GateClaim(); if(gateClaim) r3Start(gateClaim.id); }
  // A clearer hand-off into Round 2: rather than just dropping back into the feed and
  // hoping players notice a corner nub on their own, open the first contested story
  // straight to its "how do you wanna dig in" move menu — same agency, guided start.
  if(key==="investigate" && currentApp==="round1"){
    var firstContested = CLAIMS.find(function(c){ return triagePicked(c.id) && !getBoard(c.id).filed; }) ||
                         CLAIMS.find(function(c){ return !getBoard(c.id).filed; });
    if(firstContested){
      openSpoke(firstContested.id);
      setTimeout(function(){
        var el = document.getElementById("slide-"+firstContested.id);
        if(el && typeof el.scrollIntoView === "function") el.scrollIntoView({behavior:"smooth", block:"start"});
      }, 50);
    }
  }
  render(); // notices once the board tour's own trigger condition (enough evidence gathered) is met
}
function onboardNext(){
  if(!pendingOnboard) return;
  var gate = ONBOARD_CONTENT[pendingOnboard];
  var isLast = onboardScreenIdx === gate.screens.length - 1;
  if(!isLast){ onboardScreenIdx++; renderOnboard(); return; }
  if(gate.choice) return;   // a two-way gate is answered by its buttons, never by a tap on the tap zone
  if(gate.teamGated) onboardMarkReady(pendingOnboard);
  else finalizeOnboard(pendingOnboard);
}
// The "yes" half of a two-way gate (the note gate). Clears a defer, then finalizes —
// through the team-ready gate if the tour is team-gated, straight through otherwise.
function onboardYes(key){
  onboardDeferred[key] = false;
  if(ONBOARD_CONTENT[key].teamGated) onboardMarkReady(key);
  else finalizeOnboard(key);
}
function onboardPrev(){
  if(!pendingOnboard) return;
  if(onboardScreenIdx > 0){ onboardScreenIdx--; renderOnboard(); }
}
function onboardTapZone(e){
  var rect = e.currentTarget.getBoundingClientRect();
  var x = e.clientX - rect.left;
  if(x < rect.width/2) onboardPrev(); else onboardNext();
}
function renderOnboard(){
  var el = document.getElementById("onboardScrim");
  if(!pendingOnboard){ el.className = "onboard-scrim"; el.innerHTML = ""; return; }
  var gate = ONBOARD_CONTENT[pendingOnboard];
  var s = gate.screens[onboardScreenIdx];
  var isLast = onboardScreenIdx === gate.screens.length - 1;
  var html = '<div class="onboard-full" onclick="onboardTapZone(event)">';
  if(s.kicker) html += '<div class="onboard-kicker">'+s.kicker+'</div>';
  html += s.mock ? s.mock : ('<div class="onboard-big">'+s.big+'</div>');
  html += '<div class="onboard-title">'+(typeof s.title === "function" ? s.title() : s.title)+'</div>';
  // `sub` may be a function so a screen can read state that isn't known when
  // ONBOARD_CONTENT is built — CLAIMS is REASSIGNED later (live-deck upgrade,
  // and again per room in loadDropForRoom), so a story count baked in at parse
  // time would show the default deck's number for every pipeline drop.
  if(s.sub) html += '<div class="onboard-sub">'+(typeof s.sub === "function" ? s.sub() : s.sub)+'</div>';
  // The note gate's count line, in the goal-line voice ("4 in your case file — enough to write.").
  if(s.count) html += '<div class="onboard-count">'+(typeof s.count === "function" ? s.count() : s.count)+'</div>';
  if(isLast){
    html += '<div class="onboard-cta" onclick="event.stopPropagation();">';
    var already = gate.teamGated && (onboardReady[pendingOnboard]||[]).indexOf("you") !== -1;
    if(gate.choice && !already){
      // A gate you can only agree with isn't a gate. "Yes" has to cost something to say,
      // which means the other answer has to be available — and a team that isn't ready
      // gets sent back to the evidence rather than dropped into the note (Tara, 8/31/2026;
      // copy from the approved mock, B18).
      html += '<div class="onboard-btn" onclick="onboardYes(\''+pendingOnboard+'\')">Yes — let\'s write it</div>';
      html += '<div class="onboard-btn ghost" onclick="deferOnboard(\''+pendingOnboard+'\')">Not yet — keep digging</div>';
    } else if(gate.teamGated){
      if(!already){
        html += '<div class="onboard-btn" onclick="onboardMarkReady(\''+pendingOnboard+'\')">I\'m ready</div>';
      } else {
        var waitingNames = PLAYERS.filter(function(p){ return (onboardReady[pendingOnboard]||[]).indexOf(p.id)===-1; }).map(function(p){ return p.name; });
        html += '<div class="onboard-waiting">'+(waitingNames.length ? 'Waiting on '+waitingNames.join(", ") : 'Everyone\'s ready — starting…')+'</div>';
      }
    } else {
      html += '<div class="onboard-btn" onclick="onboardNext()">Got it</div>';
    }
    html += '</div>';
  }
  if(gate.screens.length > 1){
    html += '<div class="onboard-dots">';
    gate.screens.forEach(function(_, i){
      html += '<div class="onboard-dot'+(i===onboardScreenIdx?' active':'')+'"></div>';
    });
    html += '</div>';
  }
  html += '</div>';
  el.innerHTML = html;
  el.className = "onboard-scrim active";
}

// ---------------- MASTER RENDER ----------------
function render(){
  if(currentApp==="lobby"){ renderLobby(); return; }
  // The end-of-session report is the last thing the game does — nothing underneath
  // it draws, onboarding included.
  if(sessionState.showingEnd){ renderEndScreen(); return; }
  if(currentApp==="round1") renderRound1();
  else if(currentApp==="spread") renderSpread();
  else if(currentApp==="tells") renderTells();
  maybeShowOnboard();
  renderStorySummary();
  renderR3();
}

// The tells live here and nowhere else in Round 3: the note said what happened, this
// says what was done to you.
var storyCardKey = null;
function renderStorySummary(){
  var el = document.getElementById("storyScrim");
  if(!el) return;
  if(pendingStory === null){ storyCardKey = null; el.className = "onboard-scrim"; el.innerHTML = ""; return; }
  var claim = CLAIMS.filter(function(c){ return c.id===pendingStory; })[0];
  if(!claim){ pendingStory = null; storyCardKey = null; el.className = "onboard-scrim"; el.innerHTML = ""; return; }
  if(storyCardKey === pendingStory) return;    // one-shot: see the entrance-animation rule
  storyCardKey = pendingStory;

  var bd = getBoard(claim.id);
  var reach = getReach(claim.id);
  // Two honest ways to say how far it got, because a fast table makes the share count
  // tiny and "0 shares before your note landed" reads as broken rather than as a win.
  // Under 200, the measure is how long it was loose — which is the thing they actually
  // controlled, and a table that files in twenty seconds should be told so.
  var rawShares = Math.round(reach.shares || 0);
  var bigVal, bigUnit, bigSub;
  if(rawShares >= 200){
    bigVal = formatCount(rawShares); bigUnit = "shares";
    bigSub = "before your note landed on it. Then it stopped.";
  } else {
    bigVal = fmtDuration(reach.looseMs || 0); bigUnit = "loose";
    bigSub = "and then your note landed. You got to this one fast.";
  }

  var html = '<div class="storywrap"><div class="storyscroll">';
  html += '<div class="storykick">Case filed \u00b7 '+(bd.caseNo||claimNumber(claim.id))+'</div>';
  html += '<div class="storytitle">You stopped this one.</div>';

  // ---- the visual: reach climbing, then your note, then flat --------------
  // The whole session has been telling them heat climbs on its own while a story sits
  // loose. This is the one moment they get to SEE it stop, so it's a drawn line rather
  // than a number: rising, a marker where the note landed, flat after.
  html += '<div class="stopviz">';
  html += '<svg viewBox="0 0 300 116" preserveAspectRatio="none" aria-hidden="true">';
  html += '<defs><linearGradient id="stopfill" x1="0" y1="0" x2="0" y2="1">'+
          '<stop offset="0%" stop-color="rgba(255,69,58,.42)"/><stop offset="100%" stop-color="rgba(255,69,58,0)"/>'+
          '</linearGradient></defs>';
  // The climb, then the flat. Two paths so they can be timed separately.
  html += '<path class="stopfill" d="M0,112 C42,104 76,84 104,64 C132,45 156,26 186,18 L300,18 L300,116 L0,116 Z" fill="url(#stopfill)"/>';
  html += '<path class="stopclimb" d="M0,112 C42,104 76,84 104,64 C132,45 156,26 186,18" fill="none" stroke="var(--ios-red)" stroke-width="3.5" stroke-linecap="round"/>';
  html += '<path class="stopflat" d="M186,18 L300,18" fill="none" stroke="var(--ios-green)" stroke-width="3.5" stroke-linecap="round"/>';
  html += '<circle class="stopdot" cx="186" cy="18" r="5.5" fill="var(--ios-green)"/>';
  html += '</svg>';
  html += '<div class="stopmark">\ud83e\uddef your note</div>';
  html += '</div>';

  html += '<div class="stopbig">'+bigVal+'<span class="stopunit">'+bigUnit+'</span></div>';
  html += '<div class="storysub">'+bigSub+'</div>';

  // ---- the receipt (9/4/2026, from the approved Round 3 mock) ----------------
  // Same rows as the filed case card, so the summary is the graph + the receipt. The
  // tell is NOT repeated here — the Round 3 flash named it (Tara chose exactly this).
  html += '<div class="receiptcard story">';
  html += '<div class="receiptrow"><span>Case number</span><span>'+(bd.caseNo||claimNumber(claim.id))+'</span></div>';
  html += '<div class="receiptrow"><span>Exhibits attached</span><span>'+bd.board.length+'</span></div>';
  html += '<div class="receiptrow"><span>Sources cited</span><span>'+(r3CiteLabel(claim.id, bd.r3 && bd.r3.sources || [])||"—")+'</span></div>';
  html += '<div class="receiptrow"><span>Filed</span><span>'+bd.filedAt+'</span></div>';
  html += '</div>';

  // ---- the one thing to take out of the room ------------------------------
  // Tara, 9/1/2026: end on a reminder to pause at your OWN feed, not on how the
  // post was framed. The framing rows used to live here; they were the third dense
  // screen in a row, and none of it was about the player's life.
  html += '<div class="pausecard">';
  html += '<div class="pausekick">\u270b One thing to take with you</div>';
  html += '<div class="pauseline">The post that gets you fastest is the one to slow down on.</div>';
  html += '<div class="pausesub">That feeling \u2014 the one that makes you want to share it before you finish reading \u2014 is somebody\u2019s work. It\u2019ll be in your feed tonight, and nobody\u2019s going to hand you a case file.</div>';
  html += '</div>';

  html += '</div><div class="storyfoot"><div class="storybtn" onclick="dismissStory()">Back to the feed</div></div>';
  html += '</div>';
  el.className = "onboard-scrim active";
  el.innerHTML = html;
}
function dismissStory(){
  pendingStory = null;
  // Triage comes back for the next case while the teacher's number isn't reached
  // (9/3/2026). With nothing left to pick the session end takes over.
  if(triageQuota() > 0 && triageChosen() === 0){ triageState.active = true; triageState.stage = "active"; }
  render();
}

// engagement gravity tick
setInterval(function(){
  // Once the session's over, attention stops moving — nothing is left un-filed to
  // gather it, and the report underneath must not keep re-rendering.
  if(sessionState.ended) return;
  CLAIMS.forEach(function(c){
    var b = getBoard(c.id);
    var cur = heat[c.id] || 0;
    // Was keyed to claimStatus "contested"/"agreed" — so a story the table happened to
    // agree about sat frozen at 3 heat no matter how long it was left. Under triage the
    // thing that makes a story climb is being LOOSE and looking like it's working on
    // someone, which is what the Spread's tiles now say too (8/31/2026).
    if(b.filed){ heat[c.id] = Math.max(2, cur - 1.2); }
    else if(tableFlagged(c)){ heat[c.id] = Math.min(HEAT_CAP, cur + Math.random()*1.6 + 0.4); }
    else { heat[c.id] = cur < 3 ? 3 : cur; }
    // Heat decays after filing, so the high-water mark has to be kept separately,
    // and shares keep totting up for as long as the claim is loose. Both feed the
    // end-of-session report; neither is shown during play.
    var reach = getReach(c.id);
    if(heat[c.id] > reach.peak) reach.peak = heat[c.id];
    // Was `status==="contested"` — `status` here is window.status (a browser global,
    // always ""), so shares never accumulated and the summary always fell back to the
    // "loose for N:NN" line. Fixed 9/4/2026: loose = Round 1 over and not yet filed.
    if(roundState.ended && !b.filed) reach.shares += heat[c.id] * SHARE_RATE;
  });
  // Skip re-rendering while a full-screen sub-moment (Time's Up interstitial, the
  // per-story reveal) is up — heat isn't shown on either screen, and re-rendering
  // them just recreates the DOM nodes underneath, which replays their one-shot
  // entrance animations on a loop instead of letting them settle.
  // The story summary joined this list on 8/31/2026 (Tara: "the animations for the role
  // cards and the final report are bouncing"); the Round 3 beats (9/4/2026) sit on the
  // same scrim pattern — renderR3 also carries its own signature guard, but the tick has
  // no business redrawing the feed under a full-screen beat either.
  var onSubScreen = roundState.showingTimesUp || revealState.active ||
                    triageState.active || r3ActiveClaim() !== null || pendingStory !== null;
  // Mirrors the multiplayer file's fix (8/16/2026 playtest): the community note
  // textarea only took a couple characters before losing focus, and the gut-check's
  // card-to-card scroll got cut off mid-animation — both caused by this tick's full
  // render() rebuilding the DOM node underneath an in-progress interaction.
  var typingInNote = document.activeElement && document.activeElement.classList &&
    document.activeElement.classList.contains("communitynote");
  var scrollingCards = Date.now() < scrollAnimUntil;
  if((currentApp==="spread" || (currentApp==="round1" && !onSubScreen)) && !typingInNote && !scrollingCards) render();
}, 2200);

function tickClock(){
  var d = new Date();
  var h = d.getHours() % 12 || 12;
  var m = d.getMinutes();
  document.getElementById("clock").textContent = h + ":" + (m<10?"0":"") + m;
}
setInterval(tickClock, 15000);
tickClock();

initLobby();
render();
</script>
